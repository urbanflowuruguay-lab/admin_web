<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Configuración de Tarifas - UrbanFlow</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 25px; background-color: #0d1117; color: #c9d1d9; margin: 0; }
        h1 { color: #58a6ff; display: flex; align-items: center; gap: 15px; }
        .description { color: #8b949e; margin-bottom: 20px; font-size: 14px; }

        .tabs { display: flex; gap: 5px; margin-bottom: 25px; flex-wrap: wrap; }
        .tab { padding: 12px 24px; border-radius: 8px 8px 0 0; cursor: pointer; font-weight: bold; font-size: 14px;
               background: #161b22; border: 1px solid #30363d; border-bottom: none; color: #8b949e; transition: 0.3s;
               display: flex; align-items: center; gap: 8px; }
        .tab:hover { background: #21262d; color: #c9d1d9; }
        .tab.active { background: #0d1117; color: #58a6ff; border-color: #58a6ff; border-bottom: 2px solid #0d1117; position: relative; z-index: 1; }
        .tab .flag { font-size: 20px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .card { background: #161b22; padding: 25px; border-radius: 12px; border: 1px solid #30363d; margin-bottom: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
        .card h3 { color: #f39c12; margin-top: 0; margin-bottom: 20px; border-bottom: 1px solid #30363d; padding-bottom: 10px; }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; }
        .grid-4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-group label { font-size: 11px; font-weight: bold; color: #8b949e; text-transform: uppercase; }
        .form-group .hint { font-size: 11px; color: #6e7681; margin-top: 2px; }

        input[type="number"], input[type="text"], input[type="time"] {
            padding: 12px; border-radius: 8px; border: 1px solid #30363d;
            background: #0d1117; color: white; width: 100%; box-sizing: border-box; font-size: 14px;
        }
        input:focus { border-color: #58a6ff; outline: none; box-shadow: 0 0 0 2px rgba(88,166,255,0.2); }

        select {
            padding: 12px; border-radius: 8px; border: 1px solid #30363d;
            background: #0d1117; color: white; width: 100%; box-sizing: border-box; font-size: 14px;
        }
        select:focus { border-color: #58a6ff; outline: none; }

        .toggle-group { display: flex; align-items: center; gap: 12px; }
        .toggle {
            position: relative; width: 48px; height: 26px; cursor: pointer;
            background: #30363d; border-radius: 13px; transition: 0.3s; flex-shrink: 0;
        }
        .toggle.active { background: #238636; }
        .toggle::after {
            content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px;
            background: white; border-radius: 50%; transition: 0.3s;
        }
        .toggle.active::after { left: 25px; }

        .ui-display {
            background: linear-gradient(135deg, #1a3a1a, #0d2818); border: 2px solid #238636;
            border-radius: 12px; padding: 20px; text-align: center; margin-bottom: 20px;
        }
        .ui-display .label { color: #4ade80; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .ui-display .value { color: #ffffff; font-size: 36px; font-weight: bold; }
        .ui-display .currency { color: #8b949e; font-size: 14px; margin-top: 5px; }
        .ui-display .updated { color: #6e7681; font-size: 11px; margin-top: 8px; }

        .multiplier-display {
            background: linear-gradient(135deg, #3a2a0a, #2a1a08); border: 2px solid #f39c12;
            border-radius: 12px; padding: 20px; text-align: center;
        }
        .multiplier-display .label { color: #f39c12; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .multiplier-display .value { color: #ffffff; font-size: 36px; font-weight: bold; }

        .section-label {
            font-size: 11px; color: #8b949e; text-transform: uppercase; letter-spacing: 1px;
            margin: 20px 0 10px 0; font-weight: bold; border-left: 3px solid #58a6ff; padding-left: 10px;
        }

        .feriados-list {
            display: flex; flex-direction: column; gap: 8px; margin-top: 10px;
        }
        .feriado-row {
            display: flex; align-items: center; gap: 10px; padding: 8px 12px;
            background: #0d1117; border-radius: 6px; border: 1px solid #30363d;
        }
        .feriado-row input { flex: 1; }
        .feriado-row .btn-del {
            background: none; border: none; color: #f85149; cursor: pointer; font-size: 18px; padding: 4px 8px;
        }
        .feriado-row .btn-del:hover { background: #3a1a1a; border-radius: 4px; }
        .btn-add-feriado {
            background: #21262d; color: #58a6ff; border: 1px dashed #30363d; padding: 10px;
            border-radius: 6px; cursor: pointer; font-size: 13px; text-align: center; margin-top: 5px;
        }
        .btn-add-feriado:hover { background: #30363d; }

        .btn-save {
            background: #238636; color: white; border: none; padding: 15px; border-radius: 8px;
            cursor: pointer; font-weight: bold; font-size: 14px; width: 100%; margin-top: 20px;
            transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-save:hover { background: #2ea043; }

        .toast {
            position: fixed; bottom: 30px; right: 30px; padding: 15px 25px; border-radius: 8px;
            color: white; font-weight: bold; z-index: 999; display: none;
            animation: slideIn 0.3s ease;
        }
        .toast.success { background: #238636; }
        .toast.error { background: #da3633; }
        @keyframes slideIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .loading { text-align: center; padding: 50px; color: #8b949e; font-size: 16px; }

        .rules-preview {
            background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 15px;
            margin-top: 15px; font-size: 12px; color: #8b949e;
        }
        .rules-preview strong { color: #c9d1d9; }
        .rules-preview .surcharge-active { color: #4ade80; font-weight: bold; }
        .rules-preview .surcharge-inactive { color: #6e7681; }
    </style>
</head>
<body>

    <h1>💰 Configuración de Tarifas</h1>
    <p class="description">Administre precios, recargos y reglas por país. Los cambios se reflejan al instante en la app.</p>

    <div class="tabs" id="tabsBar"></div>
    <div id="tabsContainer"></div>
    <div class="toast" id="toast"></div>

    <script>
        const SUPABASE_URL = "https://eyfgkopaamnkprzpwocz.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5Zmdrb3BhYW1ua3ByenB3b2N6Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3ODYxOTQ4MywiZXhwIjoyMDk0MTk1NDgzfQ.GIEEonN5-YGK1hBLloSun9WX-almQfnQW-0LdGOHmCk";
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const COUNTRIES = [
            { code: 'UY', name: 'Uruguay', flag: '🇺🇾', currency: 'UYU', unit: 'Unidad Indexada (UI)', unitSymbol: 'UI' },
            { code: 'AR', name: 'Argentina', flag: '🇦🇷', currency: 'ARS', unit: 'Índice de Construcción (IC)', unitSymbol: 'IC' },
            { code: 'CL', name: 'Chile', flag: '🇨🇱', currency: 'CLP', unit: 'Unidad de Fomento (UF)', unitSymbol: 'UF' },
            { code: 'BR', name: 'Brasil', flag: '🇧🇷', currency: 'BRL', unit: 'Índice IPCA', unitSymbol: 'IPCA' },
            { code: 'PY', name: 'Paraguay', flag: '🇵🇾', currency: 'PYG', unit: 'Índice IPC', unitSymbol: 'IPC' }
        ];

        let allConfigs = {};
        let activeTab = 'UY';

        function showToast(msg, type) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast ' + type;
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 3000);
        }

        async function refreshUI() {
            try {
                const resp = await fetch('/api/update-ui');
                const result = await resp.json();
                if (result.success) {
                    showToast(`UI actualizada: $${result.value}`, 'success');
                    allConfigs['UY'].ui_value = result.value;
                    allConfigs['UY'].ui_last_updated = new Date().toISOString().split('T')[0];
                    if (activeTab === 'UY') renderContent();
                } else {
                    showToast('Error: ' + result.error, 'error');
                }
            } catch (e) {
                showToast('Error de conexión con el servidor', 'error');
            }
        }

        async function getExistingColumns() {
            // Detecta qué columnas existen en la tabla consultando un registro existente
            const { data } = await sb.from('config_tarifas').select('*').limit(1);
            if (data && data.length > 0) return Object.keys(data[0]);
            // Si la tabla está vacía, usa las columnas mínimas conocidas
            return ['id','pais_code','ui_value','ui_last_updated',
                'price_per_km','min_fare','per_second_cost','stop_price',
                'out_of_zone_index','dynamic_multiplier','package_price','pet_price',
                'company_fee_ui',
                'night_surcharge_active','night_surcharge_pct','night_start_hour','night_end_hour',
                'sunday_surcharge_active','holiday_surcharge_active','feriados'];
        }

        function isUYFeriados(arr) {
            if (!arr || arr.length === 0) return false;
            const uy = getFeriadosUY();
            return uy.length === arr.length && uy.every((f, i) => f.fecha === arr[i].fecha && f.nombre === arr[i].nombre);
        }

        async function loadAllConfigs() {
            try {
                const existingCols = await getExistingColumns();
                const { data, error } = await sb.from('config_tarifas').select('*');
                if (error) throw error;

                // Limpiar feriados de UY que hayan quedado guardados en otros países
                for (const row of data) {
                    if (row.pais_code !== 'UY' && isUYFeriados(row.feriados)) {
                        await sb.from('config_tarifas').update({ feriados: [] }).eq('id', row.id);
                        row.feriados = [];
                    }
                }

                for (const c of COUNTRIES) {
                    const found = data.find(d => d.pais_code === c.code);
                    if (found) {
                        allConfigs[c.code] = found;
                    } else {
                        const allDefaults = {
                            pais_code: c.code, ui_value: 0, ui_last_updated: null,
                            price_per_km: 40.0, min_fare: 100.0,
                            per_second_cost: 0.28,
                            stop_price: 30.0, out_of_zone_index: 1.5, dynamic_multiplier: 1.0,
                            package_price: 50.0, pet_price: 30.0,
                            company_fee_ui: 5.5,
                            cancel_free_time_sec: 120, cancel_free_show_time: true,
                            cancel_paid_time_sec: 300, cancel_apply_fare_formula: true,
                            cancel_base_fee: 50.0, cancel_per_min: 3.0, cancel_per_km: 15.0,
                            night_surcharge_active: true, night_surcharge_pct: 20,
                            night_start_hour: 22, night_end_hour: 6,
                            sunday_surcharge_active: true,
                            holiday_surcharge_active: true,
                            feriados: []
                        };
                        // Solo insertar columnas que realmente existen en la tabla
                        const defaults = {};
                        for (const key of Object.keys(allDefaults)) {
                            if (existingCols.includes(key)) {
                                defaults[key] = allDefaults[key];
                            }
                        }
                        const { data: ins } = await sb.from('config_tarifas').insert(defaults).select().single();
                        allConfigs[c.code] = ins;
                    }
                }

                renderTabs();
                renderContent();
            } catch (e) {
                document.getElementById('tabsContainer').innerHTML = '<div class="loading" style="color:#f87171;">Error: ' + e.message + '</div>';
            }
        }

        function renderTabs() {
            const bar = document.getElementById('tabsBar');
            bar.innerHTML = COUNTRIES.map(c =>
                `<div class="tab ${c.code === activeTab ? 'active' : ''}" onclick="switchTab('${c.code}')">
                    <span class="flag">${c.flag}</span> ${c.name}
                </div>`
            ).join('');
        }

        function switchTab(code) {
            activeTab = code;
            renderTabs();
            renderContent();
        }

        function getFeriadosUY() {
            return [
                { fecha: '2026-01-01', nombre: 'Año Nuevo' },
                { fecha: '2026-01-06', nombre: 'Día de Reyes' },
                { fecha: '2026-02-16', nombre: 'Carnaval' },
                { fecha: '2026-02-17', nombre: 'Carnaval' },
                { fecha: '2026-03-30', nombre: 'Semana de Turismo' },
                { fecha: '2026-04-03', nombre: 'Viernes Santo' },
                { fecha: '2026-04-19', nombre: 'Desembarco 33 Orientales' },
                { fecha: '2026-05-01', nombre: 'Día de los Trabajadores' },
                { fecha: '2026-05-18', nombre: 'Batalla de las Piedras' },
                { fecha: '2026-06-19', nombre: 'Natalicio de Artigas' },
                { fecha: '2026-07-18', nombre: 'Jura de la Constitución' },
                { fecha: '2026-08-25', nombre: 'Declaratoria de la Independencia' },
                { fecha: '2026-10-12', nombre: 'Día de la Raza' },
                { fecha: '2026-11-02', nombre: 'Día de los Difuntos' },
                { fecha: '2026-12-25', nombre: 'Navidad' }
            ];
        }

        function renderContent() {
            const c = COUNTRIES.find(x => x.code === activeTab);
            const d = allConfigs[activeTab];
            if (!c || !d) return;

            let feriados = d.feriados && d.feriados.length > 0 ? d.feriados : [];
            // Si no hay feriados guardados para UY, precargar los conocidos
            if (feriados.length === 0 && activeTab === 'UY') {
                feriados = getFeriadosUY();
            }
            // Si el país no es UY pero tiene exactamente los feriados de UY, limpiarlos
            // (quedaron de cuando el sistema mostraba UY para todos)
            if (activeTab !== 'UY' && feriados.length > 0) {
                const uy = getFeriadosUY();
                const isSame = uy.length === feriados.length && uy.every((f, i) => f.fecha === feriados[i].fecha);
                if (isSame) feriados = [];
            }

            document.getElementById('tabsContainer').innerHTML = `
                <div class="tab-content active">
                    <div class="grid-2">
                        <div class="ui-display">
                            <div class="label">${c.unit}</div>
                            <div class="value">${d.ui_value ? d.ui_value.toFixed(4) : '--'}</div>
                            <div class="currency">${c.currency}</div>
                            <div class="updated">Última actualización: ${d.ui_last_updated || 'Sin datos'}${activeTab === 'UY' ? ' — <a href="#" onclick="refreshUI(); return false;" style="color:#4ade80;">Actualizar ahora</a>' : ''}</div>
                        </div>
                        <div class="multiplier-display">
                            <div class="label">Multiplicador Dinámico</div>
                            <div class="value" id="multDisplay_${activeTab}">x${(d.dynamic_multiplier || 1.0).toFixed(1)}</div>
                            <div class="currency" style="color:#8b949e; font-size:12px; margin-top:5px;">Úselo para aumentar precios en casos especiales</div>
                        </div>
                    </div>

                    <div class="section-label">Precios que elige el Chofer (valores por defecto)</div>
                    <div class="card">
                        <div class="grid-3">
                            <div class="form-group">
                                <label>Precio por Km ($)</label>
                                <input type="number" id="pricePerKm_${activeTab}" value="${d.price_per_km || 40}" step="1" min="0">
                                <div class="hint">El chofer puede subirlo o bajarlo en su app</div>
                            </div>
                            <div class="form-group">
                                <label>Tarifa Mínima ($)</label>
                                <input type="number" id="minFare_${activeTab}" value="${d.min_fare || 100}" step="1" min="0">
                                <div class="hint">Monto mínimo que cobrará el viaje</div>
                            </div>
                        </div>
                    </div>

                    <div class="section-label">Precios Fijos de Empresa</div>
                    <div class="card">
                        <div class="grid-4">
                            <div class="form-group">
                                <label>Tiempo de Espera ($/seg)</label>
                                <input type="number" id="perSecondCost_${activeTab}" value="${d.per_second_cost || 0.28}" step="0.01" min="0">
                                <div class="hint">Se cobra después del tiempo libre (2 min)</div>
                            </div>
                            <div class="form-group">
                                <label>Parada Intermedia ($)</label>
                                <input type="number" id="stopPrice_${activeTab}" value="${d.stop_price || 30}" step="0.5" min="0">
                                <div class="hint">Costo fijo por cada parada extra</div>
                            </div>
                            <div class="form-group">
                                <label>Precio Paquete ($)</label>
                                <input type="number" id="packagePrice_${activeTab}" value="${d.package_price || 50}" step="1" min="0">
                            </div>
                            <div class="form-group">
                                <label>Precio Mascota ($)</label>
                                <input type="number" id="petPrice_${activeTab}" value="${d.pet_price || 30}" step="1" min="0">
                            </div>
                        </div>
                        <div class="grid-3" style="margin-top:15px;">
                            <div class="form-group">
                                <label>Índice Fuera de Zona</label>
                                <input type="number" id="outOfZone_${activeTab}" value="${d.out_of_zone_index || 1.5}" step="0.1" min="1">
                                <div class="hint">Multiplicador para zonas fuera del área</div>
                            </div>
                            <div class="form-group">
                                <label>Multiplicador Dinámico</label>
                                <input type="number" id="dynamicMult_${activeTab}" value="${d.dynamic_multiplier || 1.0}" step="0.1" min="0" max="5">
                                <div class="hint">x1.0 = sin cambio, x1.5 = +50%</div>
                            </div>
                            <div class="form-group">
                                <label>Comisión Empresa (UI)</label>
                                <input type="number" id="companyFeeUi_${activeTab}" value="${d.company_fee_ui ?? 5.5}" step="0.1" min="0">
                                <div class="hint">Ganancia de la empresa por viaje en UI</div>
                            </div>
                        </div>
                    </div>

                    <div class="section-label">🚫 Cancelaciones</div>
                    <div class="card">
                        <h3>Tiempos de Cancelación</h3>
                        <div class="grid-3">
                            <div class="form-group">
                                <label>Cancelación gratuita (seg)</label>
                                <input type="number" id="cancelFreeTime_${activeTab}" value="${d.cancel_free_time_sec || 120}" step="10" min="0">
                                <div class="hint">Tiempo libre para cancelar sin costo</div>
                            </div>
                            <div class="form-group">
                                <label>Máximo cancelación con costo (seg)</label>
                                <input type="number" id="cancelPaidTime_${activeTab}" value="${d.cancel_paid_time_sec || 300}" step="10" min="0">
                                <div class="hint">Después de este tiempo no se puede cancelar</div>
                            </div>
                            <div class="form-group">
                                <div class="toggle-group">
                                    <div class="toggle ${d.cancel_free_show_time ? 'active' : ''}"
                                         id="cancelShowTimeToggle_${activeTab}"
                                         onclick="toggleSurcharge('cancelShowTime', '${activeTab}')"></div>
                                    <label style="text-transform:none;color:#c9d1d9;font-size:14px;">Mostrar countdown</label>
                                </div>
                                <div class="hint">Mostrar timer al pasajero</div>
                            </div>
                        </div>

                        <h3 style="margin-top:20px;">Modo de Cálculo del Costo</h3>
                        <div class="grid-2">
                            <div class="form-group">
                                <div class="toggle-group">
                                    <div class="toggle ${d.cancel_apply_fare_formula !== false ? 'active' : ''}"
                                         id="cancelFormulaToggle_${activeTab}"
                                         onclick="toggleSurcharge('cancelFormula', '${activeTab}')"></div>
                                    <label style="text-transform:none;color:#c9d1d9;font-size:14px;">Fórmula de viaje (recomendado)</label>
                                </div>
                                <div class="hint">Calcula como viaje normal sin tarifa mínima: km × price_per_km + canon + empresa + MP</div>
                            </div>
                            <div class="form-group">
                                <label>Monto fijo — Base ($)</label>
                                <input type="number" id="cancelBaseFee_${activeTab}" value="${d.cancel_base_fee || 50}" step="1" min="0">
                                <div class="hint">Solo se usa si fórmula de viaje está OFF</div>
                            </div>
                        </div>
                        <div class="grid-3" style="margin-top:10px;">
                            <div class="form-group">
                                <label>Costo fijo por minuto ($/min)</label>
                                <input type="number" id="cancelPerMin_${activeTab}" value="${d.cancel_per_min || 3}" step="0.5" min="0">
                                <div class="hint">Solo se usa si fórmula de viaje está OFF</div>
                            </div>
                            <div class="form-group">
                                <label>Costo fijo por km ($/km)</label>
                                <input type="number" id="cancelPerKm_${activeTab}" value="${d.cancel_per_km || 15}" step="0.5" min="0">
                                <div class="hint">Solo se usa si fórmula de viaje está OFF</div>
                            </div>
                        </div>
                    </div>

                    <div class="section-label">Recargos por Horario y Días</div>
                    <div class="card">
                        <h3>🌙 Recargo Nocturno — ${c.name}</h3>
                        <div class="grid-3">
                            <div class="form-group">
                                <div class="toggle-group">
                                    <div class="toggle ${d.night_surcharge_active ? 'active' : ''}"
                                         id="nightToggle_${activeTab}"
                                         onclick="toggleSurcharge('night', '${activeTab}')"></div>
                                    <label style="text-transform:none;color:#c9d1d9;font-size:14px;">Activar recargo nocturno</label>
                                </div>
                                <div class="hint">22:00 a 06:00 — +${d.night_surcharge_pct || 20}%</div>
                            </div>
                            <div class="form-group">
                                <label>Porcentaje de recargo</label>
                                <input type="number" id="nightPct_${activeTab}" value="${d.night_surcharge_pct || 20}" step="5" min="0" max="100">
                            </div>
                            <div class="form-group">
                                <label>Horario desde</label>
                                <input type="number" id="nightStart_${activeTab}" value="${d.night_start_hour || 22}" step="1" min="0" max="23">
                                <div class="hint">Hora de inicio (0-23)</div>
                            </div>
                            <div class="form-group">
                                <label>Horario hasta</label>
                                <input type="number" id="nightEnd_${activeTab}" value="${d.night_end_hour || 6}" step="1" min="0" max="23">
                                <div class="hint">Hora de fin (0-23)</div>
                            </div>
                        </div>

                        <h3 style="margin-top:25px;">☀️ Domingos — 24 horas</h3>
                        <div class="grid-2">
                            <div class="form-group">
                                <div class="toggle-group">
                                    <div class="toggle ${d.sunday_surcharge_active ? 'active' : ''}"
                                         id="sundayToggle_${activeTab}"
                                         onclick="toggleSurcharge('sunday', '${activeTab}')"></div>
                                    <label style="text-transform:none;color:#c9d1d9;font-size:14px;">Activar recargo dominical</label>
                                </div>
                                <div class="hint">Aplica el mismo porcentaje del recargo nocturno los domingos todo el día</div>
                            </div>
                        </div>

                        <h3 style="margin-top:25px;">📅 Feriados — 24 horas</h3>
                        <div class="grid-2">
                            <div class="form-group">
                                <div class="toggle-group">
                                    <div class="toggle ${d.holiday_surcharge_active ? 'active' : ''}"
                                         id="holidayToggle_${activeTab}"
                                         onclick="toggleSurcharge('holiday', '${activeTab}')"></div>
                                    <label style="text-transform:none;color:#c9d1d9;font-size:14px;">Activar recargo en feriados</label>
                                </div>
                                <div class="hint">Aplica el <b id="holidayPctHint_${activeTab}">${d.night_surcharge_pct || 20}%</b> de recargo (mismo % que nocturno) durante todo el día feriado</div>
                            </div>
                        </div>
                        <div class="feriados-list" id="feriadosList_${activeTab}">
                            ${feriados.map((f, i) => `
                                <div class="feriado-row">
                                    <input type="date" id="feriadoFecha_${activeTab}_${i}" value="${f.fecha || ''}">
                                    <input type="text" id="feriadoNombre_${activeTab}_${i}" value="${f.nombre || ''}" placeholder="Nombre del feriado">
                                    <button class="btn-del" onclick="removeFeriado(${i}, '${activeTab}')">✕</button>
                                </div>
                            `).join('')}
                        </div>
                        <button class="btn-add-feriado" onclick="addFeriado('${activeTab}')">+ Agregar feriado</button>
                    </div>

                    <div class="rules-preview">
                        <strong>Resumen:</strong>
                        Km: <b id="prevKm_${activeTab}">${d.price_per_km || 40}</b>$/km |
                        Mínimo: <b id="prevMin_${activeTab}">${d.min_fare || 100}</b>$ |
                        Espera: <b id="prevWait_${activeTab}">${d.per_second_cost || 0.28}</b>$/seg |
                        Parada: <b id="prevStop_${activeTab}">${d.stop_price || 30}</b>$ |
                        Empresa: <b id="prevCompFee_${activeTab}">${d.company_fee_ui ?? 5.5}</b> UI |
                        <span id="prevNocturno_${activeTab}" class="${d.night_surcharge_active ? 'surcharge-active' : 'surcharge-inactive'}">Nocturno: ${d.night_surcharge_active ? 'ON' : 'OFF'}</span> |
                        <span id="prevDom_${activeTab}" class="${d.sunday_surcharge_active ? 'surcharge-active' : 'surcharge-inactive'}">Dom: ${d.sunday_surcharge_active ? 'ON' : 'OFF'}</span> |
                        <span id="prevFer_${activeTab}" class="${d.holiday_surcharge_active ? 'surcharge-active' : 'surcharge-inactive'}">Feriados: ${d.holiday_surcharge_active ? 'ON' : 'OFF'}</span>
                    </div>

                    <button class="btn-save" id="btnSave_${activeTab}" onclick="saveConfig('${activeTab}')">💾 Guardar — ${c.name}</button>
                </div>
            `;

            const ids = ['pricePerKm','minFare','perSecondCost','stopPrice','outOfZone','dynamicMult','packagePrice','petPrice','companyFeeUi','cancelFreeTime','cancelPaidTime','cancelBaseFee','cancelPerMin','cancelPerKm'];
            ids.forEach(id => {
                const el = document.getElementById(`${id}_${activeTab}`);
                if (el) el.addEventListener('input', () => updatePreview(activeTab));
            });
            ['nightPct','nightStart','nightEnd'].forEach(id => {
                const el = document.getElementById(`${id}_${activeTab}`);
                if (el) el.addEventListener('input', () => updatePreview(activeTab));
            });
        }

        function toggleSurcharge(type, pais) {
            const id = type + 'Toggle_' + pais;
            const el = document.getElementById(id);
            const active = el.classList.toggle('active');
            updatePreview(pais);
        }

        function addFeriado(pais) {
            const list = document.getElementById('feriadosList_' + pais);
            const i = list.children.length;
            const row = document.createElement('div');
            row.className = 'feriado-row';
            row.innerHTML = `
                <input type="date" id="feriadoFecha_${pais}_${i}">
                <input type="text" id="feriadoNombre_${pais}_${i}" placeholder="Nombre del feriado">
                <button class="btn-del" onclick="removeFeriado(${i}, '${pais}')">✕</button>
            `;
            list.appendChild(row);
        }

        function removeFeriado(index, pais) {
            const list = document.getElementById('feriadosList_' + pais);
            const rows = list.querySelectorAll('.feriado-row');
            if (rows[index]) rows[index].remove();
        }

        function getFeriadosFromUI(pais) {
            const list = document.getElementById('feriadosList_' + pais);
            const rows = list.querySelectorAll('.feriado-row');
            const feriados = [];
            rows.forEach(row => {
                const fecha = row.querySelector('input[type="date"]')?.value || '';
                const nombre = row.querySelector('input[type="text"]')?.value || '';
                if (fecha) feriados.push({ fecha, nombre });
            });
            return feriados;
        }

        function updatePreview(pais) {
            const g = id => parseFloat(document.getElementById(`${id}_${pais}`)?.value || 0);
            const set = (id, val) => { const el = document.getElementById(`${id}_${pais}`); if (el) el.textContent = val; };

            set('prevKm', g('pricePerKm'));
            set('prevMin', g('minFare'));
            set('prevWait', g('perSecondCost'));
            set('prevStop', g('stopPrice'));
            set('prevPkg', g('packagePrice'));
            set('prevPet', g('petPrice'));
            set('prevOoz', g('outOfZone'));
            set('prevDyn', g('dynamicMult'));
            set('prevCompFee', g('companyFeeUi'));
            set('prevCancelFree', g('cancelFreeTime'));

            const cancelFormulaEl = document.getElementById(`cancelFormulaToggle_${pais}`);
            const cfOn = cancelFormulaEl && cancelFormulaEl.classList.contains('active');
            setSpan('prevCancelFormula', cfOn);

            const md = document.getElementById(`multDisplay_${pais}`);
            if (md) md.textContent = 'x' + g('dynamicMult').toFixed(1);

            const nightEl = document.getElementById(`nightToggle_${pais}`);
            const sundayEl = document.getElementById(`sundayToggle_${pais}`);
            const holidayEl = document.getElementById(`holidayToggle_${pais}`);

            const nOn = nightEl && nightEl.classList.contains('active');
            const sOn = sundayEl && sundayEl.classList.contains('active');
            const hOn = holidayEl && holidayEl.classList.contains('active');

            const setSpan = (id, on) => {
                const el = document.getElementById(`${id}_${pais}`);
                if (!el) return;
                el.textContent = on ? 'ON' : 'OFF';
                el.className = on ? 'surcharge-active' : 'surcharge-inactive';
            };
            setSpan('prevNocturno', nOn);
            setSpan('prevDom', sOn);
            setSpan('prevFer', hOn);

            const pctHint = document.getElementById(`holidayPctHint_${pais}`);
            if (pctHint) pctHint.textContent = g('nightPct') + '%';
        }

        async function saveConfig(pais) {
            const btn = document.getElementById(`btnSave_${pais}`);
            btn.disabled = true; btn.textContent = '⏳ Guardando...';
            try {
                const existing = allConfigs[pais] || {};
                const existingKeys = Object.keys(existing);
                const v = id => parseFloat(document.getElementById(`${id}_${pais}`)?.value || 0);
                const nightEl = document.getElementById(`nightToggle_${pais}`);
                const sundayEl = document.getElementById(`sundayToggle_${pais}`);
                const holidayEl = document.getElementById(`holidayToggle_${pais}`);
                const cancelShowTimeEl = document.getElementById(`cancelShowTimeToggle_${pais}`);
                const cancelFormulaEl = document.getElementById(`cancelFormulaToggle_${pais}`);

                const allFields = {
                    price_per_km: v('pricePerKm'),
                    min_fare: v('minFare'),
                    per_second_cost: v('perSecondCost'),
                    stop_price: v('stopPrice'),
                    out_of_zone_index: v('outOfZone'),
                    dynamic_multiplier: v('dynamicMult'),
                    package_price: v('packagePrice'),
                    pet_price: v('petPrice'),
                    company_fee_ui: v('companyFeeUi'),
                    cancel_free_time_sec: v('cancelFreeTime'),
                    cancel_free_show_time: cancelShowTimeEl ? cancelShowTimeEl.classList.contains('active') : true,
                    cancel_paid_time_sec: v('cancelPaidTime'),
                    cancel_apply_fare_formula: cancelFormulaEl ? cancelFormulaEl.classList.contains('active') : true,
                    cancel_base_fee: v('cancelBaseFee'),
                    cancel_per_min: v('cancelPerMin'),
                    cancel_per_km: v('cancelPerKm'),
                    night_surcharge_active: nightEl ? nightEl.classList.contains('active') : false,
                    night_surcharge_pct: v('nightPct'),
                    night_start_hour: v('nightStart'),
                    night_end_hour: v('nightEnd'),
                    sunday_surcharge_active: sundayEl ? sundayEl.classList.contains('active') : false,
                    holiday_surcharge_active: holidayEl ? holidayEl.classList.contains('active') : false,
                    feriados: getFeriadosFromUI(pais)
                };

                // Solo guardar campos que realmente existen en la fila de BD
                const vals = {};
                for (const key of Object.keys(allFields)) {
                    if (existingKeys.includes(key)) {
                        vals[key] = allFields[key];
                    }
                }

                const { error } = await sb.from('config_tarifas').update(vals).eq('id', allConfigs[pais].id);
                if (error) throw error;
                Object.assign(allConfigs[pais], vals);
                showToast(`${COUNTRIES.find(c=>c.code===pais).name} guardado`, 'success');
            } catch (e) { showToast('Error: ' + e.message, 'error'); }
            finally { btn.disabled = false; btn.textContent = `💾 Guardar — ${COUNTRIES.find(c=>c.code===pais).name}`; }
        }

        loadAllConfigs();
    </script>
</body>
</html>
