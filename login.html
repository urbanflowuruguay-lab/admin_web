<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UrbanFlow — Acceso</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: #0F1B2D; color: #e6edf3; min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            -webkit-font-smoothing: antialiased;
        }
        .login-container { width: 100%; max-width: 440px; padding: 24px; }
        .logo-section { text-align: center; margin-bottom: 32px; }
        .logo-section img { max-width: 140px; margin-bottom: 16px; filter: brightness(0) invert(1); }
        .role-badge {
            display: inline-block; padding: 8px 20px; border-radius: 999px;
            font-size: 13px; font-weight: 600; letter-spacing: 0.3px;
            background: rgba(108,99,255,0.15); color: #a5a1ff; border: 1px solid rgba(108,99,255,0.3);
        }
        .logo-section p { color: #8b949e; font-size: 15px; margin-top: 8px; }
        .card {
            background: #161b22; border: 1px solid #30363d;
            border-radius: 20px; padding: 40px 32px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.3);
        }
        .card h2 { font-size: 24px; font-weight: 700; margin-bottom: 8px; text-align: center; letter-spacing: -0.3px; color: #e6edf3; }
        .card .subtitle { font-size: 14px; color: #8b949e; text-align: center; margin-bottom: 28px; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 13px; font-weight: 500; color: #c9d1d9; margin-bottom: 8px; }
        .form-group input {
            width: 100%; padding: 14px 16px; background: #0d1117;
            border: 1.5px solid #30363d; border-radius: 12px;
            color: #e6edf3; font-size: 15px; font-family: inherit;
            outline: none; transition: all 0.2s ease;
        }
        .form-group input:focus { border-color: #58a6ff; background: #161b22; }
        .form-group input::placeholder { color: #484f58; }
        .btn {
            width: 100%; padding: 16px; color: white; border: none;
            border-radius: 12px; font-size: 16px; font-weight: 600;
            font-family: inherit; cursor: pointer; transition: all 0.2s ease;
            margin-top: 8px; background: #6C63FF;
        }
        .btn:hover { background: #5558e6; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(108,99,255,0.3); }
        .btn:disabled { background: #21262d; color: #484f58; cursor: not-allowed; transform: none; box-shadow: none; }
        .error-msg {
            background: rgba(248,81,73,0.1); border: 1px solid rgba(248,81,73,0.3); color: #f85149;
            padding: 12px 16px; border-radius: 12px; font-size: 13px; font-weight: 500;
            margin-bottom: 20px; display: none;
        }
        .error-msg.show { display: block; }
        .toggle-text {
            text-align: center; margin-top: 20px; font-size: 14px; color: #8b949e;
        }
        .toggle-text a { color: #e6edf3; font-weight: 600; text-decoration: none; cursor: pointer; }
        .toggle-text a:hover { text-decoration: underline; }
        .back-link { text-align: center; margin-top: 24px; }
        .back-link a { color: #8b949e; text-decoration: none; font-size: 14px; font-weight: 500; transition: color 0.2s; }
        .back-link a:hover { color: #e6edf3; }
        .register-fields { display: none; }
        @media (max-width: 480px) {
            .login-container { padding: 16px; }
            .card { padding: 28px 20px; }
            .logo-section img { max-width: 110px; }
            .form-group input { font-size: 16px; padding: 16px; }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo-section">
            <img src="/logouf.png" alt="UrbanFlow">
            <div class="role-badge">Bienvenido</div>
            <p>Accedé a tu cuenta de UrbanFlow</p>
        </div>

        <div class="card">
            <h2 id="formTitle">Iniciar sesión</h2>
            <p class="subtitle" id="formSubtitle">Ingresa tus datos para continuar</p>
            <div class="error-msg" id="errorMsg"></div>

            <form onsubmit="handleSubmit(event)">
                <div class="register-fields" id="registerFields">
                    <div class="form-group">
                        <label for="regEmail">Email</label>
                        <input type="email" id="regEmail" placeholder="tu@email.com">
                    </div>
                    <div class="form-group">
                        <label for="regPassword">Contraseña</label>
                        <input type="password" id="regPassword" placeholder="Mínimo 6 caracteres">
                    </div>
                </div>
                <div class="form-group" id="loginFields">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="tu@email.com" required autocomplete="email">
                </div>
                <div class="form-group" id="loginPasswordField">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="Ingresa tu contraseña" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn" id="btnSubmit">Entrar</button>
            </form>

            <div class="toggle-text">
                <span id="toggleText">¿No tenés cuenta?</span>
                <a id="toggleLink" onclick="toggleMode()">Registrate</a>
            </div>
        </div>

        <div class="back-link">
            <a href="/">Volver al sitio</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "https://eyfgkopaamnkprzpwocz.supabase.co";
        const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5Zmdrb3BhYW1ua3ByenB3b2N6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2MTk0ODMsImV4cCI6MjA5NDE5NTQ4M30.bXkq4Ks3p2yb2SQH76__8jXhmM5Thi2izIL5UPkKa0I";
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

        const params = new URLSearchParams(window.location.search);
        let isRegister = params.get("register") === "1";

        if (isRegister) {
            setTimeout(() => toggleMode(), 100);
        }

        const errorParam = params.get("error");
        if (errorParam === "not_admin") showError("Tu cuenta no tiene acceso al panel de administración.");
        else if (errorParam === "no_profile") showError("No se encontró tu perfil. Contactá al administrador.");

        (async () => {
            const { data: { session } } = await sb.auth.getSession();
            if (session) await redirectByRole(session.user.id);
        })();

        function toggleMode() {
            isRegister = !isRegister;
            document.getElementById("formTitle").textContent = isRegister ? "Crear cuenta" : "Iniciar sesión";
            document.getElementById("formSubtitle").textContent = isRegister ? "Registrate para empezar a usar UrbanFlow" : "Ingresa tus datos para continuar";
            document.getElementById("btnSubmit").textContent = isRegister ? "Crear cuenta" : "Entrar";
            document.getElementById("registerFields").style.display = isRegister ? "" : "none";
            document.getElementById("loginFields").style.display = isRegister ? "none" : "";
            document.getElementById("loginPasswordField").style.display = isRegister ? "none" : "";
            document.getElementById("toggleText").textContent = isRegister ? "¿Ya tenés cuenta?" : "¿No tenés cuenta?";
            document.getElementById("toggleLink").textContent = isRegister ? "Iniciá sesión" : "Registrate";
            showError("");
        }

        async function handleSubmit(e) {
            e.preventDefault();
            const btn = document.getElementById("btnSubmit");

            let email, password;
            if (isRegister) {
                email = document.getElementById("regEmail").value.trim();
                password = document.getElementById("regPassword").value.trim();
                if (!email || !password) { showError("Completa email y contraseña"); return; }
                if (password.length < 6) { showError("La contraseña debe tener al menos 6 caracteres"); return; }
            } else {
                email = document.getElementById("email").value.trim();
                password = document.getElementById("password").value.trim();
                if (!email || !password) { showError("Completa email y contraseña"); return; }
            }

            btn.disabled = true;
            btn.textContent = isRegister ? "Creando cuenta..." : "Entrando...";

            let result;
            if (isRegister) {
                result = await sb.auth.signUp({ email, password });

                if (!result.error && result.data.user) {
                    if (result.data.session) {
                        await redirectByRole(result.data.user.id);
                        return;
                    }
                    showError("Cuenta creada. Revisa tu email para confirmar.");
                    btn.disabled = false;
                    btn.textContent = "Crear cuenta";
                    return;
                }
            } else {
                result = await sb.auth.signInWithPassword({ email, password });
                if (!result.error) {
                    await redirectByRole(result.data.user.id);
                    return;
                }
            }

            btn.disabled = false;
            btn.textContent = isRegister ? "Crear cuenta" : "Entrar";
            if (result.error) {
                if (result.error.message.includes("already")) showError("Este email ya está registrado. Iniciá sesión.");
                else if (result.error.message.includes("Invalid login")) showError("Email o contraseña incorrectos");
                else showError(result.error.message);
            }
        }

        async function redirectByRole(userId) {
            const { data: profile } = await sb.from("perfiles").select("type, status, role").eq("id", userId).single();

            if (profile && profile.role === "admin") {
                window.location.href = "/admin/";
                return;
            }

            if (profile && profile.type === "chofer") {
                if (profile.status === "aprobado") { window.location.href = "/chofer/"; return; }
                showError("Tu cuenta de chofer está " + profile.status + ".");
                await sb.auth.signOut();
                return;
            }

            if (profile && (profile.type === "servicios" || profile.type === "empresa")) {
                if (profile.status === "aprobado") { window.location.href = "/empresa/"; return; }
                showError("Tu cuenta está " + profile.status + ".");
                await sb.auth.signOut();
                return;
            }

            if (profile && profile.type === "usuario") {
                showError("Tu cuenta está activa. Próximamente tendrás acceso desde la web.");
                await sb.auth.signOut();
                return;
            }

            showError("Tu cuenta está pendiente. Pronto podrás acceder.");
            await sb.auth.signOut();
        }

        function showError(msg) {
            const el = document.getElementById("errorMsg");
            if (msg) { el.textContent = msg; el.classList.add("show"); }
            else { el.textContent = ""; el.classList.remove("show"); }
        }
    </script>
</body>
</html>
