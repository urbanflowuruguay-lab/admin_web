<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UrbanFlow - Iniciar Sesión</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg:#0a0a0a; --bg2:#111; --bg3:#1a1a1a; --border:#333; --text:#fff; --text2:#999; --accent:#d4af37; --accent2:#b8962e; --red:#f44336; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
        .container { max-width:420px; width:100%; }
        .card { background:var(--bg2); border:1px solid var(--border); border-radius:16px; padding:32px; }
        .card h2 { text-align:center; color:var(--accent); margin-bottom:4px; font-size:22px; }
        .card .subtitle { text-align:center; color:var(--text2); font-size:13px; margin-bottom:24px; }
        .form-group { margin-bottom:16px; }
        .form-group label { display:block; font-size:12px; color:var(--text2); margin-bottom:6px; }
        .form-group input { width:100%; padding:12px 14px; background:var(--bg3); border:1px solid var(--border); border-radius:8px; color:var(--text); font-size:14px; outline:none; }
        .form-group input:focus { border-color:var(--accent); }
        .btn { width:100%; padding:14px; background:var(--accent); color:var(--bg); border:none; border-radius:8px; font-size:15px; font-weight:700; cursor:pointer; margin-top:8px; }
        .btn:hover { background:var(--accent2); }
        .btn:disabled { background:#333; color:#666; cursor:not-allowed; }
        .error-msg { color:var(--red); font-size:13px; text-align:center; margin-top:12px; display:none; }
        .error-msg.show { display:block; }
        .links { text-align:center; margin-top:16px; font-size:13px; }
        .links a { color:var(--accent); text-decoration:none; cursor:pointer; }
        .links a:hover { text-decoration:underline; }
        .back-link { text-align:center; margin-top:20px; }
        .back-link a { color:var(--text2); font-size:12px; text-decoration:none; }
        .hidden { display:none; }
        .spinner { width:20px; height:20px; border:3px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin 0.8s linear infinite; display:inline-block; vertical-align:middle; margin-right:8px; }
        @keyframes spin { to { transform:rotate(360deg); } }
        #authLoader { text-align:center; padding:60px; }

        /* Selector de rol - solo aparece si es necesario */
        .role-selector { display:grid; gap:10px; margin-top:16px; }
        .role-btn { padding:16px; background:var(--bg3); border:2px solid var(--border); border-radius:12px; color:var(--text); font-size:15px; font-weight:600; cursor:pointer; text-align:left; display:flex; align-items:center; gap:12px; transition:all 0.2s; }
        .role-btn:hover { border-color:var(--accent); background:var(--bg); }
        .role-btn .icon { font-size:24px; }
        .role-btn .info { flex:1; }
        .role-btn .desc { font-size:11px; color:var(--text2); font-weight:400; margin-top:2px; }
    </style>
</head>
<body>
    <div class="container">
        <div id="authLoader"><div class="spinner"></div><p style="color:var(--text2);margin-top:12px">Verificando sesión...</p></div>

        <div class="card hidden" id="loginCard">
            <!-- PASO 1: Login normal -->
            <div id="step-login">
                <h2>Iniciar Sesión</h2>
                <p class="subtitle">Ingresa tus datos para continuar</p>
                <div class="error-msg" id="errorMsg"></div>
                <form onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="email" placeholder="tu@email.com" required autocomplete="email">
                    </div>
                    <div class="form-group">
                        <label>Contraseña</label>
                        <input type="password" id="password" placeholder="Ingresa tu contraseña" required autocomplete="current-password">
                    </div>
                    <button type="submit" class="btn" id="btnLogin">Entrar</button>
                </form>
                <div class="links">
                    <a onclick="showRegister()">Registrate como empresa</a>
                </div>
            </div>

            <!-- Registro de empresa -->
            <div id="step-register" class="hidden">
                <h2>Registrar Empresa</h2>
                <p class="subtitle">Creá tu cuenta de restaurante</p>
                <div class="error-msg" id="regErrorMsg"></div>
                <form onsubmit="handleRegister(event)">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="regEmail" placeholder="tu@email.com" required>
                    </div>
                    <div class="form-group">
                        <label>Contraseña</label>
                        <input type="password" id="regPassword" placeholder="Mínimo 6 caracteres" required>
                    </div>
                    <div class="form-group">
                        <label>Tu contraseña de Dueño</label>
                        <input type="password" id="regPinDueno" placeholder="La usás para entrar como Dueño" maxlength="8">
                    </div>
                    <button type="submit" class="btn" id="btnRegister">Crear cuenta</button>
                </form>
                <div class="links">
                    <a onclick="showLogin()">¿Ya tenés cuenta? Iniciá sesión</a>
                </div>
            </div>

            <!-- PIN del dueño (solo si el login detecta que es dueño de empresa) -->
            <div id="step-pin-dueno" class="hidden">
                <h2>🔑 Contraseña de Dueño</h2>
                <p class="subtitle" id="empresaName">Tu restaurante te espera</p>
                <div class="error-msg" id="pinDuenoError"></div>
                <form onsubmit="handlePinDueno(event)">
                    <div class="form-group">
                        <label>Contraseña Interna</label>
                        <input type="password" id="pinDuenoInput" placeholder="Tu contraseña de dueño" required>
                    </div>
                    <button type="submit" class="btn" id="btnPinDueno">Entrar al panel</button>
                </form>
                <div class="links">
                    <a onclick="backToLogin()">← Volver</a>
                </div>
            </div>
        </div>

        <div class="back-link">
            <a href="/">Volver al sitio</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "https://eyfgkopaamnkprzpwocz.supabase.co";
        const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5Zmdrb3BhYW1ua3ByenB3b2N6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2MTk0ODMsImV4cCI6MjA5NDE5NTQ4M30.bXkq4Ks3p2yb2SQH76__8jXhmM5Thi2izIL5UPkKa0I";
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

        let currentUser = null;
        let userEmpresa = null;

        // =============================================
        // INIT: si ya hay sesión, buscar quién es y redirigir
        // =============================================
        (async () => {
            const { data: { session } } = await sb.auth.getSession();
            if (session && session.user) {
                currentUser = session.user;
                await redirigirPorTipo(session.user);
            } else {
                showStep('step-login');
            }
            document.getElementById('authLoader').style.display = 'none';
            document.getElementById('loginCard').classList.remove('hidden');
        })();

        function showStep(id) {
            document.querySelectorAll('[id^="step-"]').forEach(s => s.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        function showError(id, msg) {
            const el = document.getElementById(id);
            if (msg) { el.textContent = msg; el.classList.add('show'); }
            else { el.textContent = ''; el.classList.remove('show'); }
        }

        // =============================================
        // BUSCAR QUIÉN ES EL USUARIO Y REDIRIGIR
        // =============================================
        async function redirigirPorTipo(user) {
            const userId = user.id;
            const email = user.email;

            // 1. Buscar si es ADMIN de la plataforma
            const { data: profile } = await sb.from('perfiles').select('*').eq('id', userId).single();
            if (profile && profile.role === 'admin') {
                window.location.href = '/admin/';
                return;
            }

            // 2. Buscar si es CHOFER
            if (profile && profile.type === 'chofer') {
                if (profile.status === 'aprobado') {
                    window.location.href = '/chofer/';
                    return;
                }
                showError('errorMsg', 'Tu cuenta de chofer está ' + profile.status + '. Esperá la aprobación.');
                await sb.auth.signOut();
                return;
            }

            // 3. Buscar si es EMPRESA (dueño de restaurante/negocio)
            const { data: empresa } = await sb.from('empresas')
                .select('*')
                .eq('usuario_id', userId)
                .limit(1);

            if (empresa && empresa.length > 0) {
                userEmpresa = empresa[0];

                // Si la empresa tiene pin_dueno, pedirlo
                if (userEmpresa.pin_dueno) {
                    document.getElementById('empresaName').textContent = userEmpresa.nombre || 'Tu restaurante te espera';
                    showStep('step-pin-dueno');
                    return;
                }

                // Si no tiene pin_dueno, entrar directo a gestión
                localStorage.setItem('urbanflow_empresa_id', userEmpresa.id);
                window.location.href = '/restaurant_system/gestion.html';
                return;
            }

            // 4. Buscar si es EMPLEADO de alguna empresa
            const { data: empleado } = await sb.from('empleados')
                .select('*')
                .eq('email', email)
                .eq('activo', true)
                .limit(1);

            if (empleado && empleado.length > 0) {
                const emp = empleado[0];
                const token = btoa(JSON.stringify({ empId: emp.id, pin: emp.pin }));
                const rol = (emp.rol || '').toLowerCase();

                if (rol.includes('cajero')) {
                    window.location.href = '/restaurant_system/pos.html?empresa=' + emp.empresa_id;
                } else {
                    window.location.href = '/restaurant_system/app.html?token=' + encodeURIComponent(token);
                }
                return;
            }

            // 5. No se encontró en ningún lado
            showError('errorMsg', 'Tu cuenta no está registrada en ningún sistema. Registrate como empresa o pedí al dueño que te cree como empleado.');
            await sb.auth.signOut();
        }

        // =============================================
        // LOGIN
        // =============================================
        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const pass = document.getElementById('password').value.trim();
            if (!email || !pass) { showError('errorMsg', 'Completa email y contraseña'); return; }

            document.getElementById('btnLogin').disabled = true;
            document.getElementById('btnLogin').textContent = 'Entrando...';
            showError('errorMsg', '');

            const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });

            if (error) {
                showError('errorMsg', error.message.includes('Invalid') ? 'Email o contraseña incorrectos' : error.message);
                document.getElementById('btnLogin').disabled = false;
                document.getElementById('btnLogin').textContent = 'Entrar';
                return;
            }

            // Login OK → buscar quién es y redirigir
            currentUser = data.user;
            await redirigirPorTipo(data.user);

            document.getElementById('btnLogin').disabled = false;
            document.getElementById('btnLogin').textContent = 'Entrar';
        }

        // =============================================
        // REGISTRO DE EMPRESA
        // =============================================
        async function handleRegister(e) {
            e.preventDefault();
            const email = document.getElementById('regEmail').value.trim();
            const pass = document.getElementById('regPassword').value.trim();
            const pinDueno = document.getElementById('regPinDueno').value.trim();

            if (!email || !pass) { showError('regErrorMsg', 'Completa email y contraseña'); return; }
            if (pass.length < 6) { showError('regErrorMsg', 'La contraseña debe tener al menos 6 caracteres'); return; }
            if (!pinDueno) { showError('regErrorMsg', 'Poné tu contraseña de Dueño'); return; }

            document.getElementById('btnRegister').disabled = true;
            document.getElementById('btnRegister').textContent = 'Creando...';
            showError('regErrorMsg', '');

            const { data, error } = await sb.auth.signUp({ email, password: pass });

            if (error) {
                showError('regErrorMsg', error.message.includes('already') ? 'Ese email ya está registrado' : error.message);
                document.getElementById('btnRegister').disabled = false;
                document.getElementById('btnRegister').textContent = 'Crear cuenta';
                return;
            }

            const userId = data.user?.id;
            if (!userId) {
                showError('regErrorMsg', 'Error al crear usuario');
                document.getElementById('btnRegister').disabled = false;
                document.getElementById('btnRegister').textContent = 'Crear cuenta';
                return;
            }

            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            const codigoInterno = Array.from({length:8}, () => chars[Math.floor(Math.random()*chars.length)]).join('');

            const { error: empError } = await sb.from('empresas').insert({
                usuario_id: userId,
                email: email,
                nombre: '',
                rubro: 'restaurante',
                pin_dueno: pinDueno,
                codigo_interno: codigoInterno,
                status: 'pendiente',
                activo: true
            });

            if (empError) {
                showError('regErrorMsg', 'Error: ' + empError.message);
                document.getElementById('btnRegister').disabled = false;
                document.getElementById('btnRegister').textContent = 'Crear cuenta';
                return;
            }

            userEmpresa = (await sb.from('empresas').select('*').eq('usuario_id', userId).limit(1)).data?.[0];
            if (userEmpresa) {
                localStorage.setItem('urbanflow_empresa_id', userEmpresa.id);
                window.location.href = '/restaurant_system/gestion.html';
            } else {
                showError('regErrorMsg', 'Cuenta creada. Entrá con tu email y contraseña.');
                document.getElementById('btnRegister').disabled = false;
                document.getElementById('btnRegister').textContent = 'Crear cuenta';
            }
        }

        // =============================================
        // PIN DEL DUEÑO
        // =============================================
        async function handlePinDueno(e) {
            e.preventDefault();
            const pin = document.getElementById('pinDuenoInput').value.trim();
            if (!pin) { showError('pinDuenoError', 'Ingresá tu contraseña'); return; }

            document.getElementById('btnPinDueno').disabled = true;
            document.getElementById('btnPinDueno').textContent = 'Verificando...';
            showError('pinDuenoError', '');

            if (!userEmpresa || userEmpresa.pin_dueno !== pin) {
                showError('pinDuenoError', 'Contraseña incorrecta');
                document.getElementById('btnPinDueno').disabled = false;
                document.getElementById('btnPinDueno').textContent = 'Entrar al panel';
                return;
            }

            localStorage.setItem('urbanflow_empresa_id', userEmpresa.id);
            window.location.href = '/restaurant_system/gestion.html';
        }

        function backToLogin() {
            sb.auth.signOut();
            currentUser = null;
            userEmpresa = null;
            showStep('step-login');
        }

        function showLogin() {
            showError('regErrorMsg', '');
            showStep('step-login');
        }

        function showRegister() {
            showError('errorMsg', '');
            showStep('step-register');
        }
    </script>
</body>
</html>
