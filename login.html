<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UrbanFlow — Acceso</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0e1a;
            color: #e6edf3;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }
        .logo-section {
            text-align: center;
            margin-bottom: 40px;
        }
        .logo-section h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #6C63FF, #58A6FF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        .logo-section p {
            color: #8b949e;
            font-size: 14px;
        }
        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 32px;
        }
        .card h2 {
            font-size: 20px;
            margin-bottom: 24px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            color: #8b949e;
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 14px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            color: #e6edf3;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-group input:focus {
            border-color: #58A6FF;
        }
        .form-group input::placeholder {
            color: #484f58;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: #6C63FF;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 8px;
        }
        .btn:hover { background: #5a52e0; }
        .btn:disabled {
            background: #21262d;
            color: #484f58;
            cursor: not-allowed;
        }
        .error-msg {
            background: #3a1a1a;
            border: 1px solid #f85149;
            color: #f85149;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }
        .error-msg.show { display: block; }
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        .back-link a {
            color: #58A6FF;
            text-decoration: none;
            font-size: 13px;
        }
        .back-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo-section">
            <h1>UrbanFlow</h1>
            <p>Panel de administración</p>
        </div>

        <div class="card">
            <h2>Iniciar sesión</h2>

            <div class="error-msg" id="errorMsg"></div>

            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="tu@email.com" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn" id="btnLogin">Entrar</button>
            </form>
        </div>

        <div class="back-link">
            <a href="/">← Volver al sitio</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "https://eyfgkopaamnkprzpwocz.supabase.co";
        const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5Zmdrb3BhYW1ua3ByenB3b2N6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2MTk0ODMsImV4cCI6MjA5NDE5NTQ4M30.bXkq4Ks3p2yb2SQH76__8jXhmM5Thi2izIL5UPkKa0I";
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

        // Verificar si ya hay sesión
        (async () => {
            const { data: { session } } = await sb.auth.getSession();
            if (session) {
                await redirectByRole(session.user.id);
            }
        })();

        // Mostrar error si viene de redirect
        const params = new URLSearchParams(window.location.search);
        const errorParam = params.get("error");
        if (errorParam === "not_admin") {
            showError("Tu cuenta no tiene acceso al panel de administración.");
        } else if (errorParam === "no_profile") {
            showError("No se encontró tu perfil. Contacta al administrador.");
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value.trim();
            const btn = document.getElementById("btnLogin");

            if (!email || !password) {
                showError("Completa email y contraseña");
                return;
            }

            btn.disabled = true;
            btn.textContent = "Entrando...";

            const { data, error } = await sb.auth.signInWithPassword({ email, password });

            if (error) {
                btn.disabled = false;
                btn.textContent = "Entrar";
                showError("Email o contraseña incorrectos");
                return;
            }

            await redirectByRole(data.user.id);
        }

        async function redirectByRole(userId) {
            // Primero buscar en perfiles
            const { data: profile } = await sb
                .from("perfiles")
                .select("type, role, status")
                .eq("id", userId)
                .single();

            if (profile && profile.role === "admin") {
                window.location.href = "/admin/";
                return;
            }

            // Buscar si es empresa
            const { data: empresas } = await sb
                .from("empresas")
                .select("id, status")
                .eq("usuario_id", userId);

            if (empresas && empresas.length > 0) {
                const empresa = empresas[0];
                if (empresa.status === "aprobado") {
                    window.location.href = "/empresa/";
                    return;
                } else {
                    showError("Tu empresa está " + empresa.status + ". Espera aprobación.");
                    await sb.auth.signOut();
                    return;
                }
            }

            // No es admin ni empresa
            showError("Tu cuenta no tiene acceso al panel. Usa la app móvil.");
            await sb.auth.signOut();
        }

        function showError(msg) {
            const el = document.getElementById("errorMsg");
            el.textContent = msg;
            el.classList.add("show");
        }
    </script>
</body>
</html>
