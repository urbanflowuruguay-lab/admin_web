<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UrbanFlow — Acceso</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0e1a; color: #e6edf3; min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
        }
        .login-container { width: 100%; max-width: 420px; padding: 20px; }
        .logo-section { text-align: center; margin-bottom: 30px; }
        .logo-section img { max-width: 160px; margin-bottom: 10px; }
        .role-badge {
            display: inline-block; padding: 6px 16px; border-radius: 20px;
            font-size: 13px; font-weight: 600; margin-bottom: 8px;
        }
        .role-chofer .role-badge { background: rgba(218,54,51,0.15); color: #f85149; border: 1px solid rgba(218,54,51,0.3); }
        .role-usuario .role-badge { background: rgba(108,99,255,0.15); color: #a5a0ff; border: 1px solid rgba(108,99,255,0.3); }
        .role-servicios .role-badge { background: rgba(35,134,54,0.15); color: #3fb950; border: 1px solid rgba(35,134,54,0.3); }
        .logo-section p { color: #8b949e; font-size: 14px; }
        .card {
            background: #161b22; border: 1px solid #30363d;
            border-radius: 12px; padding: 32px;
        }
        .card h2 { font-size: 20px; margin-bottom: 24px; text-align: center; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; color: #8b949e; margin-bottom: 6px; }
        .form-group input, .form-group select {
            width: 100%; padding: 12px 14px; background: #0d1117;
            border: 1px solid #30363d; border-radius: 8px;
            color: #e6edf3; font-size: 15px; outline: none; transition: border-color 0.2s;
        }
        .form-group input:focus, .form-group select:focus { border-color: #58A6FF; }
        .form-group input::placeholder { color: #484f58; }
        .form-group select option { background: #0d1117; color: #e6edf3; }
        .btn {
            width: 100%; padding: 12px; color: white; border: none;
            border-radius: 8px; font-size: 15px; font-weight: 600;
            cursor: pointer; transition: background 0.2s; margin-top: 8px;
        }
        .btn-chofer { background: #da3633; }
        .btn-chofer:hover { background: #f85149; }
        .btn-usuario { background: #6C63FF; }
        .btn-usuario:hover { background: #5a52e0; }
        .btn-servicios { background: #238636; }
        .btn-servicios:hover { background: #2ea043; }
        .btn:disabled { background: #21262d; color: #484f58; cursor: not-allowed; }
        .error-msg {
            background: #3a1a1a; border: 1px solid #f85149; color: #f85149;
            padding: 10px 14px; border-radius: 8px; font-size: 13px;
            margin-bottom: 16px; display: none;
        }
        .error-msg.show { display: block; }
        .toggle-text {
            text-align: center; margin-top: 16px; font-size: 13px; color: #8b949e;
        }
        .toggle-text a { color: #58A6FF; text-decoration: none; cursor: pointer; }
        .toggle-text a:hover { text-decoration: underline; }
        .back-link { text-align: center; margin-top: 20px; }
        .back-link a { color: #58A6FF; text-decoration: none; font-size: 13px; }
        .back-link a:hover { text-decoration: underline; }
        .register-fields { display: none; }
    </style>
</head>
<body>
    <div class="login-container" id="loginBox">
        <div class="logo-section">
            <img src="/logouf.png" alt="UrbanFlow">
            <div id="roleBadge" class="role-badge"></div>
            <p id="roleDesc"></p>
        </div>

        <div class="card">
            <h2 id="formTitle">Iniciar sesion</h2>
            <div class="error-msg" id="errorMsg"></div>

            <form onsubmit="handleSubmit(event)">
                <div class="register-fields" id="registerFields">
                    <div class="form-group">
                        <label for="nombre">Nombre completo</label>
                        <input type="text" id="nombre" placeholder="Tu nombre">
                    </div>
                    <div class="form-group">
                        <label for="telefono">Telefono</label>
                        <input type="tel" id="telefono" placeholder="+598 99 123 456">
                    </div>
                    <div class="form-group" id="vehiculoGroup" style="display:none;">
                        <label for="vehiculo">Tipo de vehiculo</label>
                        <select id="vehiculo">
                            <option value="auto">Auto</option>
                            <option value="moto">Moto</option>
                            <option value="van">Van</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="tu@email.com" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="password">Contrasena</label>
                    <input type="password" id="password" placeholder="Minimo 6 caracteres" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn" id="btnSubmit">Entrar</button>
            </form>

            <div class="toggle-text">
                <span id="toggleText">No tenes cuenta?</span>
                <a id="toggleLink" onclick="toggleMode()">Registrate</a>
            </div>
        </div>

        <div class="back-link">
            <a href="/">Volver al sitio</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "https://eyfgkopaamnkprzpwocz.supabase.co";
        const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5Zmdrb3BhYW1ua3ByenB3b2N6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2MTk0ODMsImV4cCI6MjA5NDE5NTQ4M30.bXkq4Ks3p2yb2SQH76__8jXhmM5Thi2izIL5UPkKa0I";
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

        const params = new URLSearchParams(window.location.search);
        const role = params.get("role") || "usuario";
        let isRegister = false;

        const roleConfig = {
            chofer: { label: "Chofer", desc: "Genera ingresos con tu vehiculo", icon: "🚗", color: "chofer" },
            usuario: { label: "Pasajero", desc: "Solicita viajes rapidos y seguros", icon: "👤", color: "usuario" },
            servicios: { label: "Servicios", desc: "Gestiona tu negocio en la plataforma", icon: "🏪", color: "servicios" }
        };
        const cfg = roleConfig[role] || roleConfig.usuario;

        document.getElementById("loginBox").className = "login-container role-" + cfg.color;
        document.getElementById("roleBadge").textContent = cfg.icon + " " + cfg.label;
        document.getElementById("roleDesc").textContent = cfg.desc;
        document.getElementById("btnSubmit").className = "btn btn-" + cfg.color;

        const errorParam = params.get("error");
        if (errorParam === "not_admin") showError("Tu cuenta no tiene acceso al panel de administracion.");
        else if (errorParam === "no_profile") showError("No se encontro tu perfil. Contacta al administrador.");

        (async () => {
            const { data: { session } } = await sb.auth.getSession();
            if (session) await redirectByRole(session.user.id);
        })();

        function toggleMode() {
            isRegister = !isRegister;
            document.getElementById("formTitle").textContent = isRegister ? "Crear cuenta" : "Iniciar sesion";
            document.getElementById("btnSubmit").textContent = isRegister ? "Registrarme" : "Entrar";
            document.getElementById("registerFields").style.display = isRegister ? "" : "none";
            document.getElementById("toggleText").textContent = isRegister ? "Ya tenes cuenta?" : "No tenes cuenta?";
            document.getElementById("toggleLink").textContent = isRegister ? "Inicia sesion" : "Registrate";
            document.getElementById("vehiculoGroup").style.display = (isRegister && role === "chofer") ? "" : "none";
            showError("");
        }

        async function handleSubmit(e) {
            e.preventDefault();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value.trim();
            const btn = document.getElementById("btnSubmit");

            if (!email || !password) { showError("Completa email y contrasena"); return; }
            if (isRegister && password.length < 6) { showError("La contrasena debe tener al menos 6 caracteres"); return; }

            btn.disabled = true;
            btn.textContent = isRegister ? "Creando cuenta..." : "Entrando...";

            let result;
            if (isRegister) {
                const nombre = document.getElementById("nombre").value.trim();
                const telefono = document.getElementById("telefono").value.trim();
                result = await sb.auth.signUp({ email, password, options: { data: { nombre, telefono, role } } });

                if (!result.error && result.data.user) {
                    await sb.from("perfiles").upsert({
                        id: result.data.user.id,
                        email: email,
                        full_name: nombre,
                        phone: telefono,
                        type: role,
                        role: role === "admin" ? "admin" : "user",
                        status: "activo"
                    });

                    if (role === "chofer") {
                        const vehiculo = document.getElementById("vehiculo").value;
                        await sb.from("choferes").upsert({
                            user_id: result.data.user.id,
                            nombre: nombre,
                            telefono: telefono,
                            tipo_vehiculo: vehiculo,
                            status: "pendiente"
                        });
                    }

                    if (result.data.session) {
                        await redirectByRole(result.data.user.id);
                        return;
                    }
                    showError("Cuenta creada. Revisa tu email para confirmar.");
                    btn.disabled = false;
                    btn.textContent = "Registrarme";
                    return;
                }
            } else {
                result = await sb.auth.signInWithPassword({ email, password });
                if (!result.error) {
                    await redirectByRole(result.data.user.id);
                    return;
                }
            }

            btn.disabled = false;
            btn.textContent = isRegister ? "Registrarme" : "Entrar";
            if (result.error) {
                if (result.error.message.includes("already")) showError("Este email ya esta registrado. Inicia sesion.");
                else if (result.error.message.includes("Invalid login")) showError("Email o contrasena incorrectos");
                else showError(result.error.message);
            }
        }

        async function redirectByRole(userId) {
            const { data: profile } = await sb.from("perfiles").select("type, role, status").eq("id", userId).single();

            if (profile && profile.role === "admin") {
                window.location.href = "/admin/";
                return;
            }

            const { data: empresas } = await sb.from("empresas").select("id, status").eq("usuario_id", userId);
            if (empresas && empresas.length > 0) {
                if (empresas[0].status === "aprobado") { window.location.href = "/empresa/"; return; }
                showError("Tu empresa esta " + empresas[0].status + ". Espera aprobacion.");
                await sb.auth.signOut();
                return;
            }

            if (role === "chofer") {
                const { data: chofer } = await sb.from("choferes").select("id, status").eq("user_id", userId).single();
                if (chofer) {
                    if (chofer.status === "habilitado") { window.location.href = "/chofer/"; return; }
                    showError("Tu cuenta de chofer esta " + chofer.status + ".");
                    await sb.auth.signOut();
                    return;
                }
            }

            if (profile && (profile.type === "chofer" || profile.type === "usuario" || profile.type === "servicios")) {
                showError("Tu cuenta esta pendiente. Pronto podras acceder.");
                await sb.auth.signOut();
                return;
            }

            showError("Tu cuenta no tiene acceso. Usa la app movil.");
            await sb.auth.signOut();
        }

        function showError(msg) {
            const el = document.getElementById("errorMsg");
            if (msg) { el.textContent = msg; el.classList.add("show"); }
            else { el.textContent = ""; el.classList.remove("show"); }
        }
    </script>
</body>
</html>
