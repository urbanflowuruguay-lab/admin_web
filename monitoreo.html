<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Monitoreo Real-Time - UrbanFlow</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href='https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css' rel='stylesheet' />
    <script src='https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js'></script>
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background: #0d1117; color: white; overflow: hidden; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
        .controls {
            position: absolute; top: 15px; left: 15px; z-index: 10;
            background: rgba(22, 27, 34, 0.9); padding: 12px; border-radius: 10px;
            border: 1px solid #30363d; display: flex; flex-direction: column; gap: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .btn-group { display: flex; gap: 5px; }
        .btn {
            padding: 8px 12px; border: none; border-radius: 6px; cursor: pointer;
            font-weight: bold; font-size: 11px; background: #21262d; color: #c9d1d9;
            transition: 0.2s; border: 1px solid #30363d; text-transform: uppercase;
        }
        .btn.active { background: #1f6feb; color: white; border-color: #58a6ff; }
        
        .stats {
            position: absolute; top: 15px; right: 15px; z-index: 10;
            background: rgba(22, 27, 34, 0.9); padding: 12px; border-radius: 10px;
            border: 1px solid #30363d; font-size: 11px; min-width: 120px;
        }
        .stat-item { display: flex; justify-content: space-between; margin-bottom: 4px; border-bottom: 1px solid #21262d; padding-bottom: 2px; }
        .stat-item:last-child { border: none; }
        
        .marker-label {
            background: rgba(0,0,0,0.7); color: white; padding: 2px 6px;
            border-radius: 4px; font-size: 10px; white-space: nowrap;
            font-weight: bold; border: 1px solid #58a6ff; pointer-events: none;
        }
        .car-marker {
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
            transition: transform 0.4s linear, opacity 0.3s ease; /* Movimiento fluido sin parpadeo */
        }
    </style>
</head>
<body>

<div class="controls">
    <div style="font-weight: bold; font-size: 12px; color: #58a6ff; margin-bottom: 2px;">🛰️ MONITOR EN VIVO</div>
    <div class="btn-group">
        <button id="btnAll" class="btn active" onclick="setFilter('all')">TODOS</button>
        <button id="btnAutos" class="btn" onclick="setFilter('auto')">🚗 AUTOS</button>
        <button id="btnTaxis" class="btn" onclick="setFilter('taxi')">🚕 TAXIS</button>
    </div>
    <div id="statusInfo" style="font-size: 9px; color: #8b949e;">Conectando...</div>
</div>

<div class="stats">
    <div class="stat-item"><span>Total:</span> <span id="countTotal" style="font-weight: bold;">0</span></div>
    <div class="stat-item" style="color: #58a6ff;"><span>Autos:</span> <span id="countAutos">0</span></div>
    <div class="stat-item" style="color: #f2d335;"><span>Taxis:</span> <span id="countTaxis">0</span></div>
</div>

<div id="map"></div>

<script>
    const SUPABASE_URL = "https://eyfgkopaamnkprzpwocz.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5Zmdrb3BhYW1ua3ByenB3b2N6Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3ODYxOTQ4MywiZXhwIjoyMDk0MTk1NDgzfQ.GIEEonN5-YGK1hBLloSun9WX-almQfnQW-0LdGOHmCk";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentFilter = 'all';
    const markers = {};
    const lastUpdate = {};
    let firstMarkerFound = false;

    const map = new maplibregl.Map({
        container: 'map',
        style: 'https://tiles.openfreemap.org/styles/dark',
        center: [-56.1645, -34.9011],
        zoom: 13
    });

    function setFilter(filter) {
        currentFilter = filter;
        document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
        const b = document.getElementById('btn' + filter.charAt(0).toUpperCase() + filter.slice(1) + (filter === 'all' ? '' : 's'));
        if(b) b.classList.add('active');
        updateMarkersVisibility();
    }

    function updateMarkersVisibility() {
        Object.keys(markers).forEach(id => {
            const isVisible = (currentFilter === 'all' || markers[id].data.tipo === currentFilter);
            markers[id].marker.getElement().style.display = isVisible ? 'flex' : 'none';
        });
    }

    function sz() {
        const z = map.getZoom();
        return z >= 16 ? 42 : z >= 14 ? 30 : z >= 12 ? 20 : z >= 10 ? 14 : 10;
    }

    map.on('zoom', () => {
        const s = sz(), ls = Math.max(8, Math.round(s * 0.28));
        Object.values(markers).forEach(({ marker }) => {
            const el = marker.getElement();
            const c = el.querySelector('.car-marker');
            if (c) { c.style.width = s + 'px'; c.style.height = s + 'px'; }
            const l = el.querySelector('.marker-label');
            if (l) { l.style.fontSize = ls + 'px'; l.style.marginTop = -(s + 8) + 'px'; }
        });
    });

    function updateStats() {
        let t = 0, a = 0, x = 0;
        Object.values(markers).forEach(m => { t++; m.data.tipo === 'taxi' ? x++ : a++; });
        document.getElementById('countTotal').innerText = t;
        document.getElementById('countAutos').innerText = a;
        document.getElementById('countTaxis').innerText = x;
    }

    const channel = supabaseClient.channel('monitoreo_choferes', {
        config: { presence: { key: 'admin-' + Math.floor(Math.random()*10000) } }
    });

    channel
        .on('presence', { event: 'sync' }, () => {
            const state = channel.presenceState();
            Object.values(state).forEach(arr => arr.forEach(p => {
                const id = String(p.id || p.user_id);
                if (id && !id.startsWith('admin')) {
                    // Solo inicializamos si no existe, evitamos moverlo aquí para no causar parpadeos con el sync
                    if (!markers[id]) {
                        upsertMarker({ id, nombre: p.nombre, tipo: p.tipo, lat: p.lat, lng: p.lng, status: p.status });
                    }
                }
            }));
            updateStats();
        })
        .on('broadcast', { event: 'location' }, ({ payload }) => {
            if (payload && payload.id) upsertMarker(payload);
        })
        .subscribe(async (s) => {
            document.getElementById('statusInfo').innerText = "Estado: " + s;
            if (s === 'SUBSCRIBED') {
                document.getElementById('statusInfo').style.color = "#238636";
                await channel.track({ online_at: new Date().toISOString() });
            }
        });

    function upsertMarker(data) {
        if (!data.lat || !data.lng || !data.id) return;
        const id = String(data.id);
        const now = Date.now();

        // Si la posición no cambió significativamente, ignoramos para evitar micro-movimientos
        if (markers[id] && markers[id].data.lat === data.lat && markers[id].data.lng === data.lng) return;
        
        lastUpdate[id] = now;

        if (markers[id]) {
            const m = markers[id];
            m.marker.setLngLat([data.lng, data.lat]);
            m.data = data;
            const el = m.marker.getElement();
            const car = el.querySelector('.car-marker');
            if (car) car.style.opacity = data.status === 'ocupado' ? '0.35' : '1';
            el.querySelector('.marker-label').innerText = data.nombre || 'Chofer';
            el.style.opacity = '1';
        } else {
            const s = sz(), ls = Math.max(8, Math.round(s * 0.28));
            const c = document.createElement('div');
            c.style.cssText = 'display:flex;flex-direction:column;align-items:center;transition:opacity 0.3s;';

            const l = document.createElement('div');
            l.className = 'marker-label'; l.innerText = data.nombre || 'Chofer';
            l.style.fontSize = ls + 'px'; l.style.marginTop = -(s + 8) + 'px';
            c.appendChild(l);

            const carIcon = document.createElement('div');
            carIcon.className = 'car-marker';
            carIcon.style.width = s + 'px'; carIcon.style.height = s + 'px';
            carIcon.style.backgroundImage = `url(${data.tipo === 'taxi' ? '/taxi.png' : '/autorojo.png'})`;
            carIcon.style.opacity = data.status === 'ocupado' ? '0.35' : '1';
            c.appendChild(carIcon);

            const marker = new maplibregl.Marker({ element: c, pitchAlignment: 'viewport', rotationAlignment: 'viewport' })
                .setLngLat([data.lng, data.lat])
                .addTo(map);

            markers[id] = { marker, data };

            if (!firstMarkerFound) {
                firstMarkerFound = true;
                map.flyTo({ center: [data.lng, data.lat], zoom: 15 });
            }
        }
        updateMarkersVisibility();
    }

    // Limpieza de choferes sin señal (60 segundos)
    setInterval(() => {
        const now = Date.now();
        Object.keys(markers).forEach(id => {
            const diff = now - (lastUpdate[id] || 0);
            if (diff > 60000) {
                markers[id].marker.remove();
                delete markers[id];
                delete lastUpdate[id];
                updateStats();
            } else if (diff > 30000) {
                markers[id].marker.getElement().style.opacity = '0.3';
            }
        });
    }, 5000);
</script>

</body>
</html>
