<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Zonas Taxi - UrbanFlow</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/auth-check.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 25px; background-color: #0d1117; color: #c9d1d9; margin: 0; }
        h1 { color: #f39c12; display: flex; align-items: center; gap: 15px; }
        .description { color: #8b949e; margin-bottom: 20px; font-size: 14px; }

        .card { background: #161b22; padding: 25px; border-radius: 12px; border: 1px solid #30363d; margin-bottom: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
        .card h3 { color: #f39c12; margin-top: 0; margin-bottom: 20px; border-bottom: 1px solid #30363d; padding-bottom: 10px; }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; }
        .grid-4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-group label { font-size: 11px; font-weight: bold; color: #8b949e; text-transform: uppercase; }
        .form-group .hint { font-size: 11px; color: #6e7681; margin-top: 2px; }

        input[type="number"], input[type="text"] {
            padding: 12px; border-radius: 8px; border: 1px solid #30363d;
            background: #0d1117; color: white; width: 100%; box-sizing: border-box; font-size: 14px;
        }
        input:focus { border-color: #f39c12; outline: none; box-shadow: 0 0 0 2px rgba(243,156,18,0.2); }

        .section-label {
            font-size: 11px; color: #8b949e; text-transform: uppercase; letter-spacing: 1px;
            margin: 20px 0 10px 0; font-weight: bold; border-left: 3px solid #f39c12; padding-left: 10px;
        }

        .zone-card {
            background: #0d1117; border: 1px solid #30363d; border-radius: 10px; padding: 20px;
            margin-bottom: 15px; transition: 0.3s;
        }
        .zone-card:hover { border-color: #f39c12; }
        .zone-card.active { border-color: #238636; }
        .zone-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .zone-name { font-size: 18px; font-weight: bold; color: #f39c12; }
        .zone-dept { color: #8b949e; font-size: 13px; }
        .zone-status { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .zone-status.on { background: #1a3a1a; color: #4ade80; border: 1px solid #238636; }
        .zone-status.off { background: #3a1a1a; color: #f85149; border: 1px solid #da3633; }

        .btn { padding: 12px 24px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.3s; }
        .btn-save { background: #238636; color: white; width: 100%; margin-top: 20px; }
        .btn-save:hover { background: #2ea043; }
        .btn-add { background: #f39c12; color: #0d1117; margin-bottom: 20px; }
        .btn-add:hover { background: #e67e22; }
        .btn-delete { background: #da3633; color: white; font-size: 12px; padding: 6px 12px; }
        .btn-delete:hover { background: #b62324; }
        .btn-edit { background: #58a6ff; color: #0d1117; font-size: 12px; padding: 6px 12px; margin-right: 8px; }

        .formula-box {
            background: linear-gradient(135deg, #2a1a08, #1a0f05); border: 2px solid #f39c12;
            border-radius: 12px; padding: 20px; text-align: center; margin: 20px 0;
        }
        .formula-box .label { color: #f39c12; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
        .formula-box .formula { color: #ffffff; font-size: 16px; font-family: monospace; }

        .example-box {
            background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 15px; margin-top: 15px;
        }
        .example-box .row { display: flex; justify-content: space-between; margin-bottom: 5px; }
        .example-box .key { color: #8b949e; }
        .example-box .val { color: #f39c12; font-weight: bold; }

        .preview { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 15px; margin-top: 15px; }
        .preview .item { display: inline-block; margin-right: 15px; }
        .preview .item .k { color: #8b949e; font-size: 12px; }
        .preview .item .v { color: #f39c12; font-weight: bold; }

        .toast { position: fixed; bottom: 20px; right: 20px; padding: 15px 25px; border-radius: 8px; color: white; font-weight: bold; z-index: 9999; animation: slideIn 0.3s ease; }
        .toast.success { background: #238636; }
        .toast.error { background: #da3633; }
        @keyframes slideIn { from { transform: translateY(100px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body>
    <h1>🚕 Configuración de Zonas Taxi</h1>
    <p class="description">Defina las tarifas de taxi por zona/departamento. El chofer NO ve precios, solo direcciones — el taxímetro hace el cobro.</p>

    <div id="zonesContainer"></div>

    <button class="btn btn-add" onclick="addNewZone()">+ Agregar Zona Taxi</button>

    <div id="editModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:1000; display:none; align-items:center; justify-content:center;">
        <div style="background:#161b22; border:1px solid #30363d; border-radius:12px; padding:30px; max-width:700px; width:90%; max-height:90vh; overflow-y:auto;">
            <h2 style="color:#f39c12; margin-top:0;">Editar Zona Taxi</h2>
            <div id="editForm"></div>
        </div>
    </div>

    <script>
        let sb = null;
        let allZones = [];
        let uiToPesos = 4.85;

        document.addEventListener('auth-ready', async (e) => {
            sb = e.detail.sb;
            await loadUIValue();
            loadZones();
        });

        async function loadUIValue() {
            if (!sb) return;
            try {
                const { data, error } = await sb.from('config_tarifas').select('ui_value').eq('pais_code', 'UY');
                if (!error && data && data.length > 0 && data[0].ui_value && data[0].ui_value > 0) {
                    uiToPesos = data[0].ui_value;
                    return;
                }
            } catch (e) { console.log('DB fetch failed, trying API'); }
            try {
                const resp = await fetch('/api/update-ui');
                const result = await resp.json();
                if (result.success && result.value) uiToPesos = result.value;
            } catch (e) { console.log('API fetch also failed'); }
        }

        async function loadZones() {
            if (!sb) return;
            const { data, error } = await sb.from('taxi_zones').select('*').order('created_at');
            if (error) { showToast('Error: ' + error.message, 'error'); return; }
            allZones = data || [];
            renderZones();
        }

        function renderZones() {
            const container = document.getElementById('zonesContainer');
            if (allZones.length === 0) {
                container.innerHTML = '<div class="card"><p style="text-align:center;color:#8b949e;">No hay zonas taxi configuradas. Agregue una zona para comenzar.</p></div>';
                return;
            }

            container.innerHTML = allZones.map(z => `
                <div class="zone-card ${z.active ? 'active' : ''}">
                    <div class="zone-header">
                        <div>
                            <div class="zone-name">${z.zone_name} <span style="color:#8b949e;font-size:14px;">${z.currency || '$'}</span></div>
                            <div class="zone-dept">${z.department} — ${z.country_code}</div>
                        </div>
                        <div>
                            <span class="zone-status ${z.active ? 'on' : 'off'}">${z.active ? 'ACTIVA' : 'INACTIVA'}</span>
                        </div>
                    </div>

                    <div class="section-label">Valores de la Ficha</div>
                    <div class="grid-4">
                        <div class="form-group">
                            <label>Bajada de Bandera ($)</label>
                            <input type="number" value="${z.bajada_bandera}" id="bb_${z.id}" step="0.01" min="0">
                        </div>
                        <div class="form-group">
                            <label>Precio por Ficha ($)</label>
                            <input type="number" value="${z.ficha_price}" id="fp_${z.id}" step="0.01" min="0">
                        </div>
                        <div class="form-group">
                            <label>Metros Iniciales</label>
                            <input type="number" value="${z.initial_distance_m || 0}" id="idm_${z.id}" step="1" min="0">
                            <div class="hint">Metros antes de la 1ra ficha</div>
                        </div>
                        <div class="form-group">
                            <label>Metros por Ficha</label>
                            <input type="number" value="${z.ficha_distance_m}" id="fd_${z.id}" step="1" min="1">
                            <div class="hint">Cada cuántos metros cae 1 ficha</div>
                        </div>
                    </div>

                    <div class="grid-4" style="margin-top:15px;">
                        <div class="form-group">
                            <label>Segundos por Ficha</label>
                            <input type="number" value="${z.ficha_time_sec}" id="ft_${z.id}" step="1" min="1">
                            <div class="hint">Tiempo parado/&lt;25kmh = 1 ficha</div>
                        </div>
                        <div class="form-group">
                            <label>Índice Fuera de Zona</label>
                            <input type="number" value="${z.out_of_zone_index}" id="ooz_${z.id}" step="0.1" min="1">
                            <div class="hint">Multiplicador al salir del departamento</div>
                        </div>
                        <div class="form-group">
                            <label>Recargo Nocturno (%)</label>
                            <input type="number" value="${z.night_surcharge_pct}" id="ns_${z.id}" step="1" min="0">
                        </div>
                        <div class="form-group">
                            <label>Recargo Feriados (%)</label>
                            <input type="number" value="${z.holiday_surcharge_pct}" id="hs_${z.id}" step="1" min="0">
                        </div>
                    </div>

                    ${z.country_code === 'UY' ? `
                    <div class="section-label" style="margin-top:25px;">Precio UrbanFlow por Viaje (Taxi)</div>
                    <div style="background:#0d2818; border:1px solid #238636; border-radius:8px; padding:10px 15px; margin-bottom:15px; display:flex; justify-content:space-between; align-items:center;">
                        <span style="color:#4ade80; font-size:13px;">Valor UI actual (BCU):</span>
                        <span style="color:#fff; font-weight:bold; font-size:18px;">$${uiToPesos.toFixed(2)}</span>
                    </div>
                    <div class="grid-4">
                        <div class="form-group">
                            <label>UrbanFlow cobra (UI)</label>
                            <input type="number" value="${z.urbanflow_ficha_price || 10}" id="ufp_${z.id}" step="0.01" min="0">
                            <div class="hint">Lo que UrbanFlow recibe por viaje</div>
                        </div>
                        <div class="form-group">
                            <label>Equivalente en Pesos</label>
                            <div style="padding:12px; background:#161b22; border-radius:8px; border:1px solid #30363d; font-size:16px; font-weight:bold; color:#f39c12;">
                                $ <span id="ufpPesos_${z.id}">${((z.urbanflow_ficha_price || 10) * uiToPesos).toFixed(2)}</span>
                                <span style="font-size:12px; color:#8b949e; margin-left:8px;">(${(z.urbanflow_ficha_price || 10)} UI × ${uiToPesos.toFixed(2)})</span>
                            </div>
                            <div class="hint">1 UI ≈ $${uiToPesos.toFixed(2)}</div>
                        </div>
                        <div class="form-group">
                            <label>Cobrar al chofer (UI)</label>
                            <div style="padding:12px; background:#1a0f05; border-radius:8px; border:1px solid #f39c12; font-size:16px; font-weight:bold; color:#f39c12;">
                                <span id="ufpCharge_${z.id}">${((z.urbanflow_ficha_price || 10) / (1 - 0.0788)).toFixed(2)}</span> UI
                                <div style="font-size:12px; color:#8b949e; margin-top:4px;">≈ $<span id="ufpChargePesos_${z.id}">${(((z.urbanflow_ficha_price || 10) / (1 - 0.0788)) * uiToPesos).toFixed(2)}</span></div>
                            </div>
                            <div class="hint">Después de MP (7.88%) queda ${z.urbanflow_ficha_price || 10} UI</div>
                        </div>
                        <div class="form-group">
                            <label>Mínimo Recarga (fichas)</label>
                            <input type="number" value="${z.min_fichas_recharge || 10}" id="mfr_${z.id}" step="1" min="1">
                            <div class="hint">Cantidad mínima para recargar</div>
                        </div>
                    </div>
                    ` : ''}

                    <div class="formula-box">
                        <div class="label">Fórmula de Cálculo</div>
                        <div class="formula">Total = Bajada + (Fichas × Precio Ficha) × Nocturno × Feriado × FueraZona</div>
                    </div>

                    <div class="preview" id="preview_${z.id}">
                        <strong style="color:#8b949e;">Ejemplo:</strong>
                        <div class="item"><span class="k">Fichas: </span><span class="v" id="prevFichas_${z.id}">50</span></div>
                        <div class="item"><span class="k"> = $</span><span class="v" id="prevTotal_${z.id}">257.50</span></div>
                    </div>

                    <div style="margin-top:15px; display:flex; gap:10px;">
                        <button class="btn btn-save" style="width:auto; margin-top:0;" onclick="saveZone('${z.id}')">💾 Guardar</button>
                        <button class="btn btn-delete" onclick="deleteZone('${z.id}')">🗑️ Eliminar</button>
                    </div>
                </div>
            `).join('');

            allZones.forEach(z => {
                updatePreview(z.id);
                const ufpInput = document.getElementById(`ufp_${z.id}`);
                if (ufpInput) {
                    ufpInput.addEventListener('input', () => {
                        const val = parseFloat(ufpInput.value) || 0;
                        const pesosEl = document.getElementById(`ufpPesos_${z.id}`);
                        const chargeEl = document.getElementById(`ufpCharge_${z.id}`);
                        const chargePesosEl = document.getElementById(`ufpChargePesos_${z.id}`);
                        if (pesosEl) pesosEl.textContent = (val * uiToPesos).toFixed(2);
                        const chargeUI = val / (1 - 0.0788);
                        if (chargeEl) chargeEl.textContent = chargeUI.toFixed(2);
                        if (chargePesosEl) chargePesosEl.textContent = (chargeUI * uiToPesos).toFixed(2);
                    });
                }
            });
        }

        function updatePreview(zoneId) {
            const z = allZones.find(x => x.id === zoneId);
            if (!z) return;
            const bb = parseFloat(document.getElementById(`bb_${zoneId}`)?.value || z.bajada_bandera);
            const fp = parseFloat(document.getElementById(`fp_${zoneId}`)?.value || z.ficha_price);
            const fichas = 50;
            const total = bb + (fichas * fp);
            const el1 = document.getElementById(`prevFichas_${zoneId}`);
            const el2 = document.getElementById(`prevTotal_${zoneId}`);
            if (el1) el1.textContent = fichas;
            if (el2) el2.textContent = total.toFixed(2);
        }

        async function saveZone(id) {
            const bb = parseFloat(document.getElementById(`bb_${id}`).value);
            const fp = parseFloat(document.getElementById(`fp_${id}`).value);
            const idm = parseInt(document.getElementById(`idm_${id}`).value) || 0;
            const fd = parseInt(document.getElementById(`fd_${id}`).value);
            const ft = parseInt(document.getElementById(`ft_${id}`).value);
            const ooz = parseFloat(document.getElementById(`ooz_${id}`).value);
            const ns = parseFloat(document.getElementById(`ns_${id}`).value);
            const hs = parseFloat(document.getElementById(`hs_${id}`).value);
            const ufpEl = document.getElementById(`ufp_${id}`);
            const ufp = ufpEl ? parseFloat(ufpEl.value) : null;

            const updateData = {
                bajada_bandera: bb, ficha_price: fp, initial_distance_m: idm,
                ficha_distance_m: fd, ficha_time_sec: ft, out_of_zone_index: ooz,
                night_surcharge_pct: ns, holiday_surcharge_pct: hs,
                updated_at: new Date().toISOString()
            };
            if (ufp !== null) updateData.urbanflow_ficha_price = ufp;
            const mfrEl = document.getElementById(`mfr_${id}`);
            if (mfrEl) updateData.min_fichas_recharge = parseInt(mfrEl.value) || 10;

            const { error } = await sb.from('taxi_zones').update(updateData).eq('id', id);

            if (error) showToast('Error: ' + error.message, 'error');
            else showToast('Zona guardada', 'success');
        }

        async function deleteZone(id) {
            if (!confirm('¿Eliminar esta zona taxi?')) return;
            const { error } = await sb.from('taxi_zones').delete().eq('id', id);
            if (error) showToast('Error: ' + error.message, 'error');
            else { showToast('Zona eliminada', 'success'); loadZones(); }
        }

        async function addNewZone() {
            const name = prompt('Nombre de la zona:', 'Nueva Zona');
            if (!name) return;
            const dept = prompt('Departamento/Provincia:', 'Montevideo');
            if (!dept) return;
            const country = prompt('País (código):', 'UY');
            if (!country) return;
            const currency = prompt('Moneda ($, R$, AR$):', '$');

            const { data, error } = await sb.from('taxi_zones').insert({
                zone_name: name, department: dept, country_code: country.toUpperCase(),
                currency: currency, bajada_bandera: 66.00, ficha_price: 3.83,
                initial_distance_m: 0, ficha_distance_m: 100, ficha_time_sec: 18,
                out_of_zone_index: 1.5, active: true, urbanflow_ficha_price: 10.0,
                min_fichas_recharge: 10
            }).select().single();

            if (error) showToast('Error: ' + error.message, 'error');
            else { showToast('Zona creada', 'success'); loadZones(); }
        }

        function showToast(msg, type) {
            const t = document.createElement('div');
            t.className = 'toast ' + type;
            t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }
    </script>
</body>
</html>
