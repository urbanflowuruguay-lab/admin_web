<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Monitoreo - UrbanFlow</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href='https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css' rel='stylesheet' />
    <script src='https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js'></script>
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background: #0d1117; color: white; overflow: hidden; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
        .controls {
            position: absolute; top: 15px; left: 15px; z-index: 10;
            background: rgba(22, 27, 34, 0.9); padding: 12px; border-radius: 10px;
            border: 1px solid #30363d; display: flex; flex-direction: column; gap: 8px;
        }
        .btn-group { display: flex; gap: 5px; }
        .btn {
            padding: 8px 12px; border: none; border-radius: 6px; cursor: pointer;
            font-weight: bold; font-size: 11px; background: #21262d; color: #c9d1d9;
            border: 1px solid #30363d; text-transform: uppercase;
        }
        .btn.active { background: #1f6feb; color: white; border-color: #58a6ff; }
        .marker-label {
            background: rgba(0,0,0,0.8); color: white; padding: 2px 6px;
            border-radius: 4px; font-size: 10px; white-space: nowrap;
            font-weight: bold; border: 1px solid #58a6ff; pointer-events: none;
        }
        .car-marker {
            background-size: contain; background-position: center; background-repeat: no-repeat;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
        }
    </style>
</head>
<body>
<div class="controls">
    <div style="font-weight: bold; font-size: 12px; color: #58a6ff;">MONITOR EN VIVO</div>
    <div class="btn-group">
        <button id="btnAll" class="btn active" onclick="setFilter('all')">TODOS</button>
        <button id="btnAutos" class="btn" onclick="setFilter('auto')">AUTOS</button>
        <button id="btnTaxis" class="btn" onclick="setFilter('taxi')">TAXIS</button>
    </div>
    <div id="counter" style="font-size: 14px; font-weight: bold; color: #58a6ff;">Autos: 0</div>
    <div id="st" style="font-size: 9px; color: #8b949e;">Conectando...</div>
</div>
<div id="map"></div>
<script>
const SUPABASE_URL = "https://eyfgkopaamnkprzpwocz.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5Zmdrb3BhYW1ua3ByenB3b2N6Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3ODYxOTQ4MywiZXhwIjoyMDk0MTk1NDgzfQ.GIEEonN5-YGK1hBLloSun9WX-almQfnQW-0LdGOHmCk";

let currentFilter = 'all';
const markers = {};
const lastBroadcast = {};
const presenceIds = new Set();
let firstFound = false;
let ch = null;
let sb = null;

const map = new maplibregl.Map({
    container: 'map',
    style: 'https://tiles.openfreemap.org/styles/dark',
    center: [-56.1645, -34.9011], zoom: 13
});

function updateCounter() {
    let count = 0;
    Object.keys(markers).forEach(id => {
        if(currentFilter === 'all' || markers[id].t === currentFilter) count++;
    });
    const total = Object.keys(markers).length;
    document.getElementById('counter').innerText = 'Autos: ' + count + (currentFilter !== 'all' ? ' / ' + total : '');
}

function setFilter(f) {
    currentFilter = f;
    document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
    document.getElementById(f==='all'?'btnAll':f==='auto'?'btnAutos':'btnTaxis').classList.add('active');
    Object.keys(markers).forEach(id => {
        markers[id].el.style.display = (currentFilter==='all'||markers[id].t===currentFilter) ? 'flex' : 'none';
    });
    updateCounter();
}

function ss() {
    const z = map.getZoom();
    return z>=16?42:z>=14?30:z>=12?20:z>=10?14:10;
}

function removeMarker(id) {
    if(markers[id]) {
        markers[id].mk.remove();
        delete markers[id];
        delete lastBroadcast[id];
        updateCounter();
    }
}

function upsert(d) {
    if(!d||!d.lat||!d.lng||!d.id) return;
    const id = String(d.id);
    const now = Date.now();
    if(lastBroadcast[id] && (now - lastBroadcast[id] < 300)) return;
    lastBroadcast[id] = now;

    if(markers[id]) {
        markers[id].mk.setLngLat([parseFloat(d.lng), parseFloat(d.lat)]);
        const car = markers[id].el.querySelector('.car-marker');
        if(car) car.style.opacity = d.status==='ocupado'?'0.35':'1';
        markers[id].el.style.opacity = '1';
        markers[id].t = d.tipo || 'auto';
    } else {
        const s=ss(), l=Math.max(8,Math.round(s*0.28));
        const c=document.createElement('div');
        c.style.cssText='display:flex;flex-direction:column;align-items:center;';
        const lb=document.createElement('div');
        lb.className='marker-label'; lb.innerText=d.nombre||'Chofer';
        lb.style.fontSize=l+'px'; lb.style.marginTop=-(s+8)+'px';
        c.appendChild(lb);
        const car=document.createElement('div');
        car.className='car-marker';
        car.style.width=s+'px'; car.style.height=s+'px';
        car.style.backgroundImage='url('+(d.tipo==='taxi'?'/taxi.png':'/autorojo.png')+')';
        car.style.opacity=d.status==='ocupado'?'0.35':'1';
        c.appendChild(car);
        const mk=new maplibregl.Marker({element:c,pitchAlignment:'viewport',rotationAlignment:'viewport'})
            .setLngLat([parseFloat(d.lng),parseFloat(d.lat)]).addTo(map);
        markers[id]={mk,el:c,t:d.tipo||'auto'};
        updateCounter();
        if(!firstFound){firstFound=true;map.flyTo({center:[parseFloat(d.lng),parseFloat(d.lat)],zoom:15});}
    }
    setFilter(currentFilter);
}

function setup() {
    sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    ch = sb.channel('monitoreo_choferes');
    ch.on('presence', {event:'sync'}, () => {
        const st = ch.presenceState();
        presenceIds.clear();
        Object.values(st).forEach(arr => arr.forEach(p => {
            const id = String(p.id||p.user_id);
            if(id && !id.startsWith('admin')) {
                presenceIds.add(id);
            }
        }));
        console.log('[Monitoreo] Presence sync:', Array.from(presenceIds));
    })
    .on('presence', {event:'leave'}, ({key, leftPresences}) => {
        if(leftPresences) {
            leftPresences.forEach(p => {
                const id = String(p.id||p.user_id);
                if(id) {
                    presenceIds.delete(id);
                    removeMarker(id);
                }
            });
        }
    })
    .on('broadcast', {event:'location'}, ({payload}) => {
        console.log('[Monitoreo] Location received:', payload?.id, payload?.lat, payload?.lng);
        upsert(payload);
    })
    .on('broadcast', {event:'connection'}, ({payload}) => {
        console.log('[Monitoreo] Connection event:', payload);
        // Solo remover si el chofer se DESCONECTA (online === false)
        // Si se CONECTA (online === true), no hacer nada — el marker se crea con location
        if(payload && payload.online === false && payload.id) {
            removeMarker(String(payload.id));
            presenceIds.delete(String(payload.id));
        }
    })
    .on('broadcast', {event:'disconnect'}, ({payload}) => {
        if(payload && payload.id) {
            removeMarker(String(payload.id));
            presenceIds.delete(String(payload.id));
        }
    })
    .subscribe((s) => {
        const el = document.getElementById('st');
        el.innerText = s==='SUBSCRIBED'?'EN VIVO':'Reconectando...';
        el.style.color = s==='SUBSCRIBED'?'#3fb950':'#f85149';
        if(s==='CHANNEL_ERROR'||s==='TIMED_OUT') {
            setTimeout(() => { try{ch.unsubscribe();sb.removeChannel(ch);}catch(_){} setup(); }, 3000);
        }
    });
}

setup();

setInterval(() => {
    if(!ch) return;
    try {
        const now = Date.now();
        Object.keys(markers).forEach(id => {
            // No remover si nunca tuvo broadcast (marker nuevo)
            if(!lastBroadcast[id]) return;
            // Solo remover si hace más de 10 segundos que no hay broadcast
            if(now - lastBroadcast[id] > 10000) {
                console.log('[Monitoreo] Removing stale marker:', id, 'last seen', now - lastBroadcast[id], 'ms ago');
                removeMarker(id);
            }
        });
    } catch(_){}
}, 3000);

document.addEventListener('visibilitychange', () => {
    if(!document.hidden && ch) {
        console.log('[Monitoreo] Tab visible again, resubscribing...');
        // NO limpiar markers al resuscribir — solo reconectar el canal
        try { ch.unsubscribe(); sb.removeChannel(ch); } catch(_){}
        setup();
    }
});
</script>
</body>
</html>
