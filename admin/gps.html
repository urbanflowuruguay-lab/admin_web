<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPS - Iconos y Notificaciones - UrbanFlow</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0d1117;color:#e6edf3;min-height:100vh}
.top{position:sticky;top:0;z-index:50;background:#161b22;border-bottom:1px solid #30363d;padding:14px 20px}
.top h1{font-size:19px;font-weight:700;display:flex;align-items:center;gap:9px}
.top h1 span{font-size:20px}
.sub{color:#8b949e;font-size:12.5px;margin-top:4px}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
.st{background:#0d1117;border:1px solid #30363d;border-radius:7px;padding:6px 11px;font-size:12px}
.st b{font-size:15px;display:block;margin-top:1px}
.st.ok b{color:#3fb950}.st.bad b{color:#f85149}.st.pend b{color:#d29922}.st.on b{color:#58a6ff}
.bars{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px;align-items:center}
.filt{background:#21262d;border:1px solid #30363d;color:#c9d1d9;border-radius:20px;padding:5px 13px;font-size:12.5px;cursor:pointer}
.filt.on{background:#1f6feb;border-color:#1f6feb;color:#fff}
.btn{background:#238636;border:1px solid #2ea043;color:#fff;border-radius:6px;padding:7px 14px;font-size:12.5px;cursor:pointer;font-weight:600}
.btn:hover{background:#2ea043}
.btn.g{background:#21262d;border-color:#30363d;color:#c9d1d9;font-weight:500}
.btn.g:hover{background:#30363d}
.btn.sm{padding:5px 10px;font-size:11.5px;border-radius:5px}
.wrap{max-width:1080px;margin:0 auto;padding:16px 16px 70px}
.grp{margin:22px 0 9px;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:#8b949e;font-weight:700;border-bottom:1px solid #21262d;padding-bottom:6px}
.card{background:#161b22;border:1px solid #30363d;border-radius:10px;margin-bottom:11px;overflow:hidden}
.card.off{opacity:.5}
.hd{display:flex;gap:13px;padding:13px 14px;align-items:flex-start;cursor:pointer}
.thumb{width:62px;height:62px;flex:0 0 62px;background:#0d1117;border:1px solid #30363d;border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.thumb img{max-width:54px;max-height:54px;object-fit:contain}
.thumb.empty{font-size:9px;color:#484f58;text-align:center;padding:3px;line-height:1.15}
.info{flex:1;min-width:0}
.nm{font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.tg{font-family:ui-monospace,Menlo,monospace;font-size:11px;background:#21262d;border:1px solid #30363d;color:#8b949e;border-radius:4px;padding:1px 6px}
.nm .dot{width:9px;height:9px;border-radius:50%;flex:0 0 9px}
.dot.g{background:#3fb950}.dot.r{background:#f85149}.dot.y{background:#d29922}.dot.n{background:#484f58}
.meta{color:#8b949e;font-size:12px;margin-top:5px;line-height:1.55}
.meta code{background:#21262d;border-radius:4px;padding:1px 5px;font-size:11.5px;color:#79c0ff}
.ctrls{display:flex;gap:9px;align-items:center;flex-shrink:0}
.sw{position:relative;display:inline-block;width:44px;height:24px;flex:0 0 44px}
.sw input{opacity:0;width:0;height:0}
.sl{position:absolute;inset:0;background:#30363d;border-radius:24px;transition:.18s;cursor:pointer}
.sl:before{content:"";position:absolute;height:18px;width:18px;left:3px;bottom:3px;background:#8b949e;border-radius:50%;transition:.18s}
.sw input:checked+.sl{background:#238636}
.sw input:checked+.sl:before{transform:translateX(20px);background:#fff}
.body{display:none;border-top:1px solid #30363d;padding:14px;background:#0d1117}
.card.open .body{display:block}
.row{margin-bottom:13px}
.row:last-child{margin-bottom:0}
.lb{font-size:11.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#8b949e;margin-bottom:6px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.lb .hint{text-transform:none;letter-spacing:0;font-weight:400;color:#6e7681;font-size:11px}
textarea,input[type=number],input[type=text]{width:100%;background:#161b22;border:1px solid #30363d;border-radius:6px;color:#e6edf3;padding:8px 10px;font-size:13px;font-family:inherit;resize:vertical}
textarea:focus,input:focus{outline:none;border-color:#1f6feb}
textarea.ph{min-height:52px;line-height:1.45}
.src{list-style:none}
.src li{background:#161b22;border:1px solid #30363d;border-radius:6px;padding:7px 10px;margin-bottom:6px;font-size:12.5px;line-height:1.5;display:flex;gap:8px;align-items:flex-start}
.src li b{color:#79c0ff;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;flex-shrink:0}
.src li .d{color:#8b949e;font-size:11.5px}
.sizes{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.sizes input{width:90px;font-family:ui-monospace,Menlo,monospace}
.szp{font-size:12px;color:#8b949e}
.verify{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.vstate{display:flex;gap:5px;background:#161b22;border:1px solid #30363d;border-radius:6px;padding:3px}
.vs{border:none;background:transparent;color:#8b949e;font-size:11.5px;padding:5px 11px;border-radius:4px;cursor:pointer;font-weight:600}
.vs.on.p{background:#d29922;color:#0d1117}
.vs.on.k{background:#238636;color:#fff}
.vs.on.f{background:#da3633;color:#fff}
.vbtn{background:#1f6feb;border:1px solid #1f6feb;color:#fff;border-radius:6px;padding:8px 15px;font-size:12.5px;font-weight:600;cursor:pointer}
.vbtn.on{background:#8957e5;border-color:#8957e5}
.vbtn:hover{opacity:.88}
.vnote{display:none;margin-top:11px;border-top:1px dashed #30363d;padding-top:12px}
.vnote.open{display:block}
.saved{margin-top:7px;font-size:11.5px;color:#3fb950;display:none}
.saved.on{display:block}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(90px);background:#238636;color:#fff;padding:11px 20px;border-radius:8px;font-size:13px;font-weight:600;z-index:99;transition:.25s;box-shadow:0 6px 22px rgba(0,0,0,.5)}
.toast.on{transform:translateX(-50%) translateY(0)}
.toast.err{background:#da3633}
@media(max-width:640px){.hd{flex-wrap:wrap}.ctrls{width:100%;justify-content:flex-end}}

/* ---- pestañas ---- */
.tabs{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap}
.tab{background:#21262d;border:1px solid #30363d;color:#c9d1d9;border-radius:7px 7px 0 0;padding:8px 16px;font-size:13.5px;cursor:pointer;font-weight:600;border-bottom:none}
.tab.on{background:#0d1117;color:#fff;border-color:#30363d;box-shadow:inset 0 -2px 0 #1f6feb}
.tab .cnt{background:#1f6feb;color:#fff;border-radius:10px;padding:1px 7px;font-size:11px;margin-left:6px}
.tab.on .cnt{background:#238636}
.panel{display:none}
.panel.on{display:block}
</style>
</head>
<body>

<div class="top">
  <h1><span>&#128663;</span> GPS &mdash; Control de Iconos y Notificaciones</h1>
  <div class="sub">Modo d&iacute;a. Cada icono/notificaci&oacute;n con su interruptor, su texto, su fuente de datos y su prueba. Los cambios se guardan en este navegador.</div>
  <div class="stats">
    <div class="st">Total<b id="sTot">0</b></div>
    <div class="st on">Activos<b id="sOn">0</b></div>
    <div class="st ok">OK<b id="sOk">0</b></div>
    <div class="st bad">No funciona<b id="sBad">0</b></div>
    <div class="st pend">Pendientes<b id="sPend">0</b></div>
  </div>
</div>
<div class="wrap">
<!-- ================= ICONOS ================= -->
<div class="panel on" id="panelIconos">
  <div class="bars" style="margin-top:4px">
    <button class="filt on" data-f="*">Todos</button>
    <button class="filt" data-f="evento">Eventos viales</button>
    <button class="filt" data-f="esquina">Esquinas</button>
    <button class="filt" data-f="usuario">Usuario / destino</button>
    <button class="filt" data-f="bus">Buses</button>
    <span style="flex:1"></span>
    <button class="btn g" onclick="report()">Copiar reporte</button>
    <button class="btn g" onclick="resetAll()">Resetear todo</button>
  </div>
  <div id="list"></div>
</div>
</div>
<div class="toast" id="toast"></div>

/* ---------------- estado ---------------- */
const KEY='gpsv1';
let S={};   // {id:{on,size,phrase,vs,note}}
try{S=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){S={}}

function g(it){ if(!S[it.id]) S[it.id]={on:it.prefOn,size:it.defSize,phrase:it.phrase,vs:'p',note:''}; return S[it.id]; }
function sv(){ localStorage.setItem(KEY,JSON.stringify(S)); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]}); }
function toast(m,e){var t=document.getElementById('toast');t.textContent=m;t.className='toast on'+(e?' err':'');clearTimeout(window._tt);window._tt=setTimeout(function(){t.className='toast'+(e?' err':'')},2300);}

let FILT='*';

function render(){
  const groups=[
    ['evento','Eventos viales'],
    ['esquina','Esquinas (pare / ceda / sem&aacute;foro)'],
    ['usuario','Usuario y navegaci&oacute;n'],
    ['bus','Buses y transporte p&uacute;blico']
  ];
  let h='';
  groups.forEach(function(gr){
    const its=ITEMS.filter(function(i){return i.g===gr[0]});
    if(!its.length) return;
    if(FILT!=='*' && FILT!==gr[0]) return;
    h+='<div class="grp">'+gr[1]+' <span style="color:#484f58">('+its.length+')</span></div>';
    its.forEach(function(it){
      const s=g(it);
      const vsCls = s.vs==='k'?'g':(s.vs==='f'?'r':'y');
      const vsTxt = s.vs==='k'?'Funciona':(s.vs==='f'?'No funciona':'Pendiente');
      h+='<div class="card'+(s.on?'':' off')+'" data-id="'+it.id+'" data-g="'+it.g+'">'
       +'<div class="hd" onclick="toggleCard(this)">'
         +'<div class="thumb'+(it.img?'':' empty')+'">'+(it.img?'<img src="'+it.img+'" alt="'+esc(it.n)+'" onerror="this.parentNode.classList.add(\'empty\');this.parentNode.innerHTML=\'sin imagen\';">':'sin PNG<br>en el mapa')+'</div>'
         +'<div class="info">'
           +'<div class="nm"><span class="dot '+vsCls+'" title="'+vsTxt+'"></span>'+it.n+' <span class="tg">'+esc(it.tag)+'</span></div>'
           +'<div class="meta">'+it.meta+'</div>'
         +'</div>'
         +'<div class="ctrls" onclick="event.stopPropagation()">'
           +'<label class="sw"><input type="checkbox" '+(s.on?'checked':'')+' onchange="setOn(\''+it.id+'\',this.checked)"><span class="sl"></span></label>'
         +'</div>'
       +'</div>'
       +'<div class="body">'
         +'<div class="row"><div class="lb">Fuente de datos <span class="hint">de d&oacute;nde sale la info que se dibuja o se pronuncia</span></div><ul class="src">'
           + it.sources.map(function(x){return '<li><b>'+esc(x.t)+'</b><span class="d">'+x.d+'</span></li>'}).join('')
         +'</ul></div>'
         +'<div class="row"><div class="lb">Qu&eacute; debe decir <span class="hint">frase hablada / cartel (alertPhrase en events_service.dart)</span></div>'
           +'<textarea class="ph" onchange="setPh(\''+it.id+'\',this.value)">'+esc(s.phrase)+'</textarea></div>'
         +'<div class="row"><div class="lb">Tama&ntilde;o del icono <span class="hint">valor de iconSize en el mapa; 1.0 = normal, 0.35 = chico, 0.70 = grande</span></div>'
           +'<div class="sizes"><input type="number" step="0.01" min="0.05" max="3" value="'+s.size+'" onchange="setSize(\''+it.id+'\',this.value)">'
           +'<span class="szp">por defecto: <code>'+it.defSize+'</code></span>'
           +'<button class="btn g sm" onclick="setSize(\''+it.id+'\',\''+it.defSize+'\');render()">Restaurar</button></div></div>'
         +'<div class="row"><div class="lb">Verificaci&oacute;n en la calle</div>'
           +'<div class="verify">'
             +'<div class="vstate">'
               +'<button class="vs p'+(s.vs==='p'?' on':'')+'" onclick="setVs(\''+it.id+'\',\'p\')">Pendiente</button>'
               +'<button class="vs k'+(s.vs==='k'?' on':'')+'" onclick="setVs(\''+it.id+'\',\'k\')">Funciona</button>'
               +'<button class="vs f'+(s.vs==='f'?' on':'')+'" onclick="setVs(\''+it.id+'\',\'f\')">No funciona</button>'
             +'</div>'
             +'<button class="vbtn'+(s.note?' on':'')+'" onclick="toggleNote(this)">Anotar</button>'
           +'</div>'
           +'<div class="vnote'+(s.note?' open':'')+'">'
             +'<div class="lb">Anotaci&oacute;n libre <span class="hint">qu&eacute} pas&oacute;, d&oacute;nde estaba, por qu&eacute; funciona o no</span></div>'
             +'<textarea placeholder="Ej.: fui a la feria de Domingo y no aparec&iacute;a ninguna marcada. Pare, avenida Artigas y camino al aeropuerto." onchange="setNote(\''+it.id+'\',this.value)">'+esc(s.note)+'</textarea>'
           +'</div>'
           +'<div class="saved'+(s.note||s.vs!=='p'?' on':'')+'">&#10003; Guardado en este navegador</div>'
         +'</div>'
       +'</div>'
      +'</div>';
    });
  });
  document.getElementById('list').innerHTML=h;
  updStats();
}

function updStats(){
  const it=ITEMS;
  document.getElementById('sTot').textContent=it.length;
  let on=0,ok=0,bad=0,pend=0;
  it.forEach(function(i){const s=g(i); if(s.on)on++; if(s.vs==='k')ok++; else if(s.vs==='f')bad++; else pend++;});
  document.getElementById('sOn').textContent=on;
  document.getElementById('sOk').textContent=ok;
  document.getElementById('sBad').textContent=bad;
  document.getElementById('sPend').textContent=pend;
}

function find(id){return ITEMS.filter(function(i){return i.id===id})[0]}
function setOn(id,v){find(id)&&g(find(id));const it=find(id);g(it).on=v;sv();render()}
function setPh(id,v){const it=find(id);if(it)g(it).phrase=v;sv()}
function setSize(id,v){const it=find(id);if(!it)return;let n=parseFloat(v);if(isNaN(n)||n<=0)n=it.defSize;g(it).size=n;sv()}
function setVs(id,v){const it=find(id);if(it)g(it).vs=v;sv();render()}
function setNote(id,v){const it=find(id);if(it)g(it).note=v;sv();render()}
function toggleCard(hd){hd.parentNode.classList.toggle('open')}
function toggleNote(b){b.parentNode.querySelector('.vnote').classList.toggle('open')}

document.querySelectorAll('.filt').forEach(function(b){
  b.onclick=function(){
    document.querySelectorAll('.filt').forEach(function(x){x.classList.remove('on')});
    b.classList.add('on'); FILT=b.dataset.f; render();
  };
});

function report(){
  let out='REPORTE GPS - ICONOS Y NOTIFICACIONES ('+new Date().toLocaleString()+')\n';
  out+='='.repeat(64)+'\n\n';
  ITEMS.forEach(function(it){
    const s=g(it);
    out+='['+(s.vs==='k'?'OK':(s.vs==='f'?'NO FUNCIONA':'PENDIENTE'))+'] '+it.n+'  ('+it.tag+')\n';
    out+='   activo: '+(s.on?'SI':'NO')+'   iconSize: '+s.size+' (def '+it.defSize+')\n';
    out+='   dice: '+s.phrase+'\n';
    out+='   fuentes: '+it.sources.map(function(x){return x.t}).join(' | ')+'\n';
    if(s.note) out+='   ANOTACION: '+s.note.replace(/\n/g,'\n             ')+'\n';
    out+='\n';
  });
  const t=document.createElement('textarea');t.value=out;document.body.appendChild(t);t.select();
  try{document.execCommand('copy');toast('Reporte copiado. Pegalo donde quieras.');}catch(e){toast('No se pudo copiar',true);}
  document.body.removeChild(t);
}

function resetAll(){
  if(!confirm('\u00bfBorrar todos los estados, textos, tama\u00f1os y anotaciones de este navegador?'))return;
  S={};sv();render();toast('Reset completo');
}
render();
</script>
