<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Seguimiento Chofer - UrbanFlow</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/auth-check.js"></script>
    <link href='https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css' rel='stylesheet' />
    <script src='https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js'></script>
<script src="/auth-check.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background: #0d1117; color: #c9d1d9; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        
        .header { background: #161b22; border-bottom: 1px solid #30363d; padding: 8px 16px; display: flex; align-items: center; gap: 16px; flex-shrink: 0; z-index: 20; }
        .header h1 { margin: 0; font-size: 14px; color: #58a6ff; }
        .header .status { font-size: 11px; padding: 4px 10px; border-radius: 12px; background: #21262d; }
        .header .status.connected { background: #1a3a2a; color: #3fb950; }
        .header .status.disconnected { background: #3a1a1a; color: #f85149; }
        
        .main { display: flex; flex: 1; overflow: hidden; }
        
        #map { flex: 1; }
        
        .sidebar { width: 380px; background: #161b22; border-left: 1px solid #30363d; display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0; }
        
        .sidebar-section { padding: 10px 12px; border-bottom: 1px solid #21262d; flex-shrink: 0; }
        .sidebar-section h3 { margin: 0 0 6px 0; font-size: 11px; color: #8b949e; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
        .stat { background: #0d1117; padding: 6px 8px; border-radius: 6px; border: 1px solid #21262d; }
        .stat-label { font-size: 9px; color: #8b949e; }
        .stat-value { font-size: 16px; font-weight: bold; font-family: monospace; }
        .stat-value.green { color: #3fb950; }
        .stat-value.red { color: #f85149; }
        .stat-value.yellow { color: #d29922; }
        .stat-value.blue { color: #58a6ff; }
        
        .log-container { flex: 1; overflow-y: auto; padding: 0; }
        .log-entry { padding: 6px 12px; border-bottom: 1px solid #21262d; font-size: 11px; font-family: 'Cascadia Code', 'Fira Code', monospace; line-height: 1.4; }
        .log-entry:hover { background: #1c2128; }
        .log-entry .time { color: #484f58; }
        .log-entry.event-detected { border-left: 3px solid #58a6ff; }
        .log-entry.event-notified { border-left: 3px solid #3fb950; background: #0d2818; }
        .log-entry.event-filtered { border-left: 3px solid #f85149; }
        .log-entry.event-surprise { border-left: 3px solid #d29922; }
        .log-entry.gps { border-left: 3px solid #484f58; color: #8b949e; }
        .log-entry .type-badge { padding: 1px 5px; border-radius: 3px; font-size: 9px; font-weight: bold; margin-right: 4px; }
        .type-badge.radar { background: #f85149; color: white; }
        .type-badge.pare { background: #d29922; color: white; }
        .type-badge.lomada { background: #a371f7; color: white; }
        .type-badge.peaje { background: #58a6ff; color: white; }
        .type-badge.carril_bus { background: #3fb950; color: white; }
        .type-badge.ceda { background: #d29922; color: white; }
        
        .filter-btns { display: flex; gap: 4px; flex-wrap: wrap; }
        .filter-btn { padding: 3px 8px; border-radius: 4px; border: 1px solid #30363d; background: #21262d; color: #8b949e; font-size: 10px; cursor: pointer; }
        .filter-btn.active { background: #1f6feb; color: white; border-color: #58a6ff; }
        .filter-btn:hover { background: #30363d; }
        
        .controls-bar { padding: 8px 12px; border-top: 1px solid #30363d; display: flex; gap: 6px; flex-shrink: 0; background: #161b22; }
        .controls-bar button { flex: 1; padding: 8px; border: 1px solid #30363d; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 11px; }
        .btn-start { background: #1a3a2a; color: #3fb950; border-color: #238636; }
        .btn-start:hover { background: #238636; color: white; }
        .btn-stop { background: #3a1a1a; color: #f85149; border-color: #da3633; }
        .btn-stop:hover { background: #da3633; color: white; }
        .btn-export { background: #21262d; color: #c9d1d9; }
        .btn-export:hover { background: #30363d; }
        .btn-clear { background: #21262d; color: #8b949e; }
        .btn-clear:hover { background: #30363d; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0d1117; }
        ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }
    </style>
</head>
<body>

<div class="header">
    <h1>SEGUIMIENTO CHOFER</h1>
    <div id="connStatus" class="status disconnected">DESCONECTADO</div>
    <div style="flex:1"></div>
    <div id="profileInfo" style="font-size: 11px; color: #8b949e;">Esperando chofer...</div>
</div>

<div class="main">
    <div id="map"></div>
    
    <div class="sidebar">
        <div class="sidebar-section">
            <h3>Estado en Vivo</h3>
            <div class="stats-grid">
                <div class="stat"><div class="stat-label">Velocidad</div><div id="statSpeed" class="stat-value blue">--</div></div>
                <div class="stat"><div class="stat-label">Bearing</div><div id="statBearing" class="stat-value">--</div></div>
                <div class="stat"><div class="stat-label">Eventos cercanos</div><div id="statNearby" class="stat-value yellow">--</div></div>
                <div class="stat"><div class="stat-label">Notificados</div><div id="statNotified" class="stat-value green">0</div></div>
                <div class="stat"><div class="stat-label">Filtrados (cono)</div><div id="statCone" class="stat-value red">0</div></div>
                <div class="stat"><div class="stat-label">Filtrados (surprise)</div><div id="statSurprise" class="stat-value yellow">0</div></div>
                <div class="stat"><div class="stat-label">Filtrados (radio)</div><div id="statRadius" class="stat-value">0</div></div>
                <div class="stat"><div class="stat-label">Filtrados (calle)</div><div id="statStreet" class="stat-value">0</div></div>
            </div>
        </div>
        
        <div class="sidebar-section">
            <h3>Filtrar log</h3>
            <div class="filter-btns">
                <button class="filter-btn active" onclick="setLogFilter('all')">TODOS</button>
                <button class="filter-btn" onclick="setLogFilter('gps')">GPS</button>
                <button class="filter-btn" onclick="setLogFilter('notified')">NOTIFICADOS</button>
                <button class="filter-btn" onclick="setLogFilter('filtered')">FILTRADOS</button>
                <button class="filter-btn" onclick="setLogFilter('surprise')">SURPRISE</button>
            </div>
        </div>
        
        <div id="logContainer" class="log-container"></div>
        
        <div class="controls-bar">
            <button class="btn-start" onclick="startRecording()">INICIAR</button>
            <button class="btn-stop" onclick="stopRecording()">DETENER</button>
            <button class="btn-export" onclick="exportLog()">EXPORTAR</button>
            <button class="btn-clear" onclick="clearLog()">LIMPIAR</button>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = "https://eyfgkopaamnkprzpwocz.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5Zmdrb3BhYW1ua3ByenB3b2N6Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3ODYxOTQ4MywiZXhwIjoyMDk0MTk1NDgzfQ.GIEEonN5-YGK1hBLloSun9WX-almQfnQW-0LdGOHmCk";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let isRecording = false;
    let logEntries = [];
    let logFilter = 'all';
    let routeCoords = [];
    let notifiedCount = 0;
    let coneFilteredCount = 0;
    let surpriseFilteredCount = 0;
    let radiusFilteredCount = 0;
    let streetFilteredCount = 0;

    const map = new maplibregl.Map({
        container: 'map',
        style: 'https://tiles.openfreemap.org/styles/dark',
        center: [-56.1645, -34.9011],
        zoom: 16
    });

    let routeSource = 'route-line';
    let carMarker = null;
    const eventMarkers = {};

    map.on('load', () => {
        map.addSource(routeSource, {
            type: 'geojson',
            data: { type: 'FeatureCollection', features: [] }
        });
        map.addLayer({
            id: 'route-line',
            type: 'line',
            source: routeSource,
            paint: {
                'line-color': '#58a6ff',
                'line-width': 3,
                'line-opacity': 0.8
            }
        });
        map.addSource('events-source', {
            type: 'geojson',
            data: { type: 'FeatureCollection', features: [] }
        });
        map.addLayer({
            id: 'events-layer',
            type: 'circle',
            source: 'events-source',
            paint: {
                'circle-radius': 8,
                'circle-color': [
                    'match', ['get', 'type'],
                    'radar', '#f85149',
                    'pare', '#d29922',
                    'ceda', '#d29922',
                    'cedaelpaso', '#d29922',
                    'lomada', '#a371f7',
                    'peaje', '#58a6ff',
                    'carril_bus', '#3fb950',
                    '#484f58'
                ],
                'circle-stroke-width': 2,
                'circle-stroke-color': '#ffffff33'
            }
        });
    });

    function setLogFilter(filter) {
        logFilter = filter;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
        renderLog();
    }

    function addLogEntry(entry) {
        logEntries.push(entry);
        if (logEntries.length > 2000) logEntries = logEntries.slice(-1500);
        if (shouldShowEntry(entry)) {
            renderSingleEntry(entry);
        }
        const container = document.getElementById('logContainer');
        container.scrollTop = container.scrollHeight;
    }

    function shouldShowEntry(entry) {
        if (logFilter === 'all') return true;
        if (logFilter === 'gps') return entry.kind === 'gps';
        if (logFilter === 'notified') return entry.kind === 'notified';
        if (logFilter === 'filtered') return entry.kind === 'filtered';
        if (logFilter === 'surprise') return entry.kind === 'surprise';
        return true;
    }

    function renderSingleEntry(entry) {
        const container = document.getElementById('logContainer');
        const div = document.createElement('div');
        div.className = 'log-entry ' + (entry.kind || '');
        const time = new Date(entry.ts).toLocaleTimeString('es-UY', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
        let html = `<span class="time">${time}</span> `;
        if (entry.type) html += `<span class="type-badge ${entry.type}">${entry.type}</span>`;
        html += entry.msg;
        div.innerHTML = html;
        container.appendChild(div);
        if (container.children.length > 500) container.removeChild(container.firstChild);
    }

    function renderLog() {
        const container = document.getElementById('logContainer');
        container.innerHTML = '';
        logEntries.filter(e => shouldShowEntry(e)).forEach(e => renderSingleEntry(e));
    }

    function updateRoute(lat, lng) {
        routeCoords.push([lng, lat]);
        if (map.getSource(routeSource)) {
            map.getSource(routeSource).setData({
                type: 'FeatureCollection',
                features: [{
                    type: 'Feature',
                    geometry: { type: 'LineString', coordinates: routeCoords }
                }]
            });
        }
    }

    function updateCarMarker(lat, lng, bearing) {
        if (!carMarker) {
            const el = document.createElement('div');
            el.style.cssText = 'width:24px;height:24px;background:#f85149;border:3px solid white;border-radius:50%;box-shadow:0 2px 8px rgba(0,0,0,0.5);';
            carMarker = new maplibregl.Marker({ element: el })
                .setLngLat([lng, lat])
                .addTo(map);
        } else {
            carMarker.setLngLat([lng, lat]);
        }
        map.easeTo({ center: [lng, lat], zoom: 17, duration: 500 });
    }

    function updateEventsSource(events) {
        if (!map.getSource('events-source')) return;
        const features = events.map(e => ({
            type: 'Feature',
            geometry: { type: 'Point', coordinates: [e.lon, e.lat] },
            properties: { type: e.type }
        }));
        map.getSource('events-source').setData({
            type: 'FeatureCollection',
            features
        });
    }

    let channel = null;

    function startRecording() {
        if (isRecording) return;
        isRecording = true;
        document.getElementById('connStatus').textContent = 'CONECTANDO...';
        document.getElementById('connStatus').className = 'status';

        channel = supabaseClient.channel('monitoreo_choferes', {
            config: { presence: { key: 'tracker-' + Date.now() } }
        });

        channel
            .on('broadcast', { event: 'tracking' }, ({ payload }) => {
                processTrackingData(payload);
            })
            .on('broadcast', { event: 'location' }, ({ payload }) => {
                if (!payload || !payload.id) return;
                processTrackingData({ ...payload, ts: Date.now() });
            })
            .subscribe(async (status) => {
                console.log('Channel status:', status);
                document.getElementById('connStatus').textContent = 'ESTADO: ' + status;
                if (status === 'SUBSCRIBED') {
                    document.getElementById('connStatus').textContent = 'CONECTADO - ESCUCHANDO';
                    document.getElementById('connStatus').className = 'status connected';
                    await channel.track({ user_id: 'tracker-' + Date.now(), online_at: new Date().toISOString() });
                } else if (status === 'TIMED_OUT' || status === 'CHANNEL_ERROR') {
                    document.getElementById('connStatus').textContent = 'ERROR: ' + status;
                    document.getElementById('connStatus').className = 'status disconnected';
                }
            });
    }

    function stopRecording() {
        isRecording = false;
        if (channel) {
            supabaseClient.removeChannel(channel);
            channel = null;
        }
        document.getElementById('connStatus').textContent = 'DETENIDO';
        document.getElementById('connStatus').className = 'status disconnected';
    }

    function processTrackingData(data) {
        const ts = data.ts || Date.now();
        
        updateCarMarker(data.lat, data.lng, data.bearing);
        updateRoute(data.lat, data.lng);

        document.getElementById('statSpeed').textContent = data.speed ? (data.speed * 3.6).toFixed(0) + ' km/h' : '--';
        document.getElementById('statBearing').textContent = data.bearing ? data.bearing.toFixed(0) + '°' : '--';
        document.getElementById('statNearby').textContent = data.nearbyCount || 0;
        document.getElementById('statNotified').textContent = data.notifiedCount || 0;
        document.getElementById('statCone').textContent = data.coneFiltered || 0;
        document.getElementById('statSurprise').textContent = data.surpriseFiltered || 0;
        document.getElementById('statRadius').textContent = data.radiusFiltered || 0;
        document.getElementById('statStreet').textContent = data.streetFiltered || 0;

        notifiedCount = data.notifiedCount || notifiedCount;
        coneFilteredCount = data.coneFiltered || coneFilteredCount;
        surpriseFilteredCount = data.surpriseFiltered || surpriseFilteredCount;
        radiusFilteredCount = data.radiusFiltered || radiusFilteredCount;
        streetFilteredCount = data.streetFiltered || streetFilteredCount;

        if (data.profileName) {
            document.getElementById('profileInfo').textContent = data.profileName + ' | ' + (data.street || '?');
        }

        addLogEntry({
            kind: 'gps',
            ts: ts,
            msg: `${data.lat.toFixed(6)}, ${data.lng.toFixed(6)} | ${data.speed ? (data.speed*3.6).toFixed(0) : 0} km/h | bearing: ${data.bearing ? data.bearing.toFixed(0) : 0}° | eventos cercanos: ${data.nearbyCount || 0}`
        });

        if (data.events) {
            data.events.forEach(ev => {
                let kind = 'gps';
                let msg = '';
                if (ev.action === 'notified') {
                    kind = 'notified';
                    msg = `NOTIFICADO a ${ev.distance.toFixed(0)}m`;
                } else if (ev.action === 'filtered_cone') {
                    kind = 'filtered';
                    msg = `FILTRADO cono: ${ev.distance.toFixed(0)}m, angle=${ev.angleDiff?.toFixed(1)}° > ${ev.coneHalf}°`;
                } else if (ev.action === 'filtered_surprise') {
                    kind = 'surprise';
                    msg = `FILTRADO surprise: primera vista a ${ev.firstSeenDistance?.toFixed(0)}m < 40m`;
                } else if (ev.action === 'filtered_radius') {
                    kind = 'filtered';
                    msg = `FILTRADO radio: ${ev.distance.toFixed(0)}m > ${ev.radius}m`;
                } else if (ev.action === 'filtered_street') {
                    kind = 'filtered';
                    msg = `FILTRADO calle: "${ev.eventStreet}" != "${ev.driverStreet}"`;
                } else if (ev.action === 'detected') {
                    kind = 'notified';
                    msg = `DETECTADO a ${ev.distance.toFixed(0)}m`;
                }
                addLogEntry({ kind, ts, type: ev.type, msg });
            });
        }
    }

    function exportLog() {
        const data = {
            startTime: logEntries.length > 0 ? logEntries[0].ts : Date.now(),
            endTime: Date.now(),
            route: routeCoords,
            entries: logEntries,
            stats: { notifiedCount, coneFilteredCount, surpriseFilteredCount, radiusFilteredCount, streetFilteredCount }
        };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `seguimiento_${new Date().toISOString().slice(0,19).replace(/:/g,'-')}.json`;
        a.click();
        URL.revokeObjectURL(url);
    }

    function clearLog() {
        logEntries = [];
        routeCoords = [];
        notifiedCount = 0;
        coneFilteredCount = 0;
        surpriseFilteredCount = 0;
        radiusFilteredCount = 0;
        streetFilteredCount = 0;
        document.getElementById('logContainer').innerHTML = '';
        if (carMarker) { carMarker.remove(); carMarker = null; }
        if (map.getSource(routeSource)) {
            map.getSource(routeSource).setData({ type: 'FeatureCollection', features: [] });
        }
        if (map.getSource('events-source')) {
            map.getSource('events-source').setData({ type: 'FeatureCollection', features: [] });
        }
    }

    startRecording();
</script>
<script src="/auth-check.js"></script>

</body>
</html>
