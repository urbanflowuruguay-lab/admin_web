<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <title>Ruta del Viaje</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0d1117; color: #c9d1d9; }
        #map { width: 100vw; height: 100vh; }
        .info { position: absolute; top: 10px; left: 10px; background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 12px 16px; z-index: 10; font-size: 13px; }
        .info h2 { color: #58a6ff; font-size: 15px; margin-bottom: 6px; }
        .info p { color: #8b949e; font-size: 12px; }
    </style>
</head>
<body>
    <div class="info">
        <h2>🗺️ Ruta Real del GPS</h2>
        <p id="routeInfo">Cargando...</p>
    </div>
    <div id="map"></div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const coordsStr = params.get('coords');
        if (!coordsStr) {
            document.getElementById('routeInfo').textContent = 'No se proporcionaron coordenadas';
        } else {
            try {
                const coords = JSON.parse(decodeURIComponent(coordsStr));
                const lnglats = coords.map(c => [c[0], c[1]]);

                document.getElementById('routeInfo').textContent = `${lnglats.length} puntos GPS`;

                const map = new maplibregl.Map({
                    container: 'map',
                    style: { version: 8, sources: { 'osm': { type: 'raster', tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'], tileSize: 256 } }, layers: [{ id: 'osm', type: 'raster', source: 'osm' }] },
                    center: lnglats[Math.floor(lnglats.length / 2)],
                    zoom: 14
                });

                map.addControl(new maplibregl.NavigationControl(), 'top-right');

                map.on('load', function() {
                    map.addSource('route', {
                        type: 'geojson',
                        data: { type: 'Feature', geometry: { type: 'LineString', coordinates: lnglats } }
                    });
                    map.addLayer({
                        id: 'route-line',
                        type: 'line',
                        source: 'route',
                        paint: { 'line-color': '#00C853', 'line-width': 4, 'line-opacity': 0.9 }
                    });

                    new maplibregl.Marker({ color: '#4CAF50' }).setLngLat(lnglats[0]).addTo(map);
                    new maplibregl.Marker({ color: '#f44336' }).setLngLat(lnglats[lnglats.length - 1]).addTo(map);

                    const bounds = new maplibregl.LngLatBounds();
                    lnglats.forEach(c => bounds.extend(c));
                    map.fitBounds(bounds, { padding: 40 });
                });
            } catch(e) {
                document.getElementById('routeInfo').textContent = 'Error al parsear coordenadas: ' + e.message;
            }
        }
    </script>
</body>
</html>
