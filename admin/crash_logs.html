<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logs de Crash - UrbanFlow</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/auth-check.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #0d1117; color: #c9d1d9; margin: 0; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #30363d; padding-bottom: 15px; margin-bottom: 20px; }
        h1 { color: #f85149; font-size: 22px; margin: 0; }
        .btn-refresh { background: #21262d; color: #58a6ff; border: 1px solid #30363d; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-refresh:hover { background: #30363d; }
        .btn-danger { background: #da3633; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-danger:hover { background: #f85149; }
        .btn-new { background: #238636; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-new:hover { background: #2ea043; }
        .btn-new.active { background: #f85149; }
        .stats { display: flex; gap: 20px; }
        .stat-box { background: #161b22; padding: 10px 15px; border-radius: 8px; border: 1px solid #30363d; text-align: center; }
        .stat-box span { display: block; font-size: 18px; font-weight: bold; color: #f85149; }
        .stat-box label { font-size: 10px; text-transform: uppercase; color: #8b949e; }
        .crash-list { display: flex; flex-direction: column; gap: 12px; }
        .crash-card { background: #161b22; border: 1px solid #30363d; border-left: 4px solid #f85149; border-radius: 10px; padding: 16px; }
        .crash-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
        .crash-device { font-size: 11px; color: #8b949e; background: #0d1117; padding: 3px 8px; border-radius: 4px; }
        .crash-version { font-size: 11px; color: #58a6ff; }
        .crash-message { color: #f85149; font-weight: bold; font-size: 14px; margin-bottom: 8px; word-break: break-word; }
        .crash-time { font-size: 12px; color: #8b949e; }
        .crash-stack { background: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 10px; margin-top: 10px; font-family: 'Cascadia Code', 'Consolas', monospace; font-size: 11px; color: #8b949e; max-height: 200px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; }
        .crash-stack.expanded { max-height: none; }
        .toggle-stack { background: none; border: none; color: #58a6ff; cursor: pointer; font-size: 11px; padding: 4px 0; }
        .toggle-stack:hover { text-decoration: underline; }
        .empty-state { text-align: center; padding: 60px; background: #161b22; border-radius: 10px; border: 2px dashed #30363d; }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h1>📊 Logs de Crash</h1>
            <p style="margin: 5px 0 0 0; color: #8b949e; font-size: 13px;">Errores fatales de la app chofer</p>
        </div>
        <div style="display:flex; align-items:center; gap:10px;">
            <button class="btn-refresh" onclick="loadLogs()">🔄 Refrescar</button>
            <button class="btn-new" id="btnNewOnly" onclick="toggleNewOnly()">🟢 Ver Solo Nuevos</button>
            <button class="btn-danger" onclick="clearAll()">🗑 Borrar Todo</button>
            <div class="stats">
                <div class="stat-box"><span id="countTotal">0</span><label>Total</label></div>
                <div class="stat-box"><span id="countToday">0</span><label>Hoy</label></div>
            </div>
        </div>
    </div>
    
    <div id="logsList" class="crash-list">
        <div class="empty-state">Conectando con Supabase...</div>
    </div>

    <script>
        const SUPABASE_URL = "https://eyfgkopaamnkprzpwocz.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5Zmdrb3BhYW1ua3ByenB3b2N6Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3ODYxOTQ4MywiZXhwIjoyMDk0MTk1NDgzfQ.GIEEonN5-YGK1hBLloSun9WX-almQfnQW-0LdGOHmCk";
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let newOnlyMode = false;
        let newOnlyFrom = null;

        function toggleNewOnly() {
            newOnlyMode = !newOnlyMode;
            const btn = document.getElementById('btnNewOnly');
            if (newOnlyMode) {
                newOnlyFrom = new Date().toISOString();
                btn.textContent = '🔴 Mostrar Todos';
                btn.classList.add('active');
            } else {
                newOnlyFrom = null;
                btn.textContent = '🟢 Ver Solo Nuevos';
                btn.classList.remove('active');
            }
            loadLogs();
        }

        async function loadLogs() {
            let query = sb.from('crash_logs').select('*').order('id', { ascending: false }).limit(100);
            if (newOnlyMode && newOnlyFrom) {
                query = query.gte('created_at', newOnlyFrom);
            }
            const { data, error } = await query;
            const list = document.getElementById('logsList');
            
            if (error) {
                list.innerHTML = `<div class="empty-state" style="color:#f85149">❌ Error: ${error.message}<br><small>Asegurate de que la tabla crash_logs existe en Supabase</small></div>`;
                return;
            }
            
            if (!data || data.length === 0) {
                const msg = newOnlyMode ? '🟢 No hay crashes nuevos desde que activaste el filtro.' : '✅ No hay crashes registrados. Todo funciona bien!';
                list.innerHTML = `<div class="empty-state">${msg}</div>`;
                document.getElementById('countTotal').innerText = '0';
                document.getElementById('countToday').innerText = '0';
                return;
            }

            const today = new Date().toDateString();
            const todayCount = data.filter(log => {
                const d = new Date(log.created_at);
                return d.toDateString() === today;
            }).length;

            document.getElementById('countTotal').innerText = data.length;
            document.getElementById('countToday').innerText = todayCount;

            list.innerHTML = data.map(log => {
                const date = log.created_at ? new Date(log.created_at) : null;
                const dateStr = date ? `${date.toLocaleDateString()} ${date.toLocaleTimeString()}` : 'Sin fecha';
                const stackId = 'stack-' + log.id;
                
                return `
                <div class="crash-card">
                    <div class="crash-header">
                        <div>
                            <div class="crash-message">${escapeHtml(log.message || 'Error desconocido')}</div>
                            <div class="crash-time">🕒 ${dateStr}</div>
                        </div>
                        <div style="text-align:right;">
                            <div class="crash-device">${escapeHtml(log.device || 'Desconocido')}</div>
                            <div class="crash-version">v${escapeHtml(log.app_version || '?')}</div>
                        </div>
                    </div>
                    ${log.stack_trace ? `
                        <button class="toggle-stack" onclick="toggleStack('${stackId}', this)">▼ Ver stack trace</button>
                        <div class="crash-stack" id="${stackId}" style="display:none;">${escapeHtml(log.stack_trace)}</div>
                    ` : ''}
                </div>
            `}).join('');
        }

        function toggleStack(id, btn) {
            const el = document.getElementById(id);
            const isHidden = el.style.display === 'none';
            el.style.display = isHidden ? 'block' : 'none';
            btn.textContent = isHidden ? '▲ Ocultar stack trace' : '▼ Ver stack trace';
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        async function clearAll() {
            if (!confirm("¿Borrar TODOS los logs de crash?")) return;
            const { error } = await sb.from('crash_logs').delete().neq('id', 0);
            if (!error) {
                newOnlyMode = false;
                newOnlyFrom = null;
                const btn = document.getElementById('btnNewOnly');
                btn.textContent = '🟢 Ver Solo Nuevos';
                btn.classList.remove('active');
                loadLogs();
            } else alert("Error: " + error.message);
        }

        sb.channel('crash-changes').on('postgres_changes', { event: '*', schema: 'public', table: 'crash_logs' }, () => {
            loadLogs();
        }).subscribe();

        loadLogs();
    </script>
<script src="/auth-check.js"></script>
</body>
</html>
