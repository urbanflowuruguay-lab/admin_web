<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Configuración Global - UrbanFlow</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 25px; background-color: #0d1117; color: #c9d1d9; margin: 0; }
        h1 { color: #58a6ff; display: flex; align-items: center; gap: 15px; }
        .description { color: #8b949e; margin-bottom: 30px; font-size: 14px; }
        
        .card { background: #161b22; padding: 25px; border-radius: 12px; border: 1px solid #30363d; margin-bottom: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
        .card h3 { color: #f39c12; margin-top: 0; margin-bottom: 20px; border-bottom: 1px solid #30363d; padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        
        .grid-config { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-group label { font-size: 11px; font-weight: bold; color: #8b949e; text-transform: uppercase; }
        
        input[type="text"], input[type="number"] { 
            padding: 12px; border-radius: 8px; border: 1px solid #30363d; 
            background: #0d1117; color: white; width: 100%; box-sizing: border-box; font-size: 14px;
        }
        input:focus { border-color: #58a6ff; outline: none; box-shadow: 0 0 0 2px rgba(88,166,255,0.2); }
        
        .toggle-container { display: flex; align-items: center; gap: 10px; background: #21262d; padding: 12px; border-radius: 8px; border: 1px solid #30363d; }
        .toggle-container span { font-size: 13px; font-weight: 500; flex-grow: 1; }

        .toggle-switch { position: relative; display: inline-block; width: 46px; height: 24px; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #30363d; transition: .4s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 16px; left: 4px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #238636; }
        input:checked + .slider:before { transform: translateX(20px); }

        .btn-save { 
            background: #238636; color: white; border: none; padding: 15px; border-radius: 8px; 
            cursor: pointer; font-weight: bold; font-size: 14px; width: 100%; margin-top: 20px;
            transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-save:hover { background: #2ea043; }
        
        .depto-grid { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); 
            gap: 10px; margin-top: 15px; background: #0d1117; padding: 15px; border-radius: 8px; border: 1px solid #30363d;
        }
        .depto-item { font-size: 12px; display: flex; align-items: center; gap: 8px; color: #c9d1d9; cursor: pointer; }

        .status-badge { font-size: 10px; padding: 4px 10px; border-radius: 20px; font-weight: bold; }
        .status-on { background: #1a3a1a; color: #4ade80; }
        .status-off { background: #3a1a1a; color: #f87171; }
    </style>
</head>
<body>

    <h1>⚙️ Configuración del Sistema</h1>
    <p class="description">Modifique los parámetros y presione el botón "Guardar" para aplicar los cambios en la App.</p>
    
    <div id="paisesContainer">
        <div style="text-align: center; padding: 50px; font-size: 18px; color: #8b949e;">Cargando configuración...</div>
    </div>

    <script>
        const SUPABASE_URL = "https://eyfgkopaamnkprzpwocz.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5Zmdrb3BhYW1ua3ByenB3b2N6Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3ODYxOTQ4MywiZXhwIjoyMDk0MTk1NDgzfQ.GIEEonN5-YGK1hBLloSun9WX-almQfnQW-0LdGOHmCk";
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const deptoNombres = {'A':'Canelones','B':'Maldonado','C':'Rocha','D':'Treinta y Tres','E':'Cerro Largo','F':'Rivera','G':'Artigas','H':'Salto','I':'Paysandú','J':'Río Negro','K':'Soriano','L':'Colonia','M':'San José','N':'Flores','O':'Florida','P':'Lavalleja','Q':'Durazno','R':'Tacuarembó','S':'Montevideo'};

        async function load() {
            try {
                const { data, error } = await sb.from('config_paises').select('*').order('pais_code');
                if (error) throw error;

                const container = document.getElementById('paisesContainer');
                container.innerHTML = data.map(p => {
                    const deptos = p.departamentos_habilitados || [];
                    return `
                    <div class="card" id="card_${p.pais_code}">
                        <h3>
                            <span>🚩 País: ${p.pais_code}</span>
                            <span class="status-badge ${p.habilitado ? 'status-on' : 'status-off'}">${p.habilitado ? 'OPERATIVO' : 'DESACTIVADO'}</span>
                        </h3>
                        
                        <div class="grid-config">
                            <div class="form-group">
                                <label>Moneda y Símbolo</label>
                                <input type="text" id="moneda_${p.pais_code}" value="${p.moneda || ''}" placeholder="Ej: UYU ($)">
                            </div>
                            <div class="form-group">
                                <label>Prefijo Telefónico</label>
                                <input type="text" id="prefijo_${p.pais_code}" value="${p.codigo_telefono || ''}" placeholder="Ej: +598">
                            </div>
                            <div class="form-group">
                                <label>Dígitos del Teléfono</label>
                                <input type="number" id="longitud_${p.pais_code}" value="${p.longitud_telefono || ''}" placeholder="Ej: 9">
                            </div>
                        </div>

                        <div class="grid-config">
                            <div class="toggle-container">
                                <span>País Habilitado</span>
                                <label class="toggle-switch">
                                    <input type="checkbox" id="habilitado_${p.pais_code}" ${p.habilitado ? 'checked' : ''}>
                                    <span class="slider"></span>
                                </label>
                            </div>
                            <div class="toggle-container">
                                <span>Auto-Hab. AUTOS</span>
                                <label class="toggle-switch">
                                    <input type="checkbox" id="auto_autos_${p.pais_code}" ${p.auto_habilitacion_autos ? 'checked' : ''}>
                                    <span class="slider"></span>
                                </label>
                            </div>
                            <div class="toggle-container">
                                <span>Auto-Hab. TAXIS</span>
                                <label class="toggle-switch">
                                    <input type="checkbox" id="auto_taxis_${p.pais_code}" ${p.auto_habilitacion_taxis ? 'checked' : ''}>
                                    <span class="slider"></span>
                                </label>
                            </div>
                        </div>

                        ${p.pais_code === 'UY' ? `
                            <div style="margin-top:20px;">
                                <label style="font-weight:bold; font-size:12px; color:#58a6ff; text-transform: uppercase;">Departamentos Matrículas (Uruguay):</label>
                                <div class="depto-grid" id="deptos_${p.pais_code}">
                                    ${Object.entries(deptoNombres).map(([key, name]) => `
                                        <label class="depto-item">
                                            <input type="checkbox" class="depto-check" value="${key}" ${deptos.includes(key) ? 'checked' : ''}>
                                            <span><b>${key}</b> - ${name}</span>
                                        </label>
                                    `).join('')}
                                </div>
                            </div>
                        ` : ''}

                        <button class="btn-save" onclick="saveCountryConfig('${p.pais_code}')">
                            💾 GUARDAR CONFIGURACIÓN DE ${p.pais_code}
                        </button>
                    </div>
                `}).join('');
            } catch (e) {
                document.getElementById('paisesContainer').innerHTML = `<div class='card' style='border-color: #f87171;'><h3 style='color: #f87171;'>Error</h3><p>${e.message}</p></div>`;
            }
        }

        async function saveCountryConfig(code) {
            const btn = document.querySelector(`#card_${code} .btn-save`);
            const oldText = btn.innerText;
            btn.innerText = "⏳ GUARDANDO...";
            btn.disabled = true;

            try {
                const moneda = document.getElementById(`moneda_${code}`).value;
                const prefijo = document.getElementById(`prefijo_${code}`).value;
                const longitud = parseInt(document.getElementById(`longitud_${code}`).value);
                const habilitado = document.getElementById(`habilitado_${code}`).checked;
                const auto_autos = document.getElementById(`auto_autos_${code}`).checked;
                const auto_taxis = document.getElementById(`auto_taxis_${code}`).checked;

                let deptos = [];
                if (code === 'UY') {
                    const checks = document.querySelectorAll(`#deptos_${code} .depto-check:checked`);
                    deptos = Array.from(checks).map(c => c.value);
                }

                const up = {
                    moneda,
                    codigo_telefono: prefijo,
                    longitud_telefono: isNaN(longitud) ? null : longitud,
                    habilitado,
                    auto_habilitacion_autos: auto_autos,
                    auto_habilitacion_taxis: auto_taxis,
                    departamentos_habilitados: deptos
                };

                const { error } = await sb.from('config_paises').update(up).eq('pais_code', code);
                if (error) throw error;

                alert("✅ Configuración de " + code + " guardada correctamente.");
                load();
            } catch (e) {
                alert("❌ Error al guardar: " + e.message + "\n\nRecuerda ejecutar el SQL en Supabase para crear las nuevas columnas.");
            } finally {
                btn.innerText = oldText;
                btn.disabled = false;
            }
        }

        load();
    </script>
</body>
</html>
