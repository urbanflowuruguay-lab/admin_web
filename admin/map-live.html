<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Monitoreo - UrbanFlow</title>
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href='https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css' rel='stylesheet' />
    <script src='https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js'></script>
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background: #0d1117; color: white; overflow: hidden; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
        .controls {
            position: absolute; top: 15px; left: 15px; z-index: 10;
            background: rgba(22, 27, 34, 0.9); padding: 12px; border-radius: 10px;
            border: 1px solid #30363d; display: flex; flex-direction: column; gap: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .btn-group { display: flex; gap: 5px; }
        .btn {
            padding: 8px 12px; border: none; border-radius: 6px; cursor: pointer;
            font-weight: bold; font-size: 11px; background: #21262d; color: #c9d1d9;
            transition: 0.2s; border: 1px solid #30363d; text-transform: uppercase;
        }
        .btn.active { background: #1f6feb; color: white; border-color: #58a6ff; }
        .stats {
            position: absolute; top: 15px; right: 15px; z-index: 10;
            background: rgba(22, 27, 34, 0.9); padding: 12px; border-radius: 10px;
            border: 1px solid #30363d; font-size: 11px; min-width: 120px;
        }
        .stat-item { display: flex; justify-content: space-between; margin-bottom: 4px; border-bottom: 1px solid #21262d; padding-bottom: 2px; }
        .stat-item:last-child { border: none; }
        .marker-label {
            background: rgba(0,0,0,0.7); color: white; padding: 2px 6px;
            border-radius: 4px; font-size: 10px; white-space: nowrap;
            font-weight: bold; border: 1px solid #58a6ff;
            pointer-events: none;
        }
        .car-marker {
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
            transition: all 0.5s ease; /* Movimiento suave para evitar saltos */
        }
    </style>
</head>
<body>
<div class="controls">
    <div style="font-weight: bold; font-size: 12px; color: #58a6ff;">MONITOR EN VIVO</div>
    <div class="btn-group">
        <button id="btnAll" class="btn active" onclick="setFilter('all')">TODOS</button>
        <button id="btnAutos" class="btn" onclick="setFilter('auto')">AUTOS</button>
        <button id="btnTaxis" class="btn" onclick="setFilter('taxi')">TAXIS</button>
    </div>
    <div id="statusInfo" style="font-size: 9px; color: #8b949e;">...</div>
</div>
<div class="stats">
    <div class="stat-item"><span>Total:</span> <span id="countTotal" style="font-weight: bold;">0</span></div>
    <div class="stat-item" style="color: #58a6ff;"><span>Autos:</span> <span id="countAutos">0</span></div>
    <div class="stat-item" style="color: #f2d335;"><span>Taxis:</span> <span id="countTaxis">0</span></div>
</div>
<div id="map"></div>
<script>
    const SUPABASE_URL = "https://eyfgkopaamnkprzpwocz.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5Zmdrb3BhYW1ua3ByenB3b2N6Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3ODYxOTQ4MywiZXhwIjoyMDk0MTk1NDgzfQ.GIEEonN5-YGK1hBLloSun9WX-almQfnQW-0LdGOHmCk";
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentFilter = 'all';
    const markers = {};
    const lastUpdate = {};
    let firstFound = false;

    const map = new maplibregl.Map({
        container: 'map',
        style: 'https://tiles.openfreemap.org/styles/dark',
        center: [-56.1645, -34.9011],
        zoom: 13
    });

    function setFilter(f) {
        currentFilter = f;
        document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
        const btn = document.getElementById(f === 'all' ? 'btnAll' : f === 'auto' ? 'btnAutos' : 'btnTaxis');
        if(btn) btn.classList.add('active');
        Object.keys(markers).forEach(id => {
            markers[id].marker.getElement().style.display =
                (currentFilter === 'all' || markers[id].data.tipo === currentFilter) ? 'flex' : 'none';
        });
    }

    function sz() {
        const z = map.getZoom();
        return z >= 16 ? 42 : z >= 14 ? 30 : z >= 12 ? 20 : z >= 10 ? 14 : 10;
    }

    map.on('zoom', () => {
        const s = sz(), ls = Math.max(8, Math.round(s * 0.28));
        Object.values(markers).forEach(({ marker }) => {
            const el = marker.getElement();
            const c = el.querySelector('.car-marker');
            if (c) { c.style.width = s + 'px'; c.style.height = s + 'px'; }
            const l = el.querySelector('.marker-label');
            if (l) { l.style.fontSize = ls + 'px'; l.style.marginTop = -(s + 8) + 'px'; }
        });
    });

    function updateStats() {
        let t = 0, a = 0, x = 0;
        Object.values(markers).forEach(m => { t++; m.data.tipo === 'taxi' ? x++ : a++; });
        document.getElementById('countTotal').innerText = t;
        document.getElementById('countAutos').innerText = a;
        document.getElementById('countTaxis').innerText = x;
    }

    function upsert(d) {
        if (!d || !d.lat || !d.lng || !d.id) return;
        const id = String(d.id); // Forzar ID como string
        const now = Date.now();
        lastUpdate[id] = now;

        if (markers[id]) {
            const m = markers[id];
            m.marker.setLngLat([d.lng, d.lat]);
            m.data = d;
            const el = m.marker.getElement();
            const car = el.querySelector('.car-marker');
            if (car) car.style.opacity = d.status === 'ocupado' ? '0.35' : '1';
            el.querySelector('.marker-label').innerText = d.nombre;
            el.style.opacity = '1';
        } else {
            const s = sz(), ls = Math.max(8, Math.round(s * 0.28));
            const c = document.createElement('div');
            c.style.cssText = 'display:flex;flex-direction:column;align-items:center;transition:opacity 0.5s;';
            const l = document.createElement('div');
            l.className = 'marker-label'; l.innerText = d.nombre;
            l.style.fontSize = ls + 'px'; l.style.marginTop = -(s + 8) + 'px';
            c.appendChild(l);
            const car = document.createElement('div');
            car.className = 'car-marker';
            car.style.width = s + 'px'; car.style.height = s + 'px';
            car.style.backgroundImage = 'url(' + (d.tipo === 'taxi' ? '/taxi.png' : '/autorojo.png') + ')';
            car.style.opacity = d.status === 'ocupado' ? '0.35' : '1';
            c.appendChild(car);
            const marker = new maplibregl.Marker({ element: c, pitchAlignment: 'viewport', rotationAlignment: 'viewport' })
                .setLngLat([d.lng, d.lat]).addTo(map);
            markers[id] = { marker, data: d };
            if (!firstFound) { firstFound = true; map.flyTo({ center: [d.lng, d.lat], zoom: 15 }); }
        }
        setFilter(currentFilter);
        updateStats();
    }

    const ch = sb.channel('monitoreo_choferes');
    ch.on('presence', { event: 'sync' }, () => {
        const state = ch.presenceState();
        Object.values(state).forEach(arr => arr.forEach(p => {
            const id = p.id || p.user_id;
            if (id && !String(id).startsWith('admin') && p.lat && p.lng) {
                upsert({ id, nombre: p.nombre || 'Chofer', tipo: p.tipo || 'auto', lat: p.lat, lng: p.lng, status: p.status });
            }
        }));
    })
    .on('broadcast', { event: 'location' }, ({ payload }) => {
        if (payload && payload.id) upsert(payload);
    })
    .subscribe((s) => {
        const el = document.getElementById('statusInfo');
        el.innerText = s;
        el.style.color = s === 'SUBSCRIBED' ? '#238636' : '#8b949e';
    });

    // Limpieza lenta: Solo borra si el chofer desaparece por más de 60 segundos
    setInterval(() => {
        const now = Date.now();
        Object.keys(markers).forEach(id => {
            const diff = now - lastUpdate[id];
            if (diff > 60000) {
                markers[id].marker.remove();
                delete markers[id];
                delete lastUpdate[id];
                updateStats();
            } else if (diff > 30000) {
                markers[id].marker.getElement().style.opacity = '0.3';
            }
        });
    }, 5000);
</script>
</body>
</html>
