<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <title>Viajes</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #0d1117; color: #c9d1d9; padding: 20px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header h1 { color: #58a6ff; font-size: 22px; }
        
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .stat { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 14px; text-align: center; }
        .stat .num { font-size: 28px; font-weight: bold; }
        .stat .label { font-size: 11px; color: #8b949e; text-transform: uppercase; margin-top: 4px; }
        .stat.total .num { color: #58a6ff; }
        .stat.completados .num { color: #3fb950; }
        .stat.cancelados .num { color: #f85149; }
        .stat.ingresos .num { color: #f0c000; }
        .stat.activos .num { color: #d29922; }
        
        .filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; align-items: center; }
        .filters select, .filters input { background: #161b22; border: 1px solid #30363d; color: #c9d1d9; padding: 8px 12px; border-radius: 6px; font-size: 13px; }
        .filters select:focus, .filters input:focus { border-color: #58a6ff; outline: none; }
        .filters input[type="date"] { width: 150px; }
        .filters input[type="text"] { width: 200px; }
        
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        thead th { background: #161b22; padding: 10px 8px; text-align: left; color: #8b949e; text-transform: uppercase; font-size: 10px; letter-spacing: 1px; border-bottom: 2px solid #30363d; position: sticky; top: 0; }
        tbody tr { border-bottom: 1px solid #21262d; cursor: pointer; transition: 0.2s; }
        tbody tr:hover { background: #161b22; }
        tbody td { padding: 10px 8px; }
        
        .badge { display: inline-block; padding: 3px 8px; border-radius: 10px; font-size: 11px; font-weight: bold; }
        .badge-solicitud { background: #30363d; color: #8b949e; }
        .badge-asignado { background: #1a3a5c; color: #58a6ff; }
        .badge-en_camino { background: #3d2e00; color: #d29922; }
        .badge-recogido { background: #1a3a1a; color: #56d364; }
        .badge-en_curso { background: #1a3a1a; color: #3fb950; }
        .badge-completado { background: #0d2818; color: #3fb950; }
        .badge-cancelado { background: #3d1a1a; color: #f85149; }
        
        .detail-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 100; justify-content: center; align-items: center; }
        .detail-overlay.show { display: flex; }
        .detail-panel { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 25px; max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto; }
        .detail-panel h2 { color: #58a6ff; margin-bottom: 15px; font-size: 18px; }
        .detail-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #21262d; }
        .detail-row .key { color: #8b949e; font-size: 12px; }
        .detail-row .val { color: #c9d1d9; font-size: 13px; font-weight: 500; }
        .detail-close { background: #21262d; color: #c9d1d9; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; margin-top: 15px; }
        .detail-close:hover { background: #30363d; }
        
        .pagination { display: flex; justify-content: center; gap: 8px; margin-top: 15px; }
        .pagination button { background: #161b22; border: 1px solid #30363d; color: #c9d1d9; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
        .pagination button:hover { background: #21262d; }
        .pagination button.active { background: #1f6feb; border-color: #1f6feb; color: white; }
        
        .empty { text-align: center; padding: 40px; color: #8b949e; }
        .refresh-btn { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; }
        .refresh-btn:hover { background: #30363d; }
        .delete-btn { background: #da3633; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; }
        .delete-btn:hover { background: #f85149; }
        .delete-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .select-all { width: 16px; height: 16px; cursor: pointer; }
        .row-check { width: 16px; height: 16px; cursor: pointer; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 200; justify-content: center; align-items: center; }
        .modal-overlay.show { display: flex; }
        .modal { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 25px; max-width: 500px; width: 90%; max-height: 80vh; overflow-y: auto; }
        .modal h2 { color: #58a6ff; margin-bottom: 15px; font-size: 18px; }
        .modal-field { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid #21262d; border-radius: 6px; margin-bottom: 6px; background: #0d1117; cursor: grab; }
        .modal-field:hover { border-color: #58a6ff; }
        .modal-field.dragging { opacity: 0.5; border-color: #f0c000; }
        .modal-field label { flex: 1; font-size: 13px; cursor: pointer; }
        .modal-field input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; }
        .modal-field .order-btns { display: flex; flex-direction: column; gap: 2px; }
        .modal-field .order-btns button { background: #21262d; border: 1px solid #30363d; color: #c9d1d9; width: 22px; height: 22px; border-radius: 4px; cursor: pointer; font-size: 10px; display: flex; align-items: center; justify-content: center; }
        .modal-field .order-btns button:hover { background: #30363d; }
        .modal-actions { display: flex; gap: 10px; margin-top: 15px; justify-content: flex-end; }
        .modal-actions button { padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; font-size: 13px; }
        .modal-actions .btn-cancel { background: #21262d; color: #c9d1d9; }
        .modal-actions .btn-save { background: #238636; color: white; font-weight: bold; }
    </style>
</head>
<body>

<div class="header">
    <h1>📋 Historial de Viajes</h1>
    <div style="display:flex; gap:10px; align-items:center;">
        <button class="refresh-btn" onclick="openExcelConfig()" style="background:#1a3a5c;border-color:#1f6feb;">⚙️ Configurar Excel</button>
        <button class="refresh-btn" onclick="exportarExcel()" style="background:#1a5c2e;border-color:#238636;">📥 Excel</button>
        <button class="delete-btn" id="btnDelete" disabled onclick="borrarSeleccionados()">🗑️ Borrar (<span id="deleteCount">0</span>)</button>
        <button class="refresh-btn" onclick="cargarViajes()">🔄 Actualizar</button>
    </div>
</div>

<div class="stats" id="stats">
    <div class="stat total"><div class="num" id="statTotal">-</div><div class="label">Total</div></div>
    <div class="stat activos"><div class="num" id="statActivos">-</div><div class="label">Activos</div></div>
    <div class="stat completados"><div class="num" id="statCompletados">-</div><div class="label">Completados</div></div>
    <div class="stat cancelados"><div class="num" id="statCancelados">-</div><div class="label">Cancelados</div></div>
    <div class="stat ingresos"><div class="num" id="statIngresos">-</div><div class="label">Ingresos</div></div>
</div>

<div class="filters">
    <select id="filterStatus">
        <option value="">Todos los estados</option>
        <option value="solicitud">Solicitud</option>
        <option value="asignado">Asignado</option>
        <option value="en_camino">En Camino</option>
        <option value="recogido">Recogido</option>
        <option value="en_curso">En Curso</option>
        <option value="completado">Completado</option>
        <option value="cancelado">Cancelado</option>
    </select>
    <select id="filterService">
        <option value="">Todos los servicios</option>
        <option value="Viajar">Viajar</option>
        <option value="Envios">Envios</option>
        <option value="Mascotas">Mascotas</option>
        <option value="Reservas">Reservas</option>
    </select>
    <select id="filterVehicleType">
        <option value="">Todos los vehículos</option>
        <option value="auto">Autos</option>
        <option value="taxi">Taxis</option>
    </select>
    <select id="filterCategory">
        <option value="">Todas las categorías</option>
        <option value="mascota">🐕 Mascotas</option>
        <option value="envio">📦 Envíos</option>
        <option value="reserva">📅 Reservas</option>
        <option value="complemento">🔗 Complementos</option>
        <option value="geoferta">🏷️ Geofertas</option>
    </select>
    <input type="date" id="filterDateFrom" title="Desde">
    <input type="date" id="filterDateTo" title="Hasta">
    <input type="text" id="filterSearch" placeholder="Buscar chofer, pasajero...">
</div>

<div id="tripList"></div>
<div class="pagination" id="pagination"></div>

<!-- Detail overlay -->
<div class="detail-overlay" id="detailOverlay" onclick="if(event.target===this)closeDetail()">
    <div style="display:flex;flex-direction:column;max-width:600px;width:90%;max-height:85vh">
        <div class="detail-panel" id="detailPanel"></div>
        <div id="routeMap" style="display:none;margin-top:10px;width:100%;height:350px;border-radius:8px;border:1px solid #30363d;flex-shrink:0"></div>
    </div>
</div>

<!-- Excel Config Modal -->
<div class="modal-overlay" id="excelConfigOverlay" onclick="if(event.target===this)closeExcelConfig()">
    <div class="modal">
        <h2>⚙️ Configurar columnas Excel</h2>
        <p style="color:#8b949e;font-size:12px;margin-bottom:15px">Seleccioná las columnas y ordenalas como necesites. Arrastrá para reordenar.</p>
        <div id="excelFieldsList"></div>
        <div class="modal-actions">
            <button class="btn-cancel" onclick="closeExcelConfig()">Cancelar</button>
            <button class="btn-save" onclick="saveExcelConfig()">Guardar</button>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://eyfgkopaamnkprzpwocz.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5Zmdrb3BhYW1ua3ByenB3b2N6Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3ODYxOTQ4MywiZXhwIjoyMDk0MTk1NDgzfQ.GIEEonN5-YGK1hBLloSun9WX-almQfnQW-0LdGOHmCk';

    let allTrips = [];
    let currentPage = 1;
    const perPage = 25;

    const statusLabels = {
        solicitud: 'Solicitud', asignado: 'Asignado', en_camino: 'En Camino',
        recogido: 'Recogido', en_curso: 'En Curso', completado: 'Completado', cancelado: 'Cancelado'
    };

    async function cargarViajes() {
        try {
            const res = await fetch(`${SUPABASE_URL}/rest/v1/viajes?order=created_at.desc&limit=500`, {
                headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
            });
            const text = await res.text();
            try {
                allTrips = JSON.parse(text);
                if (!Array.isArray(allTrips)) allTrips = [];
            } catch (e) {
                console.error('Parse error:', text.substring(0, 200));
                allTrips = [];
            }
            updateStats();
            renderTable();
        } catch (e) {
            console.error('Fetch error:', e);
            document.getElementById('tripList').innerHTML = `<div class="empty">Error: ${e.message}</div>`;
        }
    }

    function updateStats() {
        const total = allTrips.length;
        const activos = allTrips.filter(t => ['solicitud','asignado','en_camino','recogido','en_curso'].includes(t.status)).length;
        const completados = allTrips.filter(t => t.status === 'completado').length;
        const cancelados = allTrips.filter(t => t.status === 'cancelado').length;
        const ingresos = allTrips.filter(t => t.status === 'completado').reduce((s, t) => s + (t.final_price || 0), 0) +
                         allTrips.filter(t => t.status === 'cancelado').reduce((s, t) => s + (t.cancellation_fee || 0), 0);

        document.getElementById('statTotal').textContent = total;
        document.getElementById('statActivos').textContent = activos;
        document.getElementById('statCompletados').textContent = completados;
        document.getElementById('statCancelados').textContent = cancelados;
        document.getElementById('statIngresos').textContent = '$' + ingresos.toLocaleString('es-UY');
    }

    function getFiltered() {
        const status = document.getElementById('filterStatus').value;
        const service = document.getElementById('filterService').value;
        const vehicleType = document.getElementById('filterVehicleType').value;
        const category = document.getElementById('filterCategory').value;
        const dateFrom = document.getElementById('filterDateFrom').value;
        const dateTo = document.getElementById('filterDateTo').value;
        const search = document.getElementById('filterSearch').value.toLowerCase();

        return allTrips.filter(t => {
            if (status && t.status !== status) return false;
            if (service && t.service !== service) return false;
            if (vehicleType && t.vehicle_type !== vehicleType) return false;
            if (category) {
                if (category === 'mascota' && !t.has_pet) return false;
                if (category === 'envio' && t.service !== 'Envios') return false;
                if (category === 'reserva' && t.service !== 'Reservas') return false;
                if (category === 'complemento' && !t.complemento_de) return false;
                if (category === 'geoferta' && !t.is_geoferta) return false;
            }
            if (dateFrom && t.created_at && t.created_at.slice(0,10) < dateFrom) return false;
            if (dateTo && t.created_at && t.created_at.slice(0,10) > dateTo) return false;
            if (search) {
                const hay = (t.driver_name||'').toLowerCase().includes(search) ||
                            (t.passenger_name||'').toLowerCase().includes(search) ||
                            (t.driver_matricula||'').toLowerCase().includes(search) ||
                            (t.origin_address||t.origin_name||'').toLowerCase().includes(search) ||
                            (t.dest_address||t.dest_name||'').toLowerCase().includes(search);
                if (!hay) return false;
            }
            return true;
        });
    }

    let selectedIds = new Set();

    function renderTable() {
        const filtered = getFiltered();
        const totalPages = Math.ceil(filtered.length / perPage);
        if (currentPage > totalPages) currentPage = 1;
        const start = (currentPage - 1) * perPage;
        const page = filtered.slice(start, start + perPage);

        if (page.length === 0) {
            document.getElementById('tripList').innerHTML = '<div class="empty">No hay viajes</div>';
            document.getElementById('pagination').innerHTML = '';
            return;
        }

        const allChecked = page.every(t => selectedIds.has(t.id));
        let html = `<table><thead><tr>
            <th><input type="checkbox" class="select-all" ${allChecked ? 'checked' : ''} onchange="toggleSelectAll(this.checked)"></th>
            <th>Fecha</th><th>Estado</th><th>Servicio</th><th>Pasajero</th>
            <th>Chofer</th><th>Desde</th><th>Hasta</th><th>Precio</th>
        </tr></thead><tbody>`;

        for (const t of page) {
            const fecha = t.created_at ? new Date(t.created_at).toLocaleString('es-UY') : '-';
            const badge = `badge-${t.status}`;
            const precio = t.status === 'cancelado' ? (t.cancellation_fee > 0 ? '$' + t.cancellation_fee : '$0') :
                           t.final_price ? '$' + t.final_price : (t.adjusted_price ? '$' + t.adjusted_price : '-');
            const checked = selectedIds.has(t.id) ? 'checked' : '';
            html += `<tr>
                <td><input type="checkbox" class="row-check" ${checked} onchange="toggleSelect('${t.id}', this.checked)" onclick="event.stopPropagation()"></td>
                <td onclick="showDetail('${t.id}')">${fecha}</td>
                <td onclick="showDetail('${t.id}')"><span class="badge ${badge}">${statusLabels[t.status] || t.status}</span></td>
                <td onclick="showDetail('${t.id}')">${t.service || '-'}</td>
                <td onclick="showDetail('${t.id}')">${t.passenger_name || '-'}</td>
                <td onclick="showDetail('${t.id}')">${t.driver_name || '-'}<br><small style="color:#8b949e">${t.driver_matricula || ''}</small></td>
                <td style="max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${t.origin_address||t.origin_name||''}" onclick="showDetail('${t.id}')">${t.origin_address || t.origin_name || '-'}</td>
                <td style="max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${t.dest_address||t.dest_name||''}" onclick="showDetail('${t.id}')">${t.dest_address || t.dest_name || '-'}</td>
                <td style="font-weight:bold;color:#f0c000" onclick="showDetail('${t.id}')">${precio}</td>
            </tr>`;
        }
        html += '</tbody></table>';
        document.getElementById('tripList').innerHTML = html;

        // Pagination
        let pag = '';
        if (totalPages > 1) {
            if (currentPage > 1) pag += `<button onclick="goPage(${currentPage-1})">◀</button>`;
            for (let i = 1; i <= totalPages && i <= 10; i++) {
                pag += `<button class="${i===currentPage?'active':''}" onclick="goPage(${i})">${i}</button>`;
            }
            if (currentPage < totalPages) pag += `<button onclick="goPage(${currentPage+1})">▶</button>`;
        }
        document.getElementById('pagination').innerHTML = pag;
    }

    function goPage(p) { currentPage = p; renderTable(); }

    let pendingRouteCoords = null;

    function showDetail(id) {
        const t = allTrips.find(x => x.id === id);
        if (!t) return;
        pendingRouteCoords = t.route_coords ? (typeof t.route_coords === 'string' ? JSON.parse(t.route_coords) : t.route_coords) : null;

        const created = t.created_at ? new Date(t.created_at).toLocaleString('es-UY') : '-';
        const accepted = t.accepted_at ? new Date(t.accepted_at).toLocaleString('es-UY') : '-';
        const pickup = t.pickup_at ? new Date(t.pickup_at).toLocaleString('es-UY') : '-';
        const started = t.started_at ? new Date(t.started_at).toLocaleString('es-UY') : '-';
        const completed = t.completed_at ? new Date(t.completed_at).toLocaleString('es-UY') : '-';
        const cancelled = t.cancelled_at ? new Date(t.cancelled_at).toLocaleString('es-UY') : '-';

        document.getElementById('detailPanel').innerHTML = `
            <h2>Detalles del Viaje</h2>
            <div class="detail-row"><span class="key">ID</span><span class="val" style="font-size:10px">${t.id}</span></div>
            <div class="detail-row"><span class="key">Estado</span><span class="val"><span class="badge badge-${t.status}">${statusLabels[t.status]||t.status}</span></span></div>
            <div class="detail-row"><span class="key">Servicio</span><span class="val">${t.service||'-'}</span></div>
            <div class="detail-row"><span class="key">Creado</span><span class="val">${created}</span></div>
            
            <h2 style="margin-top:15px;font-size:15px">👤 Pasajero</h2>
            <div class="detail-row"><span class="key">Nombre</span><span class="val">${t.passenger_name||'-'}</span></div>
            <div class="detail-row"><span class="key">ID</span><span class="val" style="font-size:10px">${t.passenger_id||'-'}</span></div>
            
            <h2 style="margin-top:15px;font-size:15px">🚗 Chofer</h2>
            <div class="detail-row"><span class="key">Nombre</span><span class="val">${t.driver_name||'-'}</span></div>
            <div class="detail-row"><span class="key">Cédula</span><span class="val">${t.driver_dni||'-'}</span></div>
            <div class="detail-row"><span class="key">Vehículo</span><span class="val">${[t.vehicle_brand, t.vehicle_model, t.vehicle_color, t.vehicle_year].filter(Boolean).join(' ')||'-'}</span></div>
            <div class="detail-row"><span class="key">Matrícula</span><span class="val">${t.driver_matricula||'-'}</span></div>
            <div class="detail-row"><span class="key">Depto</span><span class="val">${(t.driver_depto||'').toUpperCase()}</span></div>
            <div class="detail-row"><span class="key">Teléfono</span><span class="val">${t.driver_phone||'-'}</span></div>
            
            <h2 style="margin-top:15px;font-size:15px">📍 Ruta</h2>
            <div class="detail-row"><span class="key">Origen</span><span class="val">${t.origin_address || t.origin_name || '-'}</span></div>
            <div class="detail-row"><span class="key">Destino</span><span class="val">${t.dest_address || t.dest_name || '-'}</span></div>
            ${t.stops_count > 0 ? `
            <div class="detail-row"><span class="key">Paradas</span><span class="val">${t.stops_count}</span></div>
            ${t.stops_data ? `<div class="detail-row"><span class="key">Detalle paradas</span><span class="val" style="font-size:11px">${Array.isArray(t.stops_data) ? t.stops_data.map((s,i) => `${i+1}. ${s.name||'Sin nombre'}`).join(', ') : '-'}</span></div>` : ''}
            ` : ''}
            <div class="detail-row"><span class="key">Distancia</span><span class="val">${t.total_km ? t.total_km.toFixed(2)+' km' : '-'}</span></div>
            <div class="detail-row"><span class="key">KM Zona / Fuera</span><span class="val">${(t.total_km_inside||0).toFixed(2)} / ${(t.total_km_outside||0).toFixed(2)} km</span></div>
            
            <h2 style="margin-top:15px;font-size:15px">⏱️ Tiempos</h2>
            <div class="detail-row"><span class="key">Hora Pedido</span><span class="val">${created}</span></div>
            <div class="detail-row"><span class="key">Hora Aceptación</span><span class="val">${accepted}</span></div>
            <div class="detail-row"><span class="key">Hora Llegada Puerta</span><span class="val">${pickup}</span></div>
            <div class="detail-row"><span class="key">Hora Subió Cliente</span><span class="val">${started}</span></div>
            <div class="detail-row"><span class="key">Hora Llegada Destino</span><span class="val">${completed}</span></div>
            <div class="detail-row"><span class="key">Tiempo Referencia</span><span class="val">${t.reference_time_min ? t.reference_time_min.toFixed(1)+' min' : '-'}</span></div>
            <div class="detail-row"><span class="key">Tiempo Real</span><span class="val">${t.actual_time_min ? t.actual_time_min.toFixed(1)+' min' : '-'}</span></div>

    let currentRouteMap = null;
    function drawRouteMap(coords) {
        var container = document.getElementById('routeMap');
        container.style.display = 'block';
        if (currentRouteMap) { currentRouteMap.remove(); currentRouteMap = null; }
        var lnglats = coords.map(function(c){ return [c[0], c[1]]; });
        var map = new maplibregl.Map({
            container: container,
            style: {version:8,sources:{'osm':{type:'raster',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256,attribution:'OpenStreetMap'}},layers:[{id:'osm',type:'raster',source:'osm'}]},
            center: lnglats[Math.floor(lnglats.length/2)],
            zoom: 14
        });
        currentRouteMap = map;
        map.addControl(new maplibregl.NavigationControl(), 'top-right');
        map.on('load', function() {
            map.addSource('route', {
                type: 'geojson',
                data: { type: 'Feature', geometry: { type: 'LineString', coordinates: lnglats } }
            });
            map.addLayer({
                id: 'route-line',
                type: 'line',
                source: 'route',
                paint: { 'line-color': '#00C853', 'line-width': 4, 'line-opacity': 0.9 }
            });
            var startMarker = new maplibregl.Marker({color: '#4CAF50'}).setLngLat(lnglats[0]).addTo(map);
            var endMarker = new maplibregl.Marker({color: '#f44336'}).setLngLat(lnglats[lnglats.length-1]).addTo(map);
            var bounds = new maplibregl.LngLatBounds();
            lnglats.forEach(function(c){ bounds.extend(c); });
            map.fitBounds(bounds, { padding: 40 });
        });
    }

    async function borrarSeleccionados() {
        if (!confirm(`¿Borrar ${selectedIds.size} viaje(s)? Esto no se puede deshacer.`)) return;
        const ids = Array.from(selectedIds);
        let errores = 0;
        let errorDetail = '';
        for (const id of ids) {
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/viajes?id=eq.${id}`, {
                    method: 'DELETE',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=minimal'
                    }
                });
                if (!res.ok) {
                    errores++;
                    const body = await res.text();
                    errorDetail += `\n${id}: ${res.status} ${body}`;
                }
            } catch (e) {
                errores++;
                errorDetail += `\n${id}: ${e.message}`;
            }
        }
        if (errores > 0) {
            alert(`${errores} viaje(s) no se pudieron borrar:${errorDetail}`);
        }
        selectedIds.clear();
        updateDeleteBtn();
        await cargarViajes();
    }

    function loadExcelConfig() {
        const defaults = ALL_FIELDS.map(f => ({ key: f.key, enabled: true }));
        try {
            const saved = localStorage.getItem('uf_excel_config_v2');
            if (saved) {
                const parsed = JSON.parse(saved);
                if (Array.isArray(parsed) && parsed.length > 0) {
                    return ALL_FIELDS.map(f => {
                        const savedItem = parsed.find(s => s.key === f.key);
                        return { key: f.key, enabled: savedItem ? savedItem.enabled : true };
                    });
                }
            }
        } catch(e) { console.warn('Config Excel corrupta, usando defaults', e); }
        return defaults;
    }

    function saveExcelConfigToStorage() {

    function openExcelConfig() {
        const list = document.getElementById('excelFieldsList');
        list.innerHTML = '';
        excelConfig.forEach((f, i) => {
            const field = ALL_FIELDS.find(x => x.key === f.key) || { key: f.key, label: f.key };
            const div = document.createElement('div');
            div.className = 'modal-field';
            div.draggable = true;
            div.dataset.index = i;
            div.innerHTML = `
                <input type="checkbox" id="ef_${i}" ${f.enabled ? 'checked' : ''}>
                <label for="ef_${i}">${field.label}</label>
                <div class="order-btns">
                    <button onclick="moveField(${i},-1)" title="Subir">▲</button>
                    <button onclick="moveField(${i},1)" title="Bajar">▼</button>
                </div>
            `;
            div.querySelector('input').addEventListener('change', function() {
                excelConfig[i].enabled = this.checked;
            });
            div.ondragstart = (e) => { e.dataTransfer.setData('text/plain', i); div.classList.add('dragging'); };
            div.ondragend = () => div.classList.remove('dragging');
            div.ondragover = (e) => e.preventDefault();
            div.ondrop = (e) => {
                e.preventDefault();
                const from = parseInt(e.dataTransfer.getData('text/plain'));
                const to = i;
                if (from !== to) {
                    const [moved] = excelConfig.splice(from, 1);
                    excelConfig.splice(to, 0, moved);
                    openExcelConfig();
                }
            };
            list.appendChild(div);
        });
        document.getElementById('excelConfigOverlay').classList.add('show');
    }

            total_km_outside: t => t.total_km_outside ? parseFloat(t.total_km_outside.toFixed(2)) : 0,
            stops_count: t => t.stops_count || 0,
            stops_charge: t => t.stops_charge || 0,
            stops_data: t => t.stops_data ? JSON.stringify(t.stops_data) : '',
            reference_time_min: t => t.reference_time_min ? parseFloat(t.reference_time_min.toFixed(1)) : 0,
            actual_time_min: t => t.actual_time_min ? parseFloat(t.actual_time_min.toFixed(1)) : 0,
            pickup_time_min: t => t.pickup_time_min ? parseFloat(t.pickup_time_min.toFixed(1)) : 0,
            wait_charge: t => t.wait_charge || 0,
            extra_time_seconds: t => t.extra_time_seconds || 0,
            extra_time_charge: t => t.extra_time_charge || 0,
            surcharge_pct: t => t.surcharge_pct || 0,
            surcharge_amount: t => t.surcharge_amount || 0,
            has_package: t => t.has_package ? 'Sí' : 'No',
            has_pet: t => t.has_pet ? 'Sí' : 'No',
            has_toll: t => t.has_toll ? 'Sí' : 'No',
            toll_count: t => t.toll_count || 0,
            package_charge: t => t.package_charge || 0,
            pet_charge: t => t.pet_charge || 0,
            final_price: t => t.final_price || 0,
            canon_total: t => t.canon_total || 0,
            company_fee: t => t.company_fee || 0,
            mercadopago_fee: t => t.mercadopago_fee || 0,
            passenger_total: t => t.passenger_total || 0,
            cancellation_fee: t => t.cancellation_fee || 0,
            cancel_reason: t => t.cancel_reason || '',
            cancel_phase: t => t.cancel_phase || '',
            is_geoferta: t => t.is_geoferta ? 'Sí' : 'No',
            complemento_de: t => t.complemento_de || '',
            route_screenshot: t => t.route_screenshot || '',
            route_url: t => {
                try {
                    let coords = t.route_coords;
                    if (coords) {
                        if (typeof coords === 'string') coords = JSON.parse(coords);
                        if (Array.isArray(coords) && coords.length >= 2) {
                            const base = window.location.origin;
                            const data = encodeURIComponent(JSON.stringify(coords));
                            return `${base}/admin/ruta.html?coords=${data}`;
                        }
                    }
                    if (t.origin_lat && t.origin_lng && t.dest_lat && t.dest_lng) {
                        const base = window.location.origin;
                        const data = encodeURIComponent(JSON.stringify([[t.origin_lng, t.origin_lat], [t.dest_lng, t.dest_lat]]));
                        return `${base}/admin/ruta.html?coords=${data}`;
                    }
                    return '';
                } catch(e) { return ''; }
            }
        };
        return extractors[key] || (t => t[key] || '');
    }

    async function exportarExcel() {
        await fetchUI();
        const filtered = getFiltered();
        if (!filtered.length) { alert('No hay viajes para exportar'); return; }

        const enabledFields = excelConfig.filter(f => f.enabled);
        if (!enabledFields.length) {
            alert('No hay columnas seleccionadas. Configurá el Excel primero con el botón ⚙️');
            return;
        }

        const wb = XLSX.utils.book_new();

        // === HOJA RESUMEN ===
        const kmByDept = {};
        let totalKmAll = 0;
        let totalIngresos = 0;

        filtered.forEach(t => {
            const dept = (t.driver_depto || 'Sin depto').toUpperCase();
            if (!kmByDept[dept]) kmByDept[dept] = { km: 0, viajes: 0, ingresos: 0 };
            kmByDept[dept].km += t.total_km || 0;
            kmByDept[dept].viajes++;
            const precio = t.status === 'completado' ? (t.final_price || t.adjusted_price || 0) :
                           t.status === 'cancelado' ? (t.cancellation_fee || 0) : 0;
            kmByDept[dept].ingresos += precio;
            totalKmAll += t.total_km || 0;
            totalIngresos += precio;
        });

        const resumenData = [
            ['HISTORIAL DE VIAJES - URBANFLOW'],
            ['Fecha exportación:', new Date().toLocaleString('es-UY')],
            ['Viajes filtrados:', filtered.length],
            ['UI (Unidad Indexada):', '$' + uiValue.toFixed(2)],
            [],
            ['RESUMEN POR DEPARTAMENTO'],
            ['Departamento', 'Viajes', 'KM Total', 'Ingresos ($)', 'Canon UI (KM × UI)'],
        ];

        for (const [dept, d] of Object.entries(kmByDept)) {
            resumenData.push([
                dept, d.viajes,
                parseFloat(d.km.toFixed(2)),
                parseFloat(d.ingresos.toFixed(2)),
                parseFloat((d.km * uiValue).toFixed(2))
            ]);
        }

        resumenData.push([]);
        resumenData.push(['TOTALES', filtered.length, parseFloat(totalKmAll.toFixed(2)),
            parseFloat(totalIngresos.toFixed(2)), parseFloat((totalKmAll * uiValue).toFixed(2))]);

        const wsResumen = XLSX.utils.aoa_to_sheet(resumenData);
        wsResumen['!cols'] = [{ wch: 20 }, { wch: 10 }, { wch: 12 }, { wch: 15 }, { wch: 18 }];
        XLSX.utils.book_append_sheet(wb, wsResumen, 'Resumen');

        // === HOJA DETALLE (configurable) ===
        const headers = enabledFields.map(f => {
            const field = ALL_FIELDS.find(x => x.key === f.key);
            return field ? field.label : f.key;
        });

        const detailRows = [headers];
        const hyperlinkCells = [];
        const routeUrlIdx = enabledFields.findIndex(f => f.key === 'route_url');

        filtered.forEach((t, rowIdx) => {
            const row = enabledFields.map(f => getFieldExtractor(f.key)(t));
            detailRows.push(row);
            if (routeUrlIdx >= 0 && row[routeUrlIdx]) {
                hyperlinkCells.push({ r: rowIdx + 1, c: routeUrlIdx, url: String(row[routeUrlIdx]) });
            }
        });

        const wsDetalle = XLSX.utils.aoa_to_sheet(detailRows);
        wsDetalle['!cols'] = enabledFields.map(() => ({ wch: 16 }));

        hyperlinkCells.forEach(h => {
            const cellRef = XLSX.utils.encode_cell({ r: h.r, c: h.c });
            wsDetalle[cellRef] = { t: 's', v: 'Ver ruta', l: { Target: h.url }, s: { font: { color: { rgb: '0563C1' }, underline: true } } };
        });

        XLSX.utils.book_append_sheet(wb, wsDetalle, 'Detalle');

        // Nombre del archivo con depto y fechas
        const deptos = [...new Set(filtered.map(t => (t.driver_depto || 'SinDepto').toUpperCase()))].slice(0, 3).join('+');
        const dateFrom = document.getElementById('filterDateFrom').value || 'inicio';
        const dateTo = document.getElementById('filterDateTo').value || 'hoy';
        const fechaStr = new Date().toISOString().slice(0,10);
        const fileName = `UrbanFlow_Viajes_${deptos}_${dateFrom}_${dateTo}_${fechaStr}.xlsx`;

        XLSX.writeFile(wb, fileName);
    }
</script>
