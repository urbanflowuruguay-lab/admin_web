<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <title>Viajes</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #0d1117; color: #c9d1d9; padding: 20px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header h1 { color: #58a6ff; font-size: 22px; }
        
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .stat { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 14px; text-align: center; }
        .stat .num { font-size: 28px; font-weight: bold; }
        .stat .label { font-size: 11px; color: #8b949e; text-transform: uppercase; margin-top: 4px; }
        .stat.total .num { color: #58a6ff; }
        .stat.completados .num { color: #3fb950; }
        .stat.cancelados .num { color: #f85149; }
        .stat.ingresos .num { color: #f0c000; }
        .stat.activos .num { color: #d29922; }
        
        .filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; align-items: center; }
        .filters select, .filters input { background: #161b22; border: 1px solid #30363d; color: #c9d1d9; padding: 8px 12px; border-radius: 6px; font-size: 13px; }
        .filters select:focus, .filters input:focus { border-color: #58a6ff; outline: none; }
        .filters input[type="date"] { width: 150px; }
        .filters input[type="text"] { width: 200px; }
        
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        thead th { background: #161b22; padding: 10px 8px; text-align: left; color: #8b949e; text-transform: uppercase; font-size: 10px; letter-spacing: 1px; border-bottom: 2px solid #30363d; position: sticky; top: 0; }
        tbody tr { border-bottom: 1px solid #21262d; cursor: pointer; transition: 0.2s; }
        tbody tr:hover { background: #161b22; }
        tbody td { padding: 10px 8px; }
        
        .badge { display: inline-block; padding: 3px 8px; border-radius: 10px; font-size: 11px; font-weight: bold; }
        .badge-solicitud { background: #30363d; color: #8b949e; }
        .badge-asignado { background: #1a3a5c; color: #58a6ff; }
        .badge-en_camino { background: #3d2e00; color: #d29922; }
        .badge-recogido { background: #1a3a1a; color: #56d364; }
        .badge-en_curso { background: #1a3a1a; color: #3fb950; }
        .badge-completado { background: #0d2818; color: #3fb950; }
        .badge-cancelado { background: #3d1a1a; color: #f85149; }
        
        .detail-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 100; justify-content: center; align-items: center; }
        .detail-overlay.show { display: flex; }
        .detail-panel { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 25px; max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto; }
        .detail-panel h2 { color: #58a6ff; margin-bottom: 15px; font-size: 18px; }
        .detail-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #21262d; }
        .detail-row .key { color: #8b949e; font-size: 12px; }
        .detail-row .val { color: #c9d1d9; font-size: 13px; font-weight: 500; }
        .detail-close { background: #21262d; color: #c9d1d9; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; margin-top: 15px; }
        .detail-close:hover { background: #30363d; }
        
        .pagination { display: flex; justify-content: center; gap: 8px; margin-top: 15px; }
        .pagination button { background: #161b22; border: 1px solid #30363d; color: #c9d1d9; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
        .pagination button:hover { background: #21262d; }
        .pagination button.active { background: #1f6feb; border-color: #1f6feb; color: white; }
        
        .empty { text-align: center; padding: 40px; color: #8b949e; }
        .refresh-btn { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; }
        .refresh-btn:hover { background: #30363d; }
        .delete-btn { background: #da3633; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; }
        .delete-btn:hover { background: #f85149; }
        .delete-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .select-all { width: 16px; height: 16px; cursor: pointer; }
        .row-check { width: 16px; height: 16px; cursor: pointer; }
    </style>
</head>
<body>

<div class="header">
    <h1>📋 Historial de Viajes</h1>
    <div style="display:flex; gap:10px; align-items:center;">
        <button class="refresh-btn" onclick="exportarExcel()" style="background:#1a5c2e;border-color:#238636;">📥 Excel</button>
        <button class="delete-btn" id="btnDelete" disabled onclick="borrarSeleccionados()">🗑️ Borrar (<span id="deleteCount">0</span>)</button>
        <button class="refresh-btn" onclick="cargarViajes()">🔄 Actualizar</button>
    </div>
</div>

<div class="stats" id="stats">
    <div class="stat total"><div class="num" id="statTotal">-</div><div class="label">Total</div></div>
    <div class="stat activos"><div class="num" id="statActivos">-</div><div class="label">Activos</div></div>
    <div class="stat completados"><div class="num" id="statCompletados">-</div><div class="label">Completados</div></div>
    <div class="stat cancelados"><div class="num" id="statCancelados">-</div><div class="label">Cancelados</div></div>
    <div class="stat ingresos"><div class="num" id="statIngresos">-</div><div class="label">Ingresos</div></div>
</div>

<div class="filters">
    <select id="filterStatus">
        <option value="">Todos los estados</option>
        <option value="solicitud">Solicitud</option>
        <option value="asignado">Asignado</option>
        <option value="en_camino">En Camino</option>
        <option value="recogido">Recogido</option>
        <option value="en_curso">En Curso</option>
        <option value="completado">Completado</option>
        <option value="cancelado">Cancelado</option>
    </select>
    <select id="filterService">
        <option value="">Todos los servicios</option>
        <option value="Viajar">Viajar</option>
        <option value="Envios">Envios</option>
        <option value="Mascotas">Mascotas</option>
        <option value="Reservas">Reservas</option>
    </select>
    <input type="date" id="filterDateFrom" title="Desde">
    <input type="date" id="filterDateTo" title="Hasta">
    <input type="text" id="filterSearch" placeholder="Buscar chofer, pasajero...">
</div>

<div id="tripList"></div>
<div class="pagination" id="pagination"></div>

<!-- Detail overlay -->
<div class="detail-overlay" id="detailOverlay" onclick="if(event.target===this)closeDetail()">
    <div class="detail-panel" id="detailPanel"></div>
</div>

<script>
    const SUPABASE_URL = 'https://eyfgkopaamnkprzpwocz.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5Zmdrb3BhYW1ua3ByenB3b2N6Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3ODYxOTQ4MywiZXhwIjoyMDk0MTk1NDgzfQ.GIEEonN5-YGK1hBLloSun9WX-almQfnQW-0LdGOHmCk';

    let allTrips = [];
    let currentPage = 1;
    const perPage = 25;

    const statusLabels = {
        solicitud: 'Solicitud', asignado: 'Asignado', en_camino: 'En Camino',
        recogido: 'Recogido', en_curso: 'En Curso', completado: 'Completado', cancelado: 'Cancelado'
    };

    async function cargarViajes() {
        try {
            const res = await fetch(`${SUPABASE_URL}/rest/v1/viajes?order=created_at.desc&limit=500`, {
                headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
            });
            allTrips = await res.json();
            if (!Array.isArray(allTrips)) allTrips = [];
            updateStats();
            renderTable();
        } catch (e) {
            document.getElementById('tripList').innerHTML = `<div class="empty">Error: ${e.message}</div>`;
        }
    }

    function updateStats() {
        const total = allTrips.length;
        const activos = allTrips.filter(t => ['solicitud','asignado','en_camino','recogido','en_curso'].includes(t.status)).length;
        const completados = allTrips.filter(t => t.status === 'completado').length;
        const cancelados = allTrips.filter(t => t.status === 'cancelado').length;
        const ingresos = allTrips.filter(t => t.status === 'completado').reduce((s, t) => s + (t.final_price || 0), 0) +
                         allTrips.filter(t => t.status === 'cancelado').reduce((s, t) => s + (t.cancellation_fee || 0), 0);

        document.getElementById('statTotal').textContent = total;
        document.getElementById('statActivos').textContent = activos;
        document.getElementById('statCompletados').textContent = completados;
        document.getElementById('statCancelados').textContent = cancelados;
        document.getElementById('statIngresos').textContent = '$' + ingresos.toLocaleString('es-UY');
    }

    function getFiltered() {
        const status = document.getElementById('filterStatus').value;
        const service = document.getElementById('filterService').value;
        const dateFrom = document.getElementById('filterDateFrom').value;
        const dateTo = document.getElementById('filterDateTo').value;
        const search = document.getElementById('filterSearch').value.toLowerCase();

        return allTrips.filter(t => {
            if (status && t.status !== status) return false;
            if (service && t.service !== service) return false;
            if (dateFrom && t.created_at && t.created_at.slice(0,10) < dateFrom) return false;
            if (dateTo && t.created_at && t.created_at.slice(0,10) > dateTo) return false;
            if (search) {
                const hay = (t.driver_name||'').toLowerCase().includes(search) ||
                            (t.passenger_name||'').toLowerCase().includes(search) ||
                            (t.driver_matricula||'').toLowerCase().includes(search) ||
                            (t.origin_address||t.origin_name||'').toLowerCase().includes(search) ||
                            (t.dest_address||t.dest_name||'').toLowerCase().includes(search);
                if (!hay) return false;
            }
            return true;
        });
    }

    let selectedIds = new Set();

    function renderTable() {
        const filtered = getFiltered();
        const totalPages = Math.ceil(filtered.length / perPage);
        if (currentPage > totalPages) currentPage = 1;
        const start = (currentPage - 1) * perPage;
        const page = filtered.slice(start, start + perPage);

        if (page.length === 0) {
            document.getElementById('tripList').innerHTML = '<div class="empty">No hay viajes</div>';
            document.getElementById('pagination').innerHTML = '';
            return;
        }

        const allChecked = page.every(t => selectedIds.has(t.id));
        let html = `<table><thead><tr>
            <th><input type="checkbox" class="select-all" ${allChecked ? 'checked' : ''} onchange="toggleSelectAll(this.checked)"></th>
            <th>Fecha</th><th>Estado</th><th>Servicio</th><th>Pasajero</th>
            <th>Chofer</th><th>Desde</th><th>Hasta</th><th>Precio</th>
        </tr></thead><tbody>`;

        for (const t of page) {
            const fecha = t.created_at ? new Date(t.created_at).toLocaleString('es-UY') : '-';
            const badge = `badge-${t.status}`;
            const precio = t.status === 'cancelado' ? (t.cancellation_fee > 0 ? '$' + t.cancellation_fee : '$0') :
                           t.final_price ? '$' + t.final_price : (t.adjusted_price ? '$' + t.adjusted_price : '-');
            const checked = selectedIds.has(t.id) ? 'checked' : '';
            html += `<tr>
                <td><input type="checkbox" class="row-check" ${checked} onchange="toggleSelect('${t.id}', this.checked)" onclick="event.stopPropagation()"></td>
                <td onclick="showDetail('${t.id}')">${fecha}</td>
                <td onclick="showDetail('${t.id}')"><span class="badge ${badge}">${statusLabels[t.status] || t.status}</span></td>
                <td onclick="showDetail('${t.id}')">${t.service || '-'}</td>
                <td onclick="showDetail('${t.id}')">${t.passenger_name || '-'}</td>
                <td onclick="showDetail('${t.id}')">${t.driver_name || '-'}<br><small style="color:#8b949e">${t.driver_matricula || ''}</small></td>
                <td style="max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${t.origin_address||t.origin_name||''}" onclick="showDetail('${t.id}')">${t.origin_address || t.origin_name || '-'}</td>
                <td style="max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${t.dest_address||t.dest_name||''}" onclick="showDetail('${t.id}')">${t.dest_address || t.dest_name || '-'}</td>
                <td style="font-weight:bold;color:#f0c000" onclick="showDetail('${t.id}')">${precio}</td>
            </tr>`;
        }
        html += '</tbody></table>';
        document.getElementById('tripList').innerHTML = html;

        // Pagination
        let pag = '';
        if (totalPages > 1) {
            if (currentPage > 1) pag += `<button onclick="goPage(${currentPage-1})">◀</button>`;
            for (let i = 1; i <= totalPages && i <= 10; i++) {
                pag += `<button class="${i===currentPage?'active':''}" onclick="goPage(${i})">${i}</button>`;
            }
            if (currentPage < totalPages) pag += `<button onclick="goPage(${currentPage+1})">▶</button>`;
        }
        document.getElementById('pagination').innerHTML = pag;
    }

    function goPage(p) { currentPage = p; renderTable(); }

    function showDetail(id) {
        const t = allTrips.find(x => x.id === id);
        if (!t) return;

        const created = t.created_at ? new Date(t.created_at).toLocaleString('es-UY') : '-';
        const accepted = t.accepted_at ? new Date(t.accepted_at).toLocaleString('es-UY') : '-';
        const pickup = t.pickup_at ? new Date(t.pickup_at).toLocaleString('es-UY') : '-';
        const started = t.started_at ? new Date(t.started_at).toLocaleString('es-UY') : '-';
        const completed = t.completed_at ? new Date(t.completed_at).toLocaleString('es-UY') : '-';
        const cancelled = t.cancelled_at ? new Date(t.cancelled_at).toLocaleString('es-UY') : '-';

        document.getElementById('detailPanel').innerHTML = `
            <h2>Detalles del Viaje</h2>
            <div class="detail-row"><span class="key">ID</span><span class="val" style="font-size:10px">${t.id}</span></div>
            <div class="detail-row"><span class="key">Estado</span><span class="val"><span class="badge badge-${t.status}">${statusLabels[t.status]||t.status}</span></span></div>
            <div class="detail-row"><span class="key">Servicio</span><span class="val">${t.service||'-'}</span></div>
            <div class="detail-row"><span class="key">Creado</span><span class="val">${created}</span></div>
            
            <h2 style="margin-top:15px;font-size:15px">👤 Pasajero</h2>
            <div class="detail-row"><span class="key">Nombre</span><span class="val">${t.passenger_name||'-'}</span></div>
            <div class="detail-row"><span class="key">ID</span><span class="val" style="font-size:10px">${t.passenger_id||'-'}</span></div>
            
            <h2 style="margin-top:15px;font-size:15px">🚗 Chofer</h2>
            <div class="detail-row"><span class="key">Nombre</span><span class="val">${t.driver_name||'-'}</span></div>
            <div class="detail-row"><span class="key">Matrícula</span><span class="val">${t.driver_matricula||'-'}</span></div>
            <div class="detail-row"><span class="key">Aceptado</span><span class="val">${accepted}</span></div>
            
            <h2 style="margin-top:15px;font-size:15px">📍 Ruta</h2>
            <div class="detail-row"><span class="key">Origen</span><span class="val">${t.origin_address || t.origin_name || '-'}</span></div>
            <div class="detail-row"><span class="key">Destino</span><span class="val">${t.dest_address || t.dest_name || '-'}</span></div>
            <div class="detail-row"><span class="key">Paradas</span><span class="val">${t.stops_count||0}</span></div>
            <div class="detail-row"><span class="key">Distancia</span><span class="val">${t.total_km ? t.total_km.toFixed(1)+' km' : '-'}</span></div>
            <div class="detail-row"><span class="key">Duración</span><span class="val">${t.total_min ? t.total_min.toFixed(0)+' min' : '-'}</span></div>
            
            <h2 style="margin-top:15px;font-size:15px">💰 Pago</h2>
            <div class="detail-row"><span class="key">Precio base</span><span class="val">${t.base_price ? '$'+t.base_price : '-'}</span></div>
            <div class="detail-row"><span class="key">Precio ajustado</span><span class="val">${t.adjusted_price ? '$'+t.adjusted_price : '-'}</span></div>
            <div class="detail-row"><span class="key">Precio final</span><span class="val" style="color:#f0c000;font-size:16px">${t.final_price ? '$'+t.final_price : '-'}</span></div>
            
            ${t.status === 'cancelado' ? `
            <h2 style="margin-top:15px;font-size:15px">❌ Cancelación</h2>
            <div class="detail-row"><span class="key">Motivo</span><span class="val">${t.cancel_reason||'-'}</span></div>
            <div class="detail-row"><span class="key">Fase</span><span class="val">${t.cancel_phase||'-'}</span></div>
            <div class="detail-row"><span class="key">Costo cancelación</span><span class="val" style="color:#f85149">${t.cancellation_fee ? '$'+t.cancellation_fee : '$0'}</span></div>
            <div class="detail-row"><span class="key">Cancelado</span><span class="val">${cancelled}</span></div>
            ` : ''}
            
            <h2 style="margin-top:15px;font-size:15px">⏱️ Tiempos</h2>
            <div class="detail-row"><span class="key">Recogido</span><span class="val">${pickup}</span></div>
            <div class="detail-row"><span class="key">Iniciado</span><span class="val">${started}</span></div>
            <div class="detail-row"><span class="key">Completado</span><span class="val">${completed}</span></div>
            
            <button class="detail-close" onclick="closeDetail()">Cerrar</button>
        `;
        document.getElementById('detailOverlay').classList.add('show');
    }

    function closeDetail() {
        document.getElementById('detailOverlay').classList.remove('show');
    }

    function toggleSelect(id, checked) {
        if (checked) selectedIds.add(id); else selectedIds.delete(id);
        updateDeleteBtn();
    }

    function toggleSelectAll(checked) {
        const filtered = getFiltered();
        const start = (currentPage - 1) * perPage;
        const page = filtered.slice(start, start + perPage);
        page.forEach(t => { if (checked) selectedIds.add(t.id); else selectedIds.delete(t.id); });
        renderTable();
        updateDeleteBtn();
    }

    function updateDeleteBtn() {
        const btn = document.getElementById('btnDelete');
        const cnt = document.getElementById('deleteCount');
        cnt.textContent = selectedIds.size;
        btn.disabled = selectedIds.size === 0;
    }

    async function borrarSeleccionados() {
        if (!confirm(`¿Borrar ${selectedIds.size} viaje(s)? Esto no se puede deshacer.`)) return;
        try {
            const res = await fetch('/api/viajes-delete', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ids: Array.from(selectedIds) })
            });
            if (!res.ok) throw new Error(await res.text());
            selectedIds.clear();
            updateDeleteBtn();
            await cargarViajes();
        } catch (e) { alert('Error: ' + e.message); }
    }

    let uiValue = 6.58;

    async function fetchUI() {
        try {
            const res = await fetch('/api/update-ui');
            const data = await res.json();
            if (data.success) uiValue = data.value;
        } catch (e) {}
    }

    async function exportarExcel() {
        await fetchUI();
        const filtered = getFiltered();
        if (!filtered.length) { alert('No hay viajes para exportar'); return; }

        const wb = XLSX.utils.book_new();

        // === HOJA RESUMEN ===
        const kmByDept = {};
        let totalKmAll = 0;
        let totalIngresos = 0;

        filtered.forEach(t => {
            const dept = (t.driver_depto || 'Sin depto').toUpperCase();
            if (!kmByDept[dept]) kmByDept[dept] = { km: 0, viajes: 0, ingresos: 0 };
            kmByDept[dept].km += t.total_km || 0;
            kmByDept[dept].viajes++;
            const precio = t.status === 'completado' ? (t.final_price || t.adjusted_price || 0) :
                           t.status === 'cancelado' ? (t.cancellation_fee || 0) : 0;
            kmByDept[dept].ingresos += precio;
            totalKmAll += t.total_km || 0;
            totalIngresos += precio;
        });

        const resumenData = [
            ['HISTORIAL DE VIAJES - URBANFLOW'],
            ['Fecha exportación:', new Date().toLocaleString('es-UY')],
            ['Viajes filtrados:', filtered.length],
            ['UI (Unidad Indexada):', '$' + uiValue.toFixed(2)],
            [],
            ['RESUMEN POR DEPARTAMENTO'],
            ['Departamento', 'Viajes', 'KM Total', 'Ingresos ($)', 'Canon UI (KM × UI)'],
        ];

        for (const [dept, d] of Object.entries(kmByDept)) {
            resumenData.push([
                dept, d.viajes,
                parseFloat(d.km.toFixed(2)),
                parseFloat(d.ingresos.toFixed(2)),
                parseFloat((d.km * uiValue).toFixed(2))
            ]);
        }

        resumenData.push([]);
        resumenData.push(['TOTALES', filtered.length, parseFloat(totalKmAll.toFixed(2)),
            parseFloat(totalIngresos.toFixed(2)), parseFloat((totalKmAll * uiValue).toFixed(2))]);

        const wsResumen = XLSX.utils.aoa_to_sheet(resumenData);
        wsResumen['!cols'] = [{ wch: 20 }, { wch: 10 }, { wch: 12 }, { wch: 15 }, { wch: 18 }];
        XLSX.utils.book_append_sheet(wb, wsResumen, 'Resumen');

        // === HOJA DETALLE ===
        const headers = [
            'Fecha', 'Estado', 'Servicio', 'Pasajero', 'Chofer', 'Matrícula',
            'Depto Chofer', 'Teléfono', 'Dirección Origen', 'Dirección Destino',
            'KM Total', 'KM Zona', 'KM Fuera Zona', 'Paradas',
            'Precio Base', 'Precio Ajustado', 'Precio Final',
            'Costo Cancelación', 'Hora Pedido', 'Hora Aceptación',
            'Hora Pickup', 'Hora Inicio', 'Hora Llegada'
        ];

        const detailData = [headers];
        filtered.forEach(t => {
            const fecha = t.created_at ? new Date(t.created_at).toLocaleString('es-UY') : '';
            detailData.push([
                fecha,
                t.status || '',
                t.service || '',
                t.passenger_name || '',
                t.driver_name || '',
                t.driver_matricula || '',
                (t.driver_depto || '').toUpperCase(),
                t.driver_phone || '',
                t.origin_address || t.origin_name || '',
                t.dest_address || t.dest_name || '',
                t.total_km || 0,
                t.total_km_inside || 0,
                t.total_km_outside || 0,
                t.stops_count || 0,
                t.base_price || 0,
                t.adjusted_price || 0,
                t.final_price || 0,
                t.cancellation_fee || 0,
                t.created_at || '',
                t.accepted_at || '',
                t.pickup_at || '',
                t.started_at || '',
                t.completed_at || ''
            ]);
        });

        const wsDetalle = XLSX.utils.aoa_to_sheet(detailData);
        wsDetalle['!cols'] = [
            { wch: 20 }, { wch: 12 }, { wch: 10 }, { wch: 20 }, { wch: 20 }, { wch: 12 },
            { wch: 14 }, { wch: 15 }, { wch: 30 }, { wch: 30 },
            { wch: 10 }, { wch: 10 }, { wch: 14 }, { wch: 8 },
            { wch: 12 }, { wch: 14 }, { wch: 12 },
            { wch: 16 }, { wch: 22 }, { wch: 22 },
            { wch: 22 }, { wch: 22 }, { wch: 22 }
        ];
        XLSX.utils.book_append_sheet(wb, wsDetalle, 'Detalle');

        const fechaStr = new Date().toISOString().slice(0,10);
        XLSX.writeFile(wb, `UrbanFlow_Viajes_${fechaStr}.xlsx`);
    }

    document.getElementById('filterStatus').onchange = () => { currentPage = 1; renderTable(); };
    document.getElementById('filterService').onchange = () => { currentPage = 1; renderTable(); };
    document.getElementById('filterDateFrom').onchange = () => { currentPage = 1; renderTable(); };
    document.getElementById('filterDateTo').onchange = () => { currentPage = 1; renderTable(); };
    document.getElementById('filterSearch').oninput = () => { currentPage = 1; renderTable(); };

    cargarViajes();
    setInterval(cargarViajes, 30000);
</script>
<script src="/auth-check.js"></script>
</body>
</html>
