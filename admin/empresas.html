<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionar Empresas - UrbanFlow</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0d1117; color: #c9d1d9; }
        .header { background: #161b22; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #30363d; }
        .header h1 { font-size: 20px; color: #58a6ff; }
        .header .count { background: #1f6feb; color: white; padding: 2px 10px; border-radius: 12px; font-size: 13px; }
        .tabs { display: flex; gap: 0; background: #161b22; border-bottom: 1px solid #30363d; padding: 0 24px; }
        .tab { padding: 12px 20px; cursor: pointer; color: #8b949e; font-size: 14px; font-weight: 500; border-bottom: 2px solid transparent; transition: all 0.2s; }
        .tab:hover { color: #c9d1d9; }
        .tab.active { color: #58a6ff; border-bottom-color: #58a6ff; }
        .tab .badge { background: #da3633; color: white; padding: 1px 7px; border-radius: 10px; font-size: 11px; margin-left: 6px; }
        .container { padding: 20px 24px; }
        .search-bar { display: flex; gap: 12px; margin-bottom: 16px; }
        .search-bar input { flex: 1; padding: 10px 14px; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #c9d1d9; font-size: 14px; }
        .search-bar input:focus { border-color: #58a6ff; outline: none; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #161b22; padding: 10px 12px; text-align: left; font-size: 12px; color: #8b949e; text-transform: uppercase; border-bottom: 1px solid #30363d; }
        td { padding: 12px; border-bottom: 1px solid #21262d; font-size: 14px; vertical-align: middle; }
        tr:hover { background: #161b22; }
        .badge-status { padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }
        .badge-pendiente { background: #9e6a03; color: #f0e68c; }
        .badge-aprobado { background: #238636; color: #7ee787; }
        .badge-rechazado { background: #da3633; color: #ffa198; }
        .btn { padding: 6px 14px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; transition: opacity 0.2s; }
        .btn:hover { opacity: 0.85; }
        .btn-approve { background: #238636; color: white; }
        .btn-reject { background: #da3633; color: white; }
        .btn-suspend { background: #9e6a03; color: white; }
        .btn-reactivate { background: #1f6feb; color: white; }
        .btn-delete { background: #b62324; color: white; }
        .btn-view { background: #30363d; color: #c9d1d9; }
        .btn-whatsapp { background: #25d366; color: white; }
        .actions { display: flex; gap: 6px; flex-wrap: wrap; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 100; }
        .modal { background: #161b22; border: 1px solid #30363d; border-radius: 12px; width: 90%; max-width: 600px; max-height: 85vh; overflow-y: auto; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 24px; }
        .modal h2 { color: #58a6ff; margin-bottom: 16px; font-size: 18px; }
        .modal-field { margin-bottom: 12px; }
        .modal-field label { display: block; color: #8b949e; font-size: 12px; margin-bottom: 4px; text-transform: uppercase; }
        .modal-field .value { font-size: 14px; color: #c9d1d9; }
        .modal-close { float: right; background: none; border: none; color: #8b949e; font-size: 24px; cursor: pointer; }
        .modal-close:hover { color: #c9d1d9; }
        .empty { text-align: center; padding: 60px 20px; color: #484f58; }
        .empty .icon { font-size: 48px; margin-bottom: 12px; }
        .empresa-logo { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; background: #21262d; border: 1px solid #30363d; }
        .modal-photo { width: 100%; max-height: 200px; border-radius: 8px; object-fit: cover; margin-bottom: 12px; background: #21262d; }
        .modal-logo { width: 80px; height: 80px; border-radius: 12px; object-fit: cover; background: #21262d; border: 2px solid #30363d; margin-bottom: 12px; }
        .products-list { list-style: none; padding: 0; }
        .products-list li { padding: 8px 0; border-bottom: 1px solid #21262d; display: flex; justify-content: space-between; }
        .phone-link { color: #25d366; text-decoration: none; }
        .phone-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="header">
    <h1>Gestionar Empresas</h1>
    <span class="count" id="totalCount">0</span>
</div>

<div class="tabs">
    <div class="tab active" id="tab_pendiente" onclick="switchTab('pendiente')">Pendientes <span class="badge" id="badge_pendiente">0</span></div>
    <div class="tab" id="tab_aprobado" onclick="switchTab('aprobado')">Aprobados</div>
    <div class="tab" id="tab_rechazado" onclick="switchTab('rechazado')">Rechazados</div>
    <div class="tab" id="tab_todos" onclick="switchTab('todos')">Todos</div>
</div>

<div class="container">
    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Buscar por nombre, email, rubro..." oninput="renderTable()">
    </div>
    <table>
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Rubro</th>
                <th>Teléfono</th>
                <th>País</th>
                <th>Depto</th>
                <th>Estado</th>
                <th>Registro</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
    <div class="empty" id="emptyState">
        <div class="icon">📋</div>
        <p>No hay empresas en esta categoría</p>
    </div>
</div>

<!-- Modal Detalle -->
<div class="modal-overlay" id="detailModal">
    <div class="modal">
        <button class="modal-close" onclick="closeModal()">&times;</button>
        <h2 id="modalTitle">Detalle de Empresa</h2>
        <div id="modalContent"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/auth-check.js"></script>
<script>
    const SUPABASE_URL = "https://eyfgkopaamnkprzpwocz.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5Zmdrb3BhYW1ua3ByenB3b2N6Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3ODYxOTQ4MywiZXhwIjoyMDk0MTk1NDgzfQ.GIEEonN5-YGK1hBLloSun9WX-almQfnQW-0LdGOHmCk";
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let allEmpresas = [];
    let currentTab = 'pendiente';

    const rubros = { restaurante: '🍽️ Restaurante', farmacia: '💊 Farmacia', supermercado: '🛒 Supermercado', panaderia: '🥖 Panadería', tienda: '🏪 Tienda', otro: '📦 Otro' };
    const paises = { UY: '🇺🇾 Uruguay', AR: '🇦🇷 Argentina', CL: '🇨🇱 Chile', BR: '🇧🇷 Brasil', PY: '🇵🇾 Paraguay' };

    async function loadEmpresas() {
        const { data, error } = await sb.from('empresas').select('*').order('created_at', { ascending: false });
        if (error) { console.error(error); return; }
        allEmpresas = data || [];
        updateBadges();
        renderTable();
    }

    function updateBadges() {
        const pendientes = allEmpresas.filter(e => e.status === 'pendiente').length;
        document.getElementById('badge_pendiente').textContent = pendientes;
        document.getElementById('totalCount').textContent = allEmpresas.length;
    }

    function switchTab(tab) {
        currentTab = tab;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById('tab_' + tab).classList.add('active');
        renderTable();
    }

    function renderTable() {
        const search = document.getElementById('searchInput').value.toLowerCase();
        let filtered = allEmpresas;

        if (currentTab !== 'todos') {
            filtered = filtered.filter(e => (e.status || 'pendiente') === currentTab);
        }

        if (search) {
            filtered = filtered.filter(e =>
                (e.nombre || '').toLowerCase().includes(search) ||
                (e.email || '').toLowerCase().includes(search) ||
                (e.rubro || '').toLowerCase().includes(search) ||
                (e.telefono || '').includes(search)
            );
        }

        const tbody = document.getElementById('tableBody');
        const empty = document.getElementById('emptyState');

        if (filtered.length === 0) {
            tbody.innerHTML = '';
            empty.style.display = 'block';
            return;
        }

        empty.style.display = 'none';
        tbody.innerHTML = filtered.map(e => {
            const status = e.status || 'pendiente';
            const badgeClass = 'badge-' + status;
            const fecha = e.created_at ? new Date(e.created_at).toLocaleDateString('es-UY') : '-';
            return `<tr>
                <td><div style="display:flex;align-items:center;gap:10px">${e.logo_url ? `<img src="${e.logo_url}" class="empresa-logo">` : '<div class="empresa-logo" style="display:flex;align-items:center;justify-content:center;color:#484f58;font-size:18px">🏪</div>'}<div><strong>${e.nombre || '-'}</strong><br><small style="color:#8b949e">${e.email || ''}</small></div></div></td>
                <td>${rubros[e.rubro] || e.rubro}</td>
                <td>${e.telefono ? `<a href="https://wa.me/${e.telefono.replace(/[^0-9]/g, '')}" target="_blank" class="phone-link">${e.telefono}</a>` : '-'}</td>
                <td>${paises[e.pais] || e.pais || '-'}</td>
                <td>${e.depto || e.direccion || '-'}</td>
                <td><span class="badge-status ${badgeClass}">${status.toUpperCase()}</span></td>
                <td><small>${fecha}</small></td>
                <td><div class="actions">${renderActions(e)}</div></td>
            </tr>`;
        }).join('');
    }

    function renderActions(e) {
        const status = e.status || 'pendiente';
        const phone = (e.telefono || '').replace(/[^0-9]/g, '');
        const nombre = e.nombre || '';
        const nombrePersona = e.email || nombre;

        if (status === 'pendiente') {
            return `<button class="btn btn-approve" onclick="aprobar('${e.id}','${phone}','${nombrePersona}','${nombre}')">✅ Aprobar</button>
                    <button class="btn btn-reject" onclick="rechazar('${e.id}','${phone}','${nombrePersona}','${nombre}')">❌ Rechazar</button>
                    <button class="btn btn-delete" onclick="eliminar('${e.id}','${nombre}')">🗑</button>
                    <button class="btn btn-view" onclick="verDetalle('${e.id}')">👁 Ver</button>`;
        } else if (status === 'aprobado') {
            const panelUrl = e.rubro_tipo === 'comida' ? 'panel_empresa_deploy/index.html' : 'panel_ventas_deploy/index.html';
            return `<button class="btn btn-suspend" onclick="suspender('${e.id}','${phone}','${nombrePersona}','${nombre}')">🚫 Suspender</button>
                    <button class="btn btn-whatsapp" onclick="mandarWhatsApp('${phone}','${nombrePersona}')">💬 WhatsApp</button>
                    <a href="${panelUrl}?empresa=${e.id}" target="_blank" class="btn btn-view" style="text-decoration:none">🖥 Panel</a>
                    <button class="btn btn-view" onclick="verDetalle('${e.id}')">👁 Ver</button>
                    <button class="btn btn-delete" onclick="eliminar('${e.id}','${nombre}')">🗑</button>`;
        } else {
            return `<button class="btn btn-reactivate" onclick="aprobar('${e.id}','${phone}','${nombrePersona}','${nombre}')">✅ Re-activar</button>
                    <button class="btn btn-whatsapp" onclick="mandarWhatsApp('${phone}','${nombrePersona}')">💬 WhatsApp</button>
                    <button class="btn btn-view" onclick="verDetalle('${e.id}')">👁 Ver</button>
                    <button class="btn btn-delete" onclick="eliminar('${e.id}','${nombre}')">🗑</button>`;
        }
    }

    function phoneForWhatsApp(phone) {
        if (!phone) return '';
        return phone.replace(/[^0-9]/g, '');
    }

    function mandarWhatsApp(phone, name) {
        if (!phone) return;
        const msg = `Hola ${name}, te escribimos desde UrbanFlow.`;
        window.open(`https://wa.me/${phoneForWhatsApp(phone)}?text=${encodeURIComponent(msg)}`, '_blank');
    }

    async function aprobar(id, phone, name, nombreNegocio) {
        await sb.from('empresas').update({ status: 'aprobado', activo: true }).eq('id', id);
        const msg = `*¡HOLA ${name.toUpperCase()}!* 👋\n\nTu negocio *${nombreNegocio}* ha sido *APROBADO* en *URBANFLOW*.\n\nYa puedes ingresar a la aplicación con tu email y contraseña para comenzar a recibir pedidos.\n\n*¡Bienvenido a bordo!* 🎉`;
        if (phone) { window.open(`https://wa.me/${phoneForWhatsApp(phone)}?text=${encodeURIComponent(msg)}`, '_blank'); }
        loadEmpresas();
    }

    async function rechazar(id, phone, name, nombreNegocio) {
        const motivo = prompt("Motivo del rechazo:");
        if (!motivo) return;
        await sb.from('empresas').update({ status: 'rechazado', activo: false }).eq('id', id);
        const msg = `Hola ${name}, lamentamos informarte que tu registro de *${nombreNegocio}* en *URBANFLOW* no fue aprobado.\n\n*Motivo:* ${motivo}\n\nSi tenés dudas, podés contactarnos.`;
        if (phone) { window.open(`https://wa.me/${phoneForWhatsApp(phone)}?text=${encodeURIComponent(msg)}`, '_blank'); }
        loadEmpresas();
    }

    async function suspender(id, phone, name, nombreNegocio) {
        const motivo = prompt("Motivo de la suspensión:");
        if (!motivo) return;
        await sb.from('empresas').update({ status: 'rechazado', activo: false }).eq('id', id);
        const msg = `Hola ${name}, tu negocio *${nombreNegocio}* ha sido *SUSPENDIDO* temporalmente.\n\n*Motivo:* ${motivo}\n\nSi tenés dudas, contactanos.`;
        if (phone) { window.open(`https://wa.me/${phoneForWhatsApp(phone)}?text=${encodeURIComponent(msg)}`, '_blank'); }
        loadEmpresas();
    }

    async function eliminar(id, nombre) {
        if (!confirm(`¿Eliminar "${nombre}" y TODOS sus datos permanentemente?\n\nEsto borrara:\n- Empresa\n- Todos sus productos\n- Fotos del almacen\n- Datos de perfil`)) return;

        try {
            // 1. Borrar fotos de productos del Storage
            const { data: prods } = await sb.from('productos_empresa').select('foto_url').eq('empresa_id', id);
            if (prods) {
                for (const p of prods) {
                    if (p.foto_url && p.foto_url.includes('ecommerce_fotos')) {
                        const path = p.foto_url.split('ecommerce_fotos/')[1];
                        if (path) {
                            await sb.storage.from('ecommerce_fotos').remove([path]);
                        }
                    }
                }
            }

            // 2. Borrar productos
            await sb.from('productos_empresa').delete().eq('empresa_id', id);

            // 3. Borrar pedidos y detalles
            const { data: pedidos } = await sb.from('pedidos').select('id').eq('empresa_id', id);
            if (pedidos) {
                for (const p of pedidos) {
                    await sb.from('pedido_detalle').delete().eq('pedido_id', p.id);
                }
                await sb.from('pedidos').delete().eq('empresa_id', id);
            }

            // 4. Borrar empresa
            await sb.from('empresas').delete().eq('id', id);

            alert(`"${nombre}" eliminada permanentemente.`);
            loadEmpresas();
        } catch (err) {
            alert('Error eliminando: ' + err.message);
        }
    }

    function mandarWhatsApp(phone, name) {
        if (!phone) { alert('No hay número de teléfono registrado'); return; }
        const msg = `Hola ${name}, mensaje desde *URBANFLOW*.`;
        window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, '_blank');
    }

    async function verDetalle(id) {
        const e = allEmpresas.find(emp => emp.id === id);
        if (!e) return;
        const status = e.status || 'pendiente';
        const fecha = e.created_at ? new Date(e.created_at).toLocaleString('es-UY') : '-';

        document.getElementById('modalTitle').innerHTML = `
            <div style="display:flex;align-items:center;gap:12px">
                ${e.logo_url ? `<img src="${e.logo_url}" style="width:48px;height:48px;border-radius:10px;object-fit:cover;border:1px solid #30363d">` : '<div style="width:48px;height:48px;border-radius:10px;background:#21262d;display:flex;align-items:center;justify-content:center;font-size:24px">🏪</div>'}
                <div>${e.nombre}</div>
            </div>`;

        document.getElementById('modalContent').innerHTML = `
            ${e.foto_url ? `<img src="${e.foto_url}" class="modal-photo" onerror="this.style.display='none'">` : ''}

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px">
                <div class="modal-field"><label>Email</label><div class="value">${e.email || '-'}</div></div>
                <div class="modal-field"><label>Teléfono</label><div class="value">${e.telefono || '-'}</div></div>
                <div class="modal-field"><label>País</label><div class="value">${paises[e.pais] || e.pais || '-'}</div></div>
                <div class="modal-field"><label>Depto</label><div class="value">${e.depto || '-'}</div></div>
            </div>
            <div class="modal-field"><label>Dirección</label><div class="value">${e.direccion || '-'}</div></div>
            <div class="modal-field"><label>Rubro</label><div class="value">${rubros[e.rubro] || e.rubro} ${e.sub_rubro ? '/ ' + e.sub_rubro : ''}</div></div>
            <div class="modal-field"><label>Tipo</label><div class="value">${e.rubro_tipo === 'comida' ? '🍽️ Restaurante' : '🏪 Tienda'}</div></div>

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px">
                <div class="modal-field"><label>Presencia</label><div class="value">${e.tiene_local ? '📍 Local físico' : '❌ Sin local'} · ${e.vende_online ? '🌐 Vende online' : '❌ Sin online'}</div></div>
                <div class="modal-field"><label>Estado</label><div><select id="editStatus" style="width:100%;padding:8px;border-radius:6px;background:#0d1117;color:#c9d1d9;border:1px solid #30363d">
                    <option value="pendiente" ${status==='pendiente'?'selected':''}>Pendiente</option>
                    <option value="aprobado" ${status==='aprobado'?'selected':''}>Aprobado</option>
                    <option value="rechazado" ${status==='rechazado'?'selected':''}>Rechazado</option>
                </select></div></div>
                <div class="modal-field"><label>Registro</label><div class="value">${fecha}</div></div>
            </div>

            <div class="modal-field"><label>Horarios</label><div class="value">${e.horarios || '-'}</div></div>
            <div class="modal-field"><label>Descripción</label><div class="value">${e.descripcion || '-'}</div></div>

            ${e.status === 'aprobado' ? `<div class="modal-field"><label>Panel</label><div class="value"><a href="${e.rubro_tipo === 'comida' ? 'panel_empresa_deploy/index.html' : 'panel_ventas_deploy/index.html'}?empresa=${e.id}" target="_blank" style="color:#58a6ff">🖥 Abrir panel web →</a></div></div>` : ''}

            <div style="margin-top:16px;display:flex;gap:8px">
                <button class="btn btn-approve" onclick="saveEmpresa('${e.id}')">💾 Guardar cambios</button>
                ${e.telefono ? `<button class="btn btn-whatsapp" onclick="mandarWhatsApp('${e.telefono}','${e.nombre}')">💬 WhatsApp</button>` : ''}
            </div>
        `;
        document.getElementById('detailModal').style.display = 'block';
    }

    async function saveEmpresa(id) {
        const newStatus = document.getElementById('editStatus').value;
        await sb.from('empresas').update({ status: newStatus }).eq('id', id);
        closeModal();
        loadEmpresas();
    }

    function closeModal() { document.getElementById('detailModal').style.display = 'none'; }
    document.getElementById('detailModal').addEventListener('click', function(e) { if (e.target === this) closeModal(); });

    loadEmpresas();
</script>
<script src="/auth-check.js"></script>
</body>
</html>
