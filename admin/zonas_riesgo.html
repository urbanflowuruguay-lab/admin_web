<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UrbanFlow - Zonas de Riesgo</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Leaflet Geoman para dibujo premium de zonas -->
    <link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.css" />
    <script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0d1117; color: #c9d1d9; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 420px; background-color: #161b22; border-right: 1px solid #30363d; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 15px; height: 100vh; overflow-y: auto; }
        .map-container { flex-grow: 1; height: 100vh; position: relative; }
        #map { width: 100%; height: 100%; }
        
        h1 { font-size: 20px; color: #58a6ff; margin: 0; display: flex; align-items: center; gap: 10px; }
        
        .card { background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
        .card h3 { color: #f39c12; margin: 0; font-size: 14px; border-bottom: 1px solid #30363d; padding-bottom: 8px; }
        
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 11px; font-weight: bold; color: #8b949e; text-transform: uppercase; }
        
        input[type="text"], select, textarea { 
            padding: 10px; border-radius: 6px; border: 1px solid #30363d; 
            background: #161b22; color: white; width: 100%; box-sizing: border-box; font-size: 13px;
        }
        input:focus, select:focus, textarea:focus { border-color: #58a6ff; outline: none; }
        
        .btn-action { 
            background: #238636; color: white; border: none; padding: 12px; border-radius: 6px; 
            cursor: pointer; font-weight: bold; font-size: 13px; text-align: center; transition: 0.3s; width: 100%;
        }
        .btn-action:hover { background: #2ea043; }
        .btn-action:disabled { background: #21262d; color: #8b949e; cursor: not-allowed; }
        
        .btn-blue { background: #1f6feb; }
        .btn-blue:hover { background: #388bfd; }
        
        .btn-danger { background: #da3637; }
        .btn-danger:hover { background: #f85149; }

        .btn-manual { background: #1f6feb; color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; margin-top: 5px; text-align: center; }
        .btn-manual.active { background: #f39c12; }

        .list-container { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; max-height: 300px; overflow-y: auto; }
        .list-item { background: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 12px; display: flex; flex-direction: column; gap: 6px; cursor: pointer; transition: 0.2s; }
        .list-item:hover { border-color: #58a6ff; background: #161b22; }
        
        .badge { font-size: 10px; padding: 2px 8px; border-radius: 12px; font-weight: bold; width: fit-content; text-transform: uppercase; }
        .badge-pare { background: #ff443622; color: #ff4436; }
        .badge-ceda { background: #f39c1222; color: #f39c12; }
        .badge-radar { background: #e06c7522; color: #e06c75; }
        .badge-lomada { background: #58a6ff22; color: #58a6ff; }
        .badge-cruce { background: #ff8c0022; color: #ff8c00; }
        .badge-peaje { background: #c678dd22; color: #c678dd; }
        .badge-semaforo { background: #2ea04322; color: #2ea043; }
        .badge-accidente { background: #ff443622; color: #ff4436; }
        .badge-autodetenido { background: #e06c7522; color: #e06c75; }
        .badge-transitolento { background: #f39c1222; color: #f39c12; }
        .badge-controlpolicial { background: #1f6feb22; color: #1f6feb; }
        .badge-controlmunicipal { background: #58a6ff22; color: #58a6ff; }
        .badge-obrasenlavia { background: #ff8c0022; color: #ff8c00; }
        .badge-calleinundada { background: #2ecc7122; color: #2ecc71; }
        .badge-callecerrada { background: #da363722; color: #da3637; }
        .badge-semaforosrotos { background: #c678dd22; color: #c678dd; }
        .badge-cedaelpaso { background: #f39c1222; color: #f39c12; }
        .badge-viaferrea { background: #ff8c0022; color: #ff8c00; }

        .badge-critico { background: #ff4436; color: white; }
        .badge-alto { background: #ff8c00; color: white; }
        .badge-medio { background: #f39c12; color: white; }
        .badge-bajo { background: #2ecc71; color: white; }
        
        .btn-delete { background: #e06c75; color: white; border: none; padding: 4px 8px; border-radius: 4px; font-size: 10px; cursor: pointer; }
        .hint-box { font-size: 11px; background: #1f6feb22; border: 1px solid #1f6feb55; color: #58a6ff; padding: 10px; border-radius: 6px; display: none; font-weight: bold; }
        
        /* Loader */
        .loader-overlay { display: none; position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.7); z-index: 9999; align-items: center; justify-content: center; flex-direction: column; gap:15px; }
        .spinner { width: 50px; height: 50px; border: 5px solid #30363d; border-top-color: #58a6ff; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    
    .leaflet-tile-pane{filter:brightness(0.4) contrast(1.3) saturate(0.85)}
</style>
</head>
<body>

    <div class="loader-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <div style="font-weight: bold;" id="loadingText">Procesando...</div>
    </div>

    <div class="sidebar">
        <h1>🔴 Zonas de Riesgo</h1>
            <div class="card">
                <h3>🔴 Dibujar Zona de Riesgo / Zona Roja</h3>
                <p style="font-size: 12px; margin: 0; color: #8b949e;">Usa las herramientas de dibujo a la derecha del mapa para trazar polígonos.</p>
                
                <div class="form-group">
                    <label>Nombre de la Zona</label>
                    <input type="text" id="zonaName" placeholder="Ej: Zona Roja - Noche">
                </div>
                <div class="form-group">
                    <label>Descripción / Nota</label>
                    <textarea id="zonaDesc" rows="3" placeholder="Ej: Reportes de robos frecuentes en esta esquina"></textarea>
                </div>
                <div class="form-group">
                    <label>Nivel de Riesgo</label>
                    <select id="zonaLevel" onchange="updateZonaColor()">
                        <option value="medio">⚠️ Medio (Amarillo)</option>
                        <option value="bajo">🟢 Bajo (Verde)</option>
                        <option value="alto">🟠 Alto (Naranja)</option>
                        <option value="critico">🔴 Crítico / Zona Peligrosa</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Color</label>
                    <input type="color" id="zonaColor" value="#f39c12" style="height:40px; border:1px solid #30363d; background:transparent; width:100%; cursor:pointer;">
                </div>
                <button class="btn-action" id="btnSaveZona" onclick="saveZonaRiesgo()" disabled>
                    💾 Guardar Zona de Riesgo
                </button>
            </div>
            <div>
                <h3 style="font-size:14px; margin:0 0 5px 0; color:#e06c75;">🔴 Zonas de Riesgo Activas</h3>
                <div class="list-container" id="zonasList" style="max-height:500px;"></div>
            </div>
    </div>

    <div class="map-container">
        <div class="map-filters" style="
            position: absolute; top: 15px; left: 55px; z-index: 1000;
            background: rgba(22, 27, 34, 0.85); backdrop-filter: blur(10px);
            border: 1px solid #30363d; border-radius: 8px; padding: 8px 15px;
            display: flex; align-items: center; gap: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        ">
            <label style="display:flex; align-items:center; gap:5px; font-size:11px; color:#da3637; font-weight:bold; cursor:pointer;">
                <input type="checkbox" id="filter_zonas" checked onchange="filterMap()"> 🔴 Zonas de Riesgo
            </label>
        </div>
        <div id="map"></div>
    </div>

    <script>
        const SUPABASE_URL = "https://eyfgkopaamnkprzpwocz.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5Zmdrb3BhYW1ua3ByenB3b2N6Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3ODYxOTQ4MywiZXhwIjoyMDk0MTk1NDgzfQ.GIEEonN5-YGK1hBLloSun9WX-almQfnQW-0LdGOHmCk";
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const map = L.map('map').setView([-34.9011, -56.1645], 13);
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', { 
            maxZoom: 19, 
            maxNativeZoom: 19, 
            attribution: '&copy; Esri, HERE, Garmin, USGS, METI/NASA' 
        }).addTo(map);

        const zonasGroup = new L.FeatureGroup().addTo(map);
        let allZonas = [];
        let drawnZonaGeometry = null;

        map.pm.addControls({
            position: 'topright',
            drawMarker: false,
            drawCircleMarker: false,
            drawPolyline: false,
            drawRectangle: true,
            drawPolygon: true,
            drawCircle: false,
            editMode: true,
            dragMode: true,
            cutPolygon: false,
            removalMode: true
        });

        // Configurar idioma español en Geoman
        map.pm.setLang('es');

        // Escuchar cuando se crea un polígono/rectángulo
        map.on('pm:create', (e) => {
            const layer = e.layer;
            drawnZonaGeometry = layer.toGeoJSON().geometry;
            document.getElementById('btnSaveZona').disabled = false;

            // Cambiar color de dibujo según el selector actual
            const selectedColor = document.getElementById('zonaColor').value;
            layer.setStyle({
                fillColor: selectedColor,
                color: selectedColor,
                fillOpacity: 0.4
            });

            // Si dibuja otra cosa, remover la anterior para no confundir
            layer.on('pm:edit', () => {
                drawnZonaGeometry = layer.toGeoJSON().geometry;
            });
        });

        map.on('pm:remove', (e) => {
            drawnZonaGeometry = null;
            document.getElementById('btnSaveZona').disabled = true;
        });

        function updateZonaColor() {
            const level = document.getElementById('zonaLevel').value;
            const colorInput = document.getElementById('zonaColor');
            switch(level) {
                case 'bajo': colorInput.value = '#2ecc71'; break;
                case 'medio': colorInput.value = '#f39c12'; break;
                case 'alto': colorInput.value = '#e67e22'; break;
                case 'critico': colorInput.value = '#ff4436'; break;
            }
        }

        // Mostrar/Ocultar Loading
        function showLoading(text) {
            document.getElementById('loadingText').innerText = text;
            document.getElementById('loadingOverlay').style.display = 'flex';
        }
        function hideLoading() {
            document.getElementById('loadingOverlay').style.display = 'none';
        }

        // 1. Guardar Alerta Manual

        async function saveZonaRiesgo() {
            if (!drawnZonaGeometry) return;
            const nombre = document.getElementById('zonaName').value.trim() || "Zona sin nombre";
            const descripcion = document.getElementById('zonaDesc').value.trim();
            const nivel = document.getElementById('zonaLevel').value;
            const color = document.getElementById('zonaColor').value;

            showLoading("Guardando zona de riesgo...");
            const { error } = await sb.from('zonas_riesgo').insert({
                nombre: nombre,
                descripcion: descripcion,
                nivel: nivel,
                color: color,
                geometry: drawnZonaGeometry,
                country: 'UY'
            });

            hideLoading();
            if (error) {
                alert("Error al guardar la zona: " + error.message);
            } else {
                // Limpiar dibujo en el mapa
                map.eachLayer((layer) => {
                    if (layer.pm && layer !== map) {
                        map.removeLayer(layer);
                    }
                });
                drawnZonaGeometry = null;
                document.getElementById('zonaName').value = "";
                document.getElementById('zonaDesc').value = "";
                
                loadData();
            }
        }

        function filterMap() { renderMapElements(); }

        function toggleAllFilters(masterCheckbox) {
            document.getElementById('filter_zonas').checked = masterCheckbox.checked;
            filterMap();
        }

        async function loadData() {
            const { data } = await sb.from('zonas_riesgo').select('*').order('created_at', { ascending: false });
            allZonas = data || [];
            renderMapElements();
            renderListElements();
        }

        function renderMapElements() {
            zonasGroup.clearLayers();
            if (!document.getElementById('filter_zonas').checked) return;
            allZonas.forEach(zo => {
                if (!zo.geometry) return;
                const geojsonLayer = L.geoJSON(zo.geometry, {
                    style: {
                        color: zo.color || '#ff4436',
                        fillColor: zo.color || '#ff4436',
                        fillOpacity: 0.35,
                        weight: 2
                    }
                });
                const badgeNivel = `<span class="badge badge-${zo.nivel}">${zo.nivel}</span>`;
                geojsonLayer.bindPopup(`
                    <div style="font-family:sans-serif; font-size:12px; color: #fff;">
                        <h4 style="margin:0 0 5px 0; color:#58a6ff;">${zo.nombre}</h4>
                        <p style="margin:0 0 5px 0;">${zo.descripcion || 'Sin descripción'}</p>
                        Riesgo: ${badgeNivel}
                        <div style="display:flex; gap:6px; margin-top:8px;">
                            <button onclick="deleteZona(event, ${zo.id})" style="background:#da3637; color:#fff; border:none; padding:4px 10px; border-radius:4px; cursor:pointer; font-size:11px;">🗑️ Borrar</button>
                        </div>
                    </div>
                `);
                geojsonLayer.addTo(zonasGroup);
            });
        }

        function renderListElements() {
            const listZonas = document.getElementById('zonasList');
            listZonas.innerHTML = '';
            allZonas.forEach(zo => {
                const item = document.createElement('div');
                item.className = 'list-item';
                item.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span style="font-weight:bold; font-size:13px; color:#58a6ff;">${zo.nombre}</span>
                        <span class="badge badge-${zo.nivel}" style="background-color:${zo.color}">${zo.nivel}</span>
                    </div>
                    <div style="font-size:11px; color:#8b949e; margin-top:2px;">${zo.descripcion || 'Sin descripción'}</div>
                    <div style="display:flex; justify-content:flex-end; margin-top:6px;">
                        <button class="btn-delete" onclick="deleteZona(event, ${zo.id})">🗑️ Eliminar</button>
                    </div>
                `;
                item.onclick = () => {
                    if (zo.geometry) {
                        const bounds = L.geoJSON(zo.geometry).getBounds();
                        map.fitBounds(bounds, { padding: [50, 50] });
                    }
                };
                listZonas.appendChild(item);
            });
            if (allZonas.length === 0) {
                listZonas.innerHTML = '<div style="font-size:12px; color:#8b949e; text-align:center; padding:10px;">No hay zonas registradas</div>';
            }
        }

        async function deleteZona(e, id) {
            e.stopPropagation();
            if (!confirm("¿Deseas eliminar esta zona de riesgo definitivamente?")) return;

            showLoading("Eliminando zona...");
            const { error } = await sb.from('zonas_riesgo').delete().eq('id', id);
            hideLoading();

            if (error) {
                alert("Error al eliminar la zona: " + error.message);
            } else {
                loadData();
            }
        }

        loadData();
    </script>
</body>
</html>
