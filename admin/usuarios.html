<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/auth-check.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 25px; background-color: #0d1117; color: #c9d1d9; }
        h1 { color: #c9d1d9; }
        .header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #30363d; }
        .tab { padding: 12px 25px; cursor: pointer; transition: 0.3s; border-radius: 6px; font-weight: 600; color: #8b949e; }
        .tab:hover { background: #21262d; }
        .tab.active { background: #3b82f6; color: white; border-bottom: 2px solid #3b82f6; border-radius: 6px; }

        .table-container { background: #161b22; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); overflow-x: auto; border: 1px solid #30363d; }
        table { width: 100%; border-collapse: collapse; min-width: 1000px; }
        th { background: #21262d; color: #c9d1d9; font-weight: 600; text-align: left; padding: 15px; border-bottom: 2px solid #30363d; white-space: nowrap; }
        td { padding: 15px; border-bottom: 1px solid #30363d; font-size: 14px; color: #c9d1d9; }
        tr:hover { background-color: #21262d; }

        .badge { padding: 4px 10px; border-radius: 9999px; font-size: 12px; font-weight: 700; text-transform: uppercase; }
        .badge-active { background: #1a3a1a; color: #4ade80; }
        .badge-blocked { background: #3a1a1a; color: #f87171; }

        .btn-group { display: flex; gap: 8px; }
        .btn { padding: 8px 14px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; transition: 0.2s; }
        .btn-block { background: #f59e0b; color: white; }
        .btn-block:hover { background: #d97706; }
        .btn-unblock { background: #10b981; color: white; }
        .btn-unblock:hover { background: #059669; }
        .btn-delete { background: #ef4444; color: white; }
        .btn-delete:hover { background: #dc2626; }

        .id-text { font-family: monospace; color: #8b949e; font-size: 12px; }
    </style>
</head>
<body>

    <div class="header-flex">
        <h1 style="margin:0;">👥 Gestión de Pasajeros</h1>
        <div id="countInfo" style="color: #64748b; font-weight: 500;"></div>
    </div>
    
    <div class="tabs">
        <div id="tabActivos" class="tab active" onclick="switchTab('aprobado')">Pasajeros Activos</div>
        <div id="tabBloqueados" class="tab" onclick="switchTab('bloqueado')">Lista de Bloqueados</div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Fecha Registro</th>
                    <th>Nombre Completo</th>
                    <th>Correo Electrónico</th>
                    <th>Teléfono</th>
                    <th>País</th>
                    <th>Estado</th>
                    <th>ID Usuario</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="userBody"></tbody>
        </table>
    </div>

    <script>
        const SUPABASE_URL = "https://eyfgkopaamnkprzpwocz.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5Zmdrb3BhYW1ua3ByenB3b2N6Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3ODYxOTQ4MywiZXhwIjoyMDk0MTk1NDgzfQ.GIEEonN5-YGK1hBLloSun9WX-almQfnQW-0LdGOHmCk";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        let currentStatus = 'aprobado';

        function switchTab(status) {
            currentStatus = status;
            document.getElementById('tabActivos').className = status === 'aprobado' ? 'tab active' : 'tab';
            document.getElementById('tabBloqueados').className = status === 'bloqueado' ? 'tab active' : 'tab';
            loadUsers();
        }

        async function loadUsers() {
            const { data, error } = await supabaseClient
                .from('perfiles')
                .select('*')
                .eq('type', 'pasajero')
                .eq('status', currentStatus)
                .order('created_at', { ascending: false });

            if (error) return;

            document.getElementById('countInfo').innerText = `${data.length} usuarios encontrados`;
            const body = document.getElementById('userBody');
            body.innerHTML = data.map(u => {
                const date = new Date(u.created_at).toLocaleDateString('es-ES', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
                return `
                    <tr>
                        <td style="color: #64748b;">${date}</td>
                        <td style="font-weight: 600; color: #0f172a;">${u.full_name}</td>
                        <td>${u.email}</td>
                        <td>${u.phone || '-'}</td>
                        <td>${u.country || '-'}</td>
                        <td>
                            <span class="badge ${u.status === 'aprobado' ? 'badge-active' : 'badge-blocked'}">
                                ${u.status === 'aprobado' ? 'Activo' : 'Bloqueado'}
                            </span>
                        </td>
                        <td class="id-text">${u.id.substring(0,8)}...</td>
                        <td>
                            <div class="btn-group">
                                ${currentStatus === 'aprobado' 
                                    ? `<button class="btn btn-block" onclick="updateUserStatus('${u.id}', 'bloqueado')">Bloquear</button>`
                                    : `<button class="btn btn-unblock" onclick="updateUserStatus('${u.id}', 'aprobado')">Habilitar</button>`
                                }
                                <button class="btn btn-delete" onclick="deleteUser('${u.id}', '${u.full_name}')">Eliminar</button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        async function updateUserStatus(id, newStatus) {
            await supabaseClient.from('perfiles').update({ status: newStatus }).eq('id', id);
            loadUsers();
        }

        async function deleteUser(id, name) {
            if(confirm(`⚠️ ¿ELIMINAR A ${name.toUpperCase()}?\n\nSe borrarán TODOS los datos y fotos del servidor.`)) {
                try {
                    // 1. Borrar fotos de perfil (si existen en el bucket perfiles)
                    const { data: files } = await supabaseClient.storage.from('perfiles').list(id);
                    if (files && files.length > 0) {
                        const filesToRemove = files.map(f => `${id}/${f.name}`);
                        await supabaseClient.storage.from('perfiles').remove(filesToRemove);
                    }

                    // 2. Borrar documentos (si es que tuviera en documentos_choferes por error o cambio de rol)
                    const { data: docFiles } = await supabaseClient.storage.from('documentos_choferes').list(id);
                    if (docFiles && docFiles.length > 0) {
                        const docsToRemove = docFiles.map(f => `${id}/${f.name}`);
                        await supabaseClient.storage.from('documentos_choferes').remove(docsToRemove);
                    }

                    // 3. Borrar de la DB
                    await supabaseClient.from('perfiles').delete().eq('id', id);
                    
                    alert("Usuario y archivos eliminados.");
                    loadUsers();
                } catch (e) {
                    alert("Error: " + e.message);
                }
            }
        }
        loadUsers();
    </script>
<script src="/auth-check.js"></script>
</body>
</html>
