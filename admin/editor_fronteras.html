<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor de Fronteras de Departamentos</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.16.0/dist/leaflet-geoman.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0d1117; color: #c9d1d9; }
        
        #map { width: 100%; height: calc(100vh - 60px); }
        
        .top-bar {
            background: #161b22;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid #30363d;
            height: 60px;
        }
        .top-bar h1 { font-size: 18px; color: #58a6ff; flex-grow: 1; }
        .top-bar select, .top-bar button {
            background: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
        }
        .top-bar select:hover, .top-bar button:hover { background: #30363d; }
        .top-bar button.danger { border-color: #f85149; color: #f85149; }
        .top-bar button.danger:hover { background: #f8514922; }
        .top-bar button.save { background: #238636; border-color: #238636; color: #fff; }
        .top-bar button.save:hover { background: #2ea043; }
        
        .status-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #161b22;
            padding: 8px 20px;
            font-size: 12px;
            color: #8b949e;
            border-top: 1px solid #30363d;
            z-index: 1000;
            display: flex;
            gap: 20px;
        }
        .status-bar span { color: #58a6ff; }
        
        .sidebar-list {
            position: fixed;
            top: 60px;
            right: 0;
            width: 280px;
            height: calc(100vh - 85px);
            background: #0d1117;
            border-left: 1px solid #30363d;
            overflow-y: auto;
            z-index: 999;
            padding: 10px;
        }
        .sidebar-list h3 { font-size: 13px; color: #8b949e; margin: 10px 0 8px 5px; text-transform: uppercase; letter-spacing: 1px; }
        .dept-item {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 10px 12px;
            margin-bottom: 6px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .dept-item:hover { border-color: #58a6ff; }
        .dept-item.selected { border-color: #58a6ff; background: #161b22ee; }
        .dept-item .name { font-size: 13px; font-weight: bold; }
        .dept-item .country { font-size: 11px; color: #8b949e; }
        .dept-item .delete-btn {
            background: none;
            border: none;
            color: #f85149;
            cursor: pointer;
            font-size: 16px;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .dept-item .delete-btn:hover { background: #f8514922; }
        
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 24px;
            width: 360px;
        }
        .modal h2 { font-size: 16px; color: #58a6ff; margin-bottom: 16px; }
        .modal label { font-size: 12px; color: #8b949e; display: block; margin-bottom: 4px; }
        .modal input, .modal select {
            width: 100%;
            background: #0d1117;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 12px;
        }
        .modal input:focus, .modal select:focus { border-color: #58a6ff; outline: none; }
        .modal .btn-row { display: flex; gap: 10px; margin-top: 8px; }
        .modal .btn-row button { flex: 1; padding: 10px; border-radius: 6px; border: none; cursor: pointer; font-size: 13px; font-weight: bold; }
        .modal .btn-cancel { background: #21262d; color: #c9d1d9; }
        .modal .btn-save { background: #238636; color: #fff; }

        /* Custom Leaflet toolbar */
        .leaflet-pm-toolbar .leaflet-pm-icon-polygon { background: #58a6ff !important; }
        
        .tab-buttons { display: flex; gap: 4px; }
        .tab-btn {
            background: #21262d;
            color: #8b949e;
            border: 1px solid #30363d;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
        }
        .tab-btn.active { background: #58a6ff22; color: #58a6ff; border-color: #58a6ff; }
        .tab-btn:hover:not(.active) { background: #30363d; }
        
        .sidebar-section { display: none; }
        .sidebar-section.active { display: block; }
    </style>
</head>
<body>

<div class="top-bar">
    <h1>🗺️ Editor de Fronteras y Barrios</h1>
    <select id="countrySelect">
        <option value="UY">🇺🇾 Uruguay</option>
        <option value="AR">🇦🇷 Argentina</option>
        <option value="CL">🇨🇱 Chile</option>
        <option value="BR">🇧🇷 Brasil</option>
        <option value="PY">🇵🇾 Paraguay</option>
    </select>
    <div class="tab-buttons">
        <button class="tab-btn active" id="tabDepts" onclick="switchTab('depts')">Departamentos</button>
        <button class="tab-btn" id="tabBarrios" onclick="switchTab('barrios')">Barrios</button>
    </div>
    <button onclick="toggleSidebar()">📋 Lista</button>
    <button class="save" onclick="saveAll()">💾 Guardar Todo</button>
</div>

<div id="map"></div>

<div class="sidebar-list" id="sidebarList" style="display:none;">
    <div class="sidebar-section active" id="sidebarDepts">
        <h3>Departamentos guardados</h3>
        <div id="deptList"></div>
    </div>
    <div class="sidebar-section" id="sidebarBarrios">
        <h3>Barrios guardados</h3>
        <div id="barrioList"></div>
    </div>
</div>

<div class="status-bar">
    <div>Pais: <span id="statusCountry">UY</span></div>
    <div>Departamentos: <span id="statusCount">0</span></div>
    <div>Barrios: <span id="statusCountBarrios">0</span></div>
    <div id="statusMsg">Listo para dibujar</div>
</div>

<!-- Modal para nombre del departamento -->
<div class="modal-overlay" id="modalName">
    <div class="modal">
        <h2>Nombre del Departamento</h2>
        <label>País</label>
        <select id="modalCountry">
            <option value="UY">Uruguay</option>
            <option value="AR">Argentina</option>
            <option value="CL">Chile</option>
            <option value="BR">Brasil</option>
            <option value="PY">Paraguay</option>
        </select>
        <label>Nombre</label>
        <input type="text" id="modalDeptName" placeholder="Ej: Montevideo" />
        <div class="btn-row">
            <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
            <button class="btn-save" onclick="confirmPolygon()">Guardar</button>
        </div>
    </div>
</div>

<!-- Modal para nombre del barrio -->
<div class="modal-overlay" id="modalBarrio">
    <div class="modal">
        <h2>Nombre del Barrio</h2>
        <label>Departamento</label>
        <input type="text" id="modalBarrioDept" placeholder="Ej: Montevideo" />
        <label>Nombre del barrio</label>
        <input type="text" id="modalBarrioName" placeholder="Ej: Ciudad Vieja" />
        <div class="btn-row">
            <button class="btn-cancel" onclick="closeBarrioModal()">Cancelar</button>
            <button class="btn-save" onclick="confirmBarrio()">Guardar</button>
        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.16.0/dist/leaflet-geoman.min.js"></script>
<script>
const SUPABASE_URL = "https://eyfgkopaamnkprzpwocz.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5Zmdrb3BhYW1ua3ByenB3b2N6Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3ODYxOTQ4MywiZXhwIjoyMDk0MTk1NDgzfQ.GIEEonN5-YGK1hBLloSun9WX-almQfnQW-0LdGOHmCk";

const COLORS = ['#58a6ff','#f0883e','#3fb950','#d2a8ff','#f778ba','#79c0ff','#ffa657','#7ee787','#ff7b72','#d29922'];
let colorIndex = 0;
let savedPolygons = []; // depts
let savedBarrios = []; // barrios
let pendingPolygon = null;
let pendingBarrio = null;
let currentTab = 'depts';

// Map
const map = L.map('map', {
    center: [-34.9, -56.2],
    zoom: 7,
    zoomControl: true
});

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap',
    maxZoom: 19
}).addTo(map);

// Geoman controls
map.pm.addControls({
    position: 'topleft',
    drawMarker: false,
    drawPolyline: false,
    drawCircle: false,
    drawCircleMarker: false,
    drawRectangle: false,
    drawText: false,
    editMode: true,
    dragMode: true,
    cutPolygon: false,
    removalMode: true,
    rotateMode: false
});

// When a polygon is created
map.on('pm:create', (e) => {
    const layer = e.layer;
    if (currentTab === 'depts') {
        pendingPolygon = layer;
        document.getElementById('modalCountry').value = document.getElementById('countrySelect').value;
        document.getElementById('modalDeptName').value = '';
        document.getElementById('modalName').classList.add('active');
        document.getElementById('modalDeptName').focus();
    } else {
        pendingBarrio = layer;
        document.getElementById('modalBarrioDept').value = '';
        document.getElementById('modalBarrioName').value = '';
        document.getElementById('modalBarrio').classList.add('active');
        document.getElementById('modalBarrioDept').focus();
    }
});

// Confirm department polygon
function confirmPolygon() {
    const deptName = document.getElementById('modalDeptName').value.trim();
    const country = document.getElementById('modalCountry').value;
    if (!deptName) { alert('Ingresá el nombre del departamento'); return; }
    
    const color = COLORS[colorIndex % COLORS.length];
    colorIndex++;
    
    pendingPolygon.setStyle({ color: color, fillColor: color, fillOpacity: 0.2, weight: 2 });
    
    const geojson = pendingPolygon.toGeoJSON();
    savedPolygons.push({
        id: null,
        country: country,
        department: deptName,
        geometry: geojson.geometry,
        layer: pendingPolygon
    });
    
    pendingPolygon.bindPopup(`<b>${deptName}</b><br>${country}`);
    pendingPolygon = null;
    
    closeModal();
    refreshList();
    document.getElementById('statusMsg').textContent = `"${deptName}" agregado (sin guardar aún)`;
}

function closeModal() {
    document.getElementById('modalName').classList.remove('active');
    pendingPolygon = null;
}

// Confirm barrio
function confirmBarrio() {
    const dept = document.getElementById('modalBarrioDept').value.trim();
    const name = document.getElementById('modalBarrioName').value.trim();
    if (!dept) { alert('Ingresá el departamento'); return; }
    if (!name) { alert('Ingresá el nombre del barrio'); return; }
    
    const color = COLORS[colorIndex % COLORS.length];
    colorIndex++;
    
    pendingBarrio.setStyle({ color: color, fillColor: color, fillOpacity: 0.25, weight: 2 });
    
    const geojson = pendingBarrio.toGeoJSON();
    const center = pendingBarrio.getBounds().getCenter();
    savedBarrios.push({
        id: null,
        name: name,
        department: dept,
        country: document.getElementById('countrySelect').value,
        geometry: geojson.geometry,
        center_lat: center.lat,
        center_lng: center.lng,
        layer: pendingBarrio
    });
    
    pendingBarrio.bindPopup(`<b>${name}</b><br>${dept}`);
    pendingBarrio = null;
    
    closeBarrioModal();
    refreshBarrioList();
    document.getElementById('statusMsg').textContent = `"${name}" agregado (sin guardar aún)`;
}

function closeBarrioModal() {
    document.getElementById('modalBarrio').classList.remove('active');
    pendingBarrio = null;
}

// Enter to confirm
document.getElementById('modalDeptName').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') confirmPolygon();
    if (e.key === 'Escape') closeModal();
});
document.getElementById('modalBarrioName').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') confirmBarrio();
    if (e.key === 'Escape') closeBarrioModal();
});

// Refresh department sidebar list
function refreshList() {
    const list = document.getElementById('deptList');
    document.getElementById('statusCount').textContent = savedPolygons.length;
    document.getElementById('statusCountry').textContent = document.getElementById('countrySelect').value;
    
    list.innerHTML = savedPolygons.map((p, i) => `
        <div class="dept-item" onclick="focusPolygon(${i})">
            <div>
                <div class="name" style="color:${COLORS[i % COLORS.length]}">${p.department}</div>
                <div class="country">${p.country}</div>
            </div>
            <button class="delete-btn" onclick="event.stopPropagation(); deletePolygon(${i})">✕</button>
        </div>
    `).join('');
}

// Refresh barrio sidebar list
function refreshBarrioList() {
    const list = document.getElementById('barrioList');
    document.getElementById('statusCountBarrios').textContent = savedBarrios.length;
    
    list.innerHTML = savedBarrios.map((p, i) => `
        <div class="dept-item" onclick="focusBarrio(${i})">
            <div>
                <div class="name" style="color:${COLORS[i % COLORS.length]}">${p.name}</div>
                <div class="country">${p.department}</div>
            </div>
            <button class="delete-btn" onclick="event.stopPropagation(); deleteBarrio(${i})">✕</button>
        </div>
    `).join('');
}

function focusPolygon(index) {
    const p = savedPolygons[index];
    if (p.layer) map.fitBounds(p.layer.getBounds(), { padding: [50, 50] });
}

function focusBarrio(index) {
    const p = savedBarrios[index];
    if (p.layer) map.fitBounds(p.layer.getBounds(), { padding: [50, 50] });
}

function deletePolygon(index) {
    const p = savedPolygons[index];
    if (p.layer) map.removeLayer(p.layer);
    savedPolygons.splice(index, 1);
    refreshList();
    document.getElementById('statusMsg').textContent = 'Departamento eliminado';
}

function deleteBarrio(index) {
    const p = savedBarrios[index];
    if (p.layer) map.removeLayer(p.layer);
    savedBarrios.splice(index, 1);
    refreshBarrioList();
    document.getElementById('statusMsg').textContent = 'Barrio eliminado';
}

function toggleSidebar() {
    const sb = document.getElementById('sidebarList');
    sb.style.display = sb.style.display === 'none' ? 'block' : 'none';
}

// Tab switching
function switchTab(tab) {
    currentTab = tab;
    document.getElementById('tabDepts').classList.toggle('active', tab === 'depts');
    document.getElementById('tabBarrios').classList.toggle('active', tab === 'barrios');
    document.getElementById('sidebarDepts').classList.toggle('active', tab === 'depts');
    document.getElementById('sidebarBarrios').classList.toggle('active', tab === 'barrios');
    
    if (tab === 'barrios' && savedBarrios.length === 0) {
        refreshBarrioList();
    }
}

// Save all to Supabase
async function saveAll() {
    document.getElementById('statusMsg').textContent = 'Guardando...';
    const country = document.getElementById('countrySelect').value;
    let barrioError = '';
    
    try {
        // Save departments
        await fetch(`${SUPABASE_URL}/rest/v1/department_boundaries?country=eq.${country}`, {
            method: 'DELETE',
            headers: {
                'apikey': SUPABASE_KEY,
                'Authorization': `Bearer ${SUPABASE_KEY}`,
                'Content-Type': 'application/json'
            }
        });
        
        const deptRows = savedPolygons.map(p => ({
            country: p.country,
            department: p.department,
            geometry: p.geometry
        }));
        
        if (deptRows.length > 0) {
            const resp = await fetch(`${SUPABASE_URL}/rest/v1/department_boundaries`, {
                method: 'POST',
                headers: {
                    'apikey': SUPABASE_KEY,
                    'Authorization': `Bearer ${SUPABASE_KEY}`,
                    'Content-Type': 'application/json',
                    'Prefer': 'return=minimal'
                },
                body: JSON.stringify(deptRows)
            });
            if (!resp.ok) throw new Error('Departments: ' + await resp.text());
        }
        
        // Save barrios (skip if table doesn't exist)
        const barrioRows = savedBarrios.map(p => ({
            name: p.name,
            department: p.department,
            country: p.country,
            geometry: p.geometry,
            center_lat: p.center_lat,
            center_lng: p.center_lng
        }));
        if (barrioRows.length > 0) {
            try {
                const delResp = await fetch(`${SUPABASE_URL}/rest/v1/neighborhoods?country=eq.${country}`, {
                    method: 'DELETE',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json'
                    }
                });
                if (!delResp.ok) throw new Error('Delete barrios failed');
                
                const resp = await fetch(`${SUPABASE_URL}/rest/v1/neighborhoods`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=minimal'
                    },
                    body: JSON.stringify(barrioRows)
                });
                if (!resp.ok) throw new Error('Barrios: ' + await resp.text());
            } catch (e) {
                barrioError = '⚠️ Barrios no guardados (creá la tabla neighborhoods en Supabase). ';
            }
        }
        
        document.getElementById('statusMsg').textContent = `${barrioError}✅ Guardado: ${deptRows.length} depto(s), ${barrioRows.length} barrio(s)`;
    } catch (e) {
        document.getElementById('statusMsg').textContent = `❌ Error: ${e.message}`;
        console.error(e);
    }
}

// Load existing departments from Supabase
async function loadExisting() {
    const country = document.getElementById('countrySelect').value;
    document.getElementById('statusMsg').textContent = `Cargando ${country}...`;
    
    try {
        const resp = await fetch(`${SUPABASE_URL}/rest/v1/department_boundaries?country=eq.${country}&select=*`, {
            headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
        });
        const data = await resp.json();
        
        savedPolygons.forEach(p => { if (p.layer) map.removeLayer(p.layer); });
        savedPolygons = [];
        colorIndex = 0;
        
        data.forEach(row => {
            const color = COLORS[colorIndex % COLORS.length];
            colorIndex++;
            const layer = L.geoJSON(row.geometry, {
                style: { color: color, fillColor: color, fillOpacity: 0.2, weight: 2 }
            }).addTo(map);
            layer.bindPopup(`<b>${row.department}</b><br>${row.country}`);
            
            savedPolygons.push({
                id: row.id, country: row.country, department: row.department,
                geometry: row.geometry, layer: layer
            });
        });
        
        if (savedPolygons.length > 0) {
            const group = L.featureGroup(savedPolygons.map(p => p.layer));
            map.fitBounds(group.getBounds(), { padding: [50, 50] });
        }
        
        refreshList();
        
        // Also load barrios
        await loadBarrios(country);
        
        document.getElementById('statusMsg').textContent = `✅ ${data.length} depto(s) cargado(s)`;
    } catch (e) {
        document.getElementById('statusMsg').textContent = `❌ Error: ${e.message}`;
        console.error(e);
    }
}

// Load barrios from Supabase
async function loadBarrios(country) {
    try {
        const resp = await fetch(`${SUPABASE_URL}/rest/v1/neighborhoods?country=eq.${country}&select=*`, {
            headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
        });
        if (!resp.ok) {
            console.warn('neighborhoods table not found (404). Create it in Supabase SQL Editor.');
            refreshBarrioList();
            return;
        }
        const data = await resp.json();
        if (!Array.isArray(data)) {
            console.warn('neighborhoods: unexpected response', data);
            refreshBarrioList();
            return;
        }
        
        savedBarrios.forEach(p => { if (p.layer) map.removeLayer(p.layer); });
        savedBarrios = [];
        
        data.forEach(row => {
            const color = COLORS[colorIndex % COLORS.length];
            colorIndex++;
            const layer = L.geoJSON(row.geometry, {
                style: { color: color, fillColor: color, fillOpacity: 0.25, weight: 2 }
            }).addTo(map);
            layer.bindPopup(`<b>${row.name}</b><br>${row.department}`);
            
            savedBarrios.push({
                id: row.id, name: row.name, department: row.department,
                country: row.country, geometry: row.geometry,
                center_lat: row.center_lat, center_lng: row.center_lng,
                layer: layer
            });
        });
        
        refreshBarrioList();
    } catch (e) {
        console.warn('Error loading barrios:', e.message);
        refreshBarrioList();
    }
}

// Country change
document.getElementById('countrySelect').addEventListener('change', loadExisting);

// Load on start
loadExisting();
</script>
</body>
</html>
