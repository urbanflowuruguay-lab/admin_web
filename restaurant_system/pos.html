<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UrbanFlow POS - Cajero</title>
    <link rel="icon" type="image/png" href="./servicio.png">
    <link rel="apple-touch-icon" href="./servicio.png">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0a0a0a">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg: #0a0a0a;
            --bg2: #111111;
            --bg3: #1a1a1a;
            --bg4: #222222;
            --text: #ffffff;
            --text2: #a0a0a0;
            --accent: #d4af37;
            --accent2: #b8962e;
            --green: #4caf50;
            --red: #f44336;
            --blue: #2196f3;
            --orange: #ff9800;
            --purple: #9c27b0;
            --border: #333333;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); height: 100vh; height: 100dvh; overflow: hidden; }

        /* LOGIN */
        .login-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: var(--bg);
        }
        .login-box {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 40px;
            width: 350px;
            max-width: calc(100vw - 32px);
            text-align: center;
        }
        .login-box h1 { color: var(--accent); margin-bottom: 10px; font-size: 24px; }
        .login-box p { color: var(--text2); margin-bottom: 30px; font-size: 14px; }
        .pin-display {
            font-size: 36px;
            font-weight: 700;
            letter-spacing: 15px;
            margin-bottom: 20px;
            min-height: 50px;
            color: var(--accent);
        }
        .pin-pad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .pin-btn {
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            font-size: 24px;
            font-weight: 700;
            color: var(--text);
            cursor: pointer;
            transition: all 0.2s;
        }
        .pin-btn:hover { background: var(--bg4); border-color: var(--accent); }
        .pin-btn:active { transform: scale(0.95); }
        .pin-btn.clear { background: var(--red); color: white; }
        .pin-btn.enter { background: var(--accent); color: var(--bg); grid-column: span 2; }
        .pin-error { color: var(--red); font-size: 12px; margin-top: 10px; }

        /* APP */
        .app { display: none; height: 100vh; height: 100dvh; }
        .app.active { display: grid; grid-template-columns: 1fr 380px; grid-template-rows: minmax(0, 1fr); }
        .app.active > * { min-height: 0; min-width: 0; }

        /* LEFT - PRODUCTS */
        .products-panel {
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
            background: var(--bg);
            border-right: 1px solid var(--border);
        }

        /* Top bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            padding: 12px 20px;
            background: var(--bg2);
            border-bottom: 1px solid var(--border);
        }
        .top-bar-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .top-bar h2 { font-size: 16px; color: var(--accent); }
        .mesa-btn {
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 16px;
            color: var(--text);
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .mesa-btn:hover { border-color: var(--accent); }
        .mesa-btn.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }
        .top-bar-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .user-badge {
            background: var(--bg3);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-logout {
            background: var(--red);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
        }

        /* Categories bar */
        .categories-bar {
            display: flex;
            gap: 8px;
            padding: 12px 20px;
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
            background: var(--bg2);
            border-bottom: 1px solid var(--border);
        }
        .cat-btn {
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 8px 16px;
            color: var(--text);
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
            transition: all 0.2s;
        }
        .cat-btn:hover { border-color: var(--accent); }
        .cat-btn.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }

        /* Products grid - teclas cuadradas compactas */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 8px;
            padding: 12px;
            overflow-y: auto;
            flex: 1;
            min-height: 0;
        }
        .product-card {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            aspect-ratio: 1 / 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .product-card:hover { border-color: var(--accent); transform: translateY(-2px); }
        .product-card:active { transform: scale(0.97); }
        .product-card.low-stock { border-color: var(--red); }
        .product-img {
            flex: 1;
            min-height: 0;
            background: var(--bg3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            overflow: hidden;
        }
        .product-img img { width: 100%; height: 100%; object-fit: cover; }
        .product-name { font-size: 11px; font-weight: 600; padding: 4px 4px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .product-price { color: var(--accent); font-size: 13px; font-weight: 700; padding: 0 4px 6px; }

        /* RIGHT - ORDER */
        .order-panel {
            display: flex;
            flex-direction: column;
            min-height: 0;
            background: var(--bg2);
        }

        .order-header {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .order-header h3 { font-size: 16px; }
        .order-mesa {
            background: var(--bg3);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            color: var(--accent);
        }

        .order-items {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 10px 20px;
        }
        .order-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }
        .order-item-qty {
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 4px 8px;
            font-weight: 700;
            font-size: 14px;
            min-width: 35px;
            text-align: center;
        }
        .order-item-info { flex: 1; }
        .order-item-name { font-size: 13px; font-weight: 500; }
        .order-item-price { font-size: 12px; color: var(--text2); }
        .order-item-total { font-weight: 700; font-size: 14px; }
        .order-item-remove {
            background: none;
            border: none;
            color: var(--red);
            cursor: pointer;
            font-size: 16px;
            padding: 5px;
        }
        .order-empty {
            text-align: center;
            padding: 40px 20px;
            color: var(--text2);
        }
        .order-empty i { font-size: 40px; margin-bottom: 10px; display: block; }

        .order-footer {
            padding: 15px 20px;
            border-top: 1px solid var(--border);
            background: var(--bg3);
        }
        .order-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 13px;
        }
        .order-row.total {
            font-size: 18px;
            font-weight: 700;
            color: var(--accent);
            padding-top: 10px;
            border-top: 1px solid var(--border);
            margin-top: 10px;
        }
        .order-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }
        .btn-order {
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-order:hover { transform: translateY(-1px); }
        .btn-cash { background: var(--green); color: white; }
        .btn-mp { background: var(--blue); color: white; grid-column: span 2; }

        /* TABLES MAP */
        .tables-map {
            display: none;
            padding: 20px;
            flex: 1;
            min-height: 0;
            overflow-y: auto;
        }
        .tables-map.active { display: block; }
        .tables-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 12px;
        }
        .table-cell {
            aspect-ratio: 1;
            background: var(--bg3);
            border: 2px solid var(--border);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 12px;
        }
        .table-cell:hover { border-color: var(--accent); }
        .table-cell.disponible { border-color: var(--green); }
        .table-cell.ocupada { border-color: var(--red); background: rgba(244, 67, 54, 0.1); }
        .table-cell.reservada { border-color: var(--orange); background: rgba(255, 152, 0, 0.1); }
        .table-cell-number { font-size: 20px; font-weight: 700; }
        .table-cell-status { font-size: 10px; color: var(--text2); margin-top: 4px; }
        @keyframes blinkTab { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
        .tab-blink { animation: blinkTab 0.9s infinite; }

        /* VARIANT MODAL */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.active { display: flex; }
        .variant-modal {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            width: 350px;
            max-width: calc(100vw - 32px);
            max-height: 80vh;
            overflow-y: auto;
        }
        .variant-modal h3 { margin-bottom: 15px; font-size: 18px; }
        .variant-btn {
            width: 100%;
            padding: 14px;
            margin-bottom: 10px;
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 14px;
            cursor: pointer;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .variant-btn:hover { border-color: var(--accent); background: var(--bg4); }
        .variant-name { font-weight: 600; }
        .variant-price { color: var(--accent); font-weight: 700; }
        .variant-close {
            width: 100%;
            padding: 12px;
            background: var(--bg4);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text2);
            font-size: 13px;
            cursor: pointer;
            margin-top: 10px;
        }

        /* SEARCH */
        .search-box {
            padding: 10px 20px;
            background: var(--bg2);
            border-bottom: 1px solid var(--border);
        }
        .search-input {
            width: 100%;
            padding: 10px 14px 10px 36px;
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 14px;
        }
        .search-input:focus { outline: none; border-color: var(--accent); }
        .search-icon {
            position: absolute;
            left: 32px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text2);
        }
        .mesa-strip { display: flex; gap: 8px; padding: 10px 12px; overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch; scrollbar-width: thin; background: var(--bg); border-bottom: 1px solid var(--border); }
        .search-wrapper { position: relative; }

        #cartFab { display: none; }
        #phoneBar { display: none; }
        .cart-close { display: none; }
        /* Tablet apaisada / PC chica: mismo layout de PC con ticket más angosto */
        @media (max-width: 1100px) {
            .app.active { grid-template-columns: 1fr 320px; }
        }
        /* Teléfono / tablet vertical / iframe angosto: una columna + ticket deslizable */
        @media (max-width: 860px) {
            .app.active { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr); }
            .order-panel { display: none; }
            .order-panel.mobile-active { display: flex; position: fixed; top: 0; right: 0; bottom: 0; width: 350px; max-width: 92vw; z-index: 50; box-shadow: -4px 0 20px rgba(0,0,0,0.5); }
            #cartFab { display: none; }
            .cart-close { display: block; background: none; border: none; color: var(--text2); font-size: 18px; cursor: pointer; }
            #phoneBar { display: flex; position: fixed; bottom: 0; left: 0; right: 0; z-index: 55; background: var(--bg2); border-top: 1px solid var(--border); padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); align-items: center; gap: 8px; }
            .top-bar h2 { display: none; }
            .hide-phone { display: none; }
            .top-bar { padding: 10px 12px; }
            .top-bar h2 { font-size: 14px; }
            .mesa-btn { padding: 8px 12px; font-size: 12px; }
            .categories-bar { padding: 10px 12px; }
            .search-box { padding: 8px 12px; }
            .products-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 6px; padding: 10px 10px 84px; }
            .product-name { font-size: 10px; }
            .login-box { padding: 24px 16px; }
            .pin-btn { padding: 14px; font-size: 20px; }
            .user-badge span { max-width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
            .tables-grid { grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 8px; }
            .tables-map { padding-bottom: 84px; }
        }

        /* TICKET 80mm: solo visible al imprimir */
        #ticketPrint { display: none; }
        @media print {
            body > *:not(#ticketPrint) { display: none !important; }
            #ticketPrint { display: block !important; width: 72mm; margin: 0; padding: 0; color: #000; font-family: monospace; font-size: 12px; }
            #ticketPrint h2 { text-align: center; font-size: 16px; margin: 0 0 4px; }
            #ticketPrint .t-center { text-align: center; }
            #ticketPrint .t-row { display: flex; justify-content: space-between; padding: 1px 0; }
            #ticketPrint hr { border: none; border-top: 1px dashed #000; margin: 6px 0; }
            #ticketPrint .t-total { font-size: 15px; font-weight: bold; }
            @page { size: 80mm auto; margin: 0; }
        }
    </style>
</head>
<body>
    <!-- LOGIN SCREEN -->
    <div class="login-screen" id="loginScreen">
        <div class="login-box">
            <h1><i class="fas fa-utensils"></i> UrbanFlow POS</h1>
            <p>Ingresá tu PIN para comenzar</p>
            <div class="pin-display" id="pinDisplay"></div>
            <div class="pin-pad">
                <button class="pin-btn" onclick="addPin('1')">1</button>
                <button class="pin-btn" onclick="addPin('2')">2</button>
                <button class="pin-btn" onclick="addPin('3')">3</button>
                <button class="pin-btn" onclick="addPin('4')">4</button>
                <button class="pin-btn" onclick="addPin('5')">5</button>
                <button class="pin-btn" onclick="addPin('6')">6</button>
                <button class="pin-btn" onclick="addPin('7')">7</button>
                <button class="pin-btn" onclick="addPin('8')">8</button>
                <button class="pin-btn" onclick="addPin('9')">9</button>
                <button class="pin-btn clear" onclick="clearPin()"><i class="fas fa-backspace"></i></button>
                <button class="pin-btn" onclick="addPin('0')">0</button>
                <button class="pin-btn enter" onclick="enterPin()">INGRESAR</button>
            </div>
            <div class="pin-error" id="pinError"></div>
            <div style="margin-top: 12px; border-top: 1px solid var(--border); padding-top: 12px;">
                <p style="color: var(--text2); font-size: 12px; margin-bottom: 8px;">¿Contraseña con letras? Escríbela aquí</p>
                <div style="display: flex; gap: 8px;">
                    <input type="password" id="passInput" placeholder="Tu contraseña" style="flex: 1; padding: 12px; background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 14px;">
                    <button class="pin-btn enter" style="grid-column: auto; padding: 12px 20px;" onclick="enterPass()">ENTRAR</button>
                </div>
            </div>
        </div>
    </div>

    <!-- APP -->
    <div class="app" id="app">
        <!-- LEFT PANEL - PRODUCTS -->
        <div class="products-panel">
            <div class="top-bar">
                <div class="top-bar-left">
                    <h2><i class="fas fa-utensils"></i> <span id="posRestaurantName"></span></h2>
                    <button class="mesa-btn active" id="mostradorBtn" onclick="selectMostrador()">
                        🧾 Mostrador
                    </button>
                    <button class="mesa-btn" id="mesaBtn" onclick="showTablesMap()">
                        <i class="fas fa-chair"></i> Mesa #
                    </button>
                    <button class="mesa-btn" id="onlineBtn" onclick="showOnline()">
                        🌐 Online <span id="onlineCount" style="background:var(--red);color:#fff;font-size:10px;font-weight:800;border-radius:10px;padding:1px 7px;display:none">0</span>
                    </button>
                </div>
                <div class="top-bar-right">
                    <button class="btn-logout hide-phone" onclick="goDelivery()" title="Delivery y chat" style="font-size:16px;padding:8px 12px;background:var(--bg3);color:var(--purple);border:1px solid var(--border);border-radius:8px;cursor:pointer">
                        <i class="fas fa-motorcycle"></i>
                    </button>
                    <div class="user-badge">
                        <i class="fas fa-user"></i>
                        <span id="cashierName">Cajero</span>
                    </div>
                    <button class="btn-logout" onclick="logoutPOS()">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
            </div>

            <div class="mesa-strip" id="mesaStrip"></div>

            <div id="cobrosMozoBox"></div>

            <div class="categories-bar" id="categoriesBar"></div>

            <div class="search-wrapper">
                <i class="fas fa-search search-icon"></i>
                <input type="text" class="search-input" id="searchInput" placeholder="Buscar producto..." oninput="filterProducts()">
            </div>

            <div class="products-grid" id="productsGrid"></div>

            <!-- TABLES MAP (hidden by default) -->
            <div class="tables-map" id="tablesMap">
                <h3 style="margin-bottom: 15px;"><i class="fas fa-map"></i> Mapa de Mesas</h3>
                <div class="tables-grid" id="tablesGrid"></div>
            </div>

            <!-- ONLINE (hidden by default) -->
            <div id="onlineView" style="display:none;flex:1;min-height:0;overflow-y:auto;padding:12px 20px;">
                <h3 style="margin-bottom:10px;">🌐 Pedidos online de hoy</h3>
                <div id="onlineGroups"></div>
            </div>
        </div>

        <!-- RIGHT PANEL - ORDER -->
        <div class="order-panel" id="orderPanel">
            <div class="order-header">
                <h3><i class="fas fa-receipt"></i> Pedido</h3>
                <div class="order-mesa" id="orderMesa">Sin mesa</div>
                <button class="cart-close" onclick="document.getElementById('orderPanel').classList.remove('mobile-active')">✕</button>
            </div>
            <div id="mostradorPendBox"></div>
            <div id="cuentaMesaBox"></div>

            <div class="order-items" id="orderItems">
                <div class="order-empty">
                    <i class="fas fa-shopping-cart"></i>
                    <p>Agregar productos</p>
                </div>
            </div>

            <div class="order-footer">
                <div class="order-row total">
                    <span>TOTAL</span>
                    <span id="totalOrder">$0</span>
                </div>
                <button onclick="sendToKitchen()" style="width:100%;margin-bottom:10px;padding:14px;background:var(--orange);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;">
                    <i class="fas fa-share-nodes"></i> Enviar a Sectores
                </button>
                <div class="order-actions">
                    <button class="btn-order btn-cash" onclick="openCashModal()">
                        <i class="fas fa-money-bill"></i> Efectivo
                    </button>
                    <button class="btn-order btn-mp" onclick="payOrder('mercado_pago')">
                        <i class="fas fa-credit-card"></i> MercadoPago
                    </button>
                </div>
                <button onclick="printTicket()" style="width: 100%; margin-top: 8px; padding: 10px; background: var(--bg3); color: var(--text); border: 1px solid var(--border); border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer;">
                    <i class="fas fa-print"></i> Imprimir ticket
                </button>
            </div>
        </div>
    </div>

    <!-- TICKET IMPRIMIBLE (solo se ve al imprimir, 80mm térmica) -->
    <div id="ticketPrint" style="display: none;"></div>

    <!-- Botón flotante ticket en celular / iframe angosto -->
    <button id="cartFab" onclick="document.getElementById('orderPanel').classList.toggle('mobile-active')">🛒 <span id="cartFabCount">0</span></button>

    <!-- Barra inferior fija en teléfono: total + enviar + ticket -->
    <div id="phoneBar">

            try {
                const { data } = await sbPOS.from('pedidos').select('id,items,total,cliente_nombre,metodo_pago_estado,estado')

                const open = (data || []).filter(p => p.metodo_pago_estado !== 'pagado' && p.metodo_pago_estado !== 'por_confirmar');
                let total = 0;
                const items = [];
                open.forEach(p => {
                    let its = [];
                    try { its = JSON.parse(p.items || '[]'); } catch (e) {}
                    if (!Array.isArray(its)) its = [];
                    its.forEach(i => items.push({ nombre: i.nombre, cantidad: i.cantidad || i.qty || 1, precio: i.precio || 0 }));

        async function loadPOSData(){
            if(!empresaIdPOS) return;
            // Con empresa real se descartan los empleados demo del código
            employees = [];
            try{
                const { data: empProdsAll } = await sbPOS.from('productos_empresa').select('*').eq('empresa_id', empresaIdPOS).eq('activo', true);
                const empProds = (empProdsAll || []).filter(p => !p.visible_para || p.visible_para.split(',').map(s => s.trim()).includes('cajero'));
                if(empProds && empProds.length){
                    const cats = [...new Set(empProds.map(p => (p.categoria || 'General').trim()).filter(Boolean))].sort();
                    categories = [{ id: 'all', nombre: 'Todos', icono: '📋' },
                        ...cats.map((c, i) => ({ id: 'dbcat_' + i, nombre: c, icono: '🍽' }))];
                    const catIdOf = (nombre) => {
                        const n = ((nombre || 'General').trim());
                        const found = categories.find(c => c.id !== 'all' && c.nombre === n);
                        return found ? found.id : 'all';
                    };
                    products = empProds.map(p=>({ id:p.id, nombre:p.nombre, precio: p.precio || 0, foto: '🍽', categorias:[catIdOf(p.categoria)], variantes:[{nombre:'Único',precio:p.precio||0}], stock: 999, foto_url:p.foto_url }));
                    currentCategory = 'all';
                    renderCategories();
                    renderProducts();
                }
                const { data: empMesas } = await sbPOS.from('mesas').select('*').eq('empresa_id', empresaIdPOS).order('numero');

                    tables = empMesas.map(m=>({ id:m.id, numero:m.numero, estado: m.estado==='libre'?'disponible': m.estado, capacidad: m.capacidad||4 }));
                    renderTables();
                }
                const { data: empEmpleados } = await sbPOS.from('empleados').select('*').eq('empresa_id', empresaIdPOS).eq('activo', true);
                if(empEmpleados && empEmpleados.length){
                    employees = empEmpleados.map(e=>({ id:e.id, nombre:e.nombre, pin:e.pin, roles:[e.rol||'rol_cajero'], email:e.email||'' }));
                }
                if (employees.length === 0) {
                    document.getElementById('pinError').textContent = 'Sin personal activo: activalos en Gestión → Personal';
                }
                // Dueño: entra a caja con su PIN y opera como cajero
                try {
                    const empRes = await sbPOS.from('empresas').select('nombre,pin_dueno,rut,direccion,telefono').eq('id', empresaIdPOS).limit(1).maybeSingle();
                    if (empRes.data) {
                        if (empRes.data.pin_dueno) window._duenoPOS = { pin: empRes.data.pin_dueno, nombre: empRes.data.nombre || 'Dueño' };
                        window._fiscalPOS = {
                            nombre: empRes.data.nombre || 'UrbanFlow',

                            direccion: empRes.data.direccion || '',
                            telefono: empRes.data.telefono || ''
                        };
                        if (window._fiscalPOS.nombre) document.getElementById('posRestaurantName').textContent = window._fiscalPOS.nombre;
                    }
                } catch (_) {}
            }catch(e){ console.log('POS load error', e.message); }
        }

        function doLogin(secret) {
            const emp = employees.find(e => e.pin === secret && e.activo !== false)

                    ? { id: 'dueno', nombre: window._duenoPOS.nombre + ' (Dueño)', pin: secret, roles: ['rol_dueno', 'rol_cajero'], email: '' }

                renderProducts();
                renderTables();

                document.getElementById('pinError').textContent = 'PIN incorrecto';

        function printTicket() {
            const r2 = n => (Math.round(n * 100) / 100).toFixed(2);
            const now = new Date();
            const fecha = now.toLocaleDateString('es-UY') + ' ' + now.toLocaleTimeString('es-UY', { hour: '2-digit', minute: '2-digit' });
            const F = window._fiscalPOS || {};
            const nombre = F.nombre || (document.getElementById('posRestaurantName').textContent || 'UrbanFlow').trim() || 'UrbanFlow';
            const cajero = (document.getElementById('cashierName').textContent || '').trim();
            const mesaTxt = selectedMesa ? 'Mesa #' + selectedMesa.numero : 'Mostrador';
            const lineas = [];
            currentOrder.forEach(o => lineas.push({ nombre: o.nombre, cant: o.qty, precio: o.precio }));
            (mesaCuenta.items || []).forEach(i => lineas.push({ nombre: i.nombre + ' (mesa)', cant: i.cantidad, precio: i.precio }));
            if (!lineas.length) { alert('Nada para imprimir'); return; }
            const total = lineas.reduce((a, i) => a + (i.precio * i.cant), 0);
            const qrTexto = `${nombre}${F.rut ? ' · RUT ' + F.rut : ''}\n${fecha} · ${mesaTxt}\n` +
                lineas.map(i => `${i.nombre} x${i.cant} $${r2(i.precio * i.cant)}`).join('\n') +
                `\nTOTAL $${r2(total)}`;
            document.getElementById('ticketPrint').innerHTML = `
                <h2>${nombre}</h2>
                ${F.rut ? `<div class="t-center">RUT ${F.rut}</div>` : ''}
                ${F.direccion ? `<div class="t-center">${F.direccion}</div>` : ''}
                ${F.telefono ? `<div class="t-center">Tel: ${F.telefono}</div>` : ''}
                <hr>
                <div class="t-center">${fecha} · ${mesaTxt}</div>
                <div class="t-center">Atiende: ${cajero}</div>
                <hr>
                ${lineas.map(i => `
                    <div class="t-row"><span>${i.nombre} x${i.cant}</span><span>$${r2(i.precio * i.cant)}</span></div>
                `).join('')}
                <hr>
                <div class="t-row t-total"><span>TOTAL</span><span>$${r2(total)}</span></div>
                <div class="t-center">Gracias por su visita</div>
                <div class="t-center" style="margin-top:8px"><div id="ticketQR" style="display:inline-block;background:#fff;padding:6px"></div></div>
                <div class="t-center" style="font-size:10px">Escaneá para ver tu ticket</div>`;
            try {
                new QRCode(document.getElementById('ticketQR'), { text: qrTexto, width: 110, height: 110, correctLevel: QRCode.CorrectLevel.M });
            } catch (e) {}
            setTimeout(() => window.print(), 350);
        }

        // =============================================
        // PRODUCTS
        // =============================================
        function renderProducts() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            let filtered = products.filter(p => {
                const matchCategory = currentCategory === 'all' || p.categorias.includes(currentCategory);
                const matchSearch = p.nombre.toLowerCase().includes(search);
                return matchCategory && matchSearch;
            });

            document.getElementById('productsGrid').innerHTML = filtered.map(p => `
                <div class="product-card ${p.stock < 10 ? 'low-stock' : ''}" onclick="selectProduct('${p.id}')">

            renderProducts();
        }

        function selectProduct(id) {
            const product = products.find(p => p.id === id);
            if (!product) return;

            if (product.variantes.length > 1) {
                showVariantModal(product);
            } else {
                addToOrder(product, product.variantes[0]);
            }
        }

        function showVariantModal(product) {
            document.getElementById('variantTitle').textContent = product.nombre;
            document.getElementById('variantOptions').innerHTML = product.variantes.map((v, i) => `
                <button class="variant-btn" onclick="selectVariant('${product.id}', ${i})">
                    <span class="variant-name">${v.nombre}</span>
                    <span class="variant-price">$${v.precio}</span>
                </button>
            `).join('');
            document.getElementById('variantModal').classList.add('active');
        }

        function closeVariantModal() {
            document.getElementById('variantModal').classList.remove('active');
        }

        function selectVariant(productId, variantIndex) {
            const product = products.find(p => p.id === productId);
            addToOrder(product, product.variantes[variantIndex]);
            closeVariantModal();
        }

        // =============================================
        // ORDER
        // =============================================
        function addToOrder(product, variant) {
            const existing = currentOrder.find(o => o.productId === product.id && o.variantName === variant.nombre);
            if (existing) {
                existing.qty++;
            } else {
                currentOrder.push({
                    productId: product.id,
                    nombre: product.nombre,
                    variantName: variant.nombre,
                    precio: variant.precio,
                    qty: 1,
                    foto: product.foto,
                    foto_url: product.foto_url || ''
                });
            }
            renderOrder();
        }

        function removeFromOrder(index) {
            currentOrder.splice(index, 1);
            renderOrder();
        }

        function changeQty(index, delta) {
            currentOrder[index].qty += delta;
            if (currentOrder[index].qty <= 0) {
                currentOrder.splice(index, 1);
            }
            renderOrder();
        }

        function renderOrder() {
            const container = document.getElementById('orderItems');
            
            if (currentOrder.length === 0) {
                container.innerHTML = '<div class="order-empty"><i class="fas fa-shopping-cart"></i><p>Agregar productos</p></div>';
                document.getElementById('totalOrder').textContent = '$0';
                paintOrderMesa();
                return;
            }

            container.innerHTML = currentOrder.map((item, i) => `
                <div class="order-item">
                    <span style="font-size: 24px;">${item.foto}</span>
                    <div class="order-item-info">
                        <div class="order-item-name">${item.nombre} - ${item.variantName}</div>
                        <div class="order-item-price">$${item.precio} c/u</div>
                    </div>
                    <button class="order-item-qty" onclick="changeQty(${i}, -1)">-</button>
                    <span class="order-item-qty">${item.qty}</span>
                    <button class="order-item-qty" onclick="changeQty(${i}, 1)">+</button>
                    <div class="order-item-total">$${item.precio * item.qty}</div>
                    <button class="order-item-remove" onclick="removeFromOrder(${i})">
                        <i class="fas fa-trash"></i>
                    </button>
                </div>
            `).join('');

            const subtotal = currentOrder.reduce((a, item) => a + (item.precio * item.qty), 0);

            const fmt2 = n => '$' + (Math.round(n * 100) / 100).toLocaleString('es-UY', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            document.getElementById('totalOrder').textContent = fmt2(subtotal);
            paintOrderMesa();
        }

        // =============================================
        // TABLES MAP
        // =============================================
        function showTablesMap() {
            document.getElementById('productsGrid').style.display = 'none';

        function renderTables() {

                tables.map(t => {
                    const tot = mesaTotal(t.id);

        // =============================================
        // ONLINE
        // =============================================
        function showOnline() {
            document.getElementById('productsGrid').style.display = 'none';
            document.getElementById('tablesMap').classList.remove('active');
            document.getElementById('onlineView').style.display = 'block';

        function hideOnline() {
            const v = document.getElementById('onlineView');
            if (v) v.style.display = 'none';

        }
        async function loadOnline() {
            const badge = document.getElementById('onlineCount');
            const box = document.getElementById('onlineGroups');
            if (!empresaIdPOS) return;
            try {
                const desde = new Date(); desde.setHours(0, 0, 0, 0);
                const { data, error } = await sbPOS.from('pedidos').select('id,numero,cliente_nombre,direccion_entrega,items,total,metodo_pago,metodo_pago_estado,estado,tipo_entrega,mesa_numero,delivery_nombre,created_at')
                    .eq('empresa_id', empresaIdPOS)
                    .gte('created_at', desde.toISOString())
                    .neq('estado', 'entregado').neq('estado', 'cancelado')
                    .order('created_at', { ascending: false }).limit(50);
                if (error) throw error;
                const online = (data || []).filter(p => !p.mesa_numero && !['mostrador', 'mesa'].includes((p.tipo_entrega || '').toLowerCase()));
                const pend = online.filter(p => ['recibido', 'preparando'].includes(p.estado));
                const listos = online.filter(p => p.estado === 'listo');
                if (badge) {
                    badge.style.display = online.length ? '' : 'none';
                    badge.textContent = online.length;
                }
                if (!box) return;
                const card = p => {
                    let items = []; try { items = JSON.parse(p.items || '[]'); } catch (e) {}
                    const nIt = Array.isArray(items) ? items.length : 0;
                    const desc = Array.isArray(items) && items.length ? items.map(i => `${i.cantidad||1}x ${i.nombre||i.name||'Producto'}`).join(', ') : 'Sin detalle';
                    const estC = p.estado === 'listo' ? 'var(--green)' : 'var(--orange)';
                    return `<div style="background:var(--bg2);border:1px solid var(--border);border-left:4px solid ${estC};border-radius:10px;padding:12px;margin-bottom:10px">
                        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
                            <strong>#${p.numero || String(p.id).substring(0,4)} · ${p.cliente_nombre || 'Cliente'}</strong>
                            <strong style="color:var(--accent)">$${Math.round(p.total || 0)}</strong>
                        </div>
                        <div style="font-size:12px;color:var(--text2);margin-top:4px">📍 ${p.direccion_entrega || 'Retiro'} · ${p.metodo_pago || 'efectivo'}${p.metodo_pago_estado === 'pagado' ? ' ✓' : ''} · <strong style="color:${estC}">${(p.estado || '').toUpperCase()}</strong></div>
                        <div style="font-size:13px;color:var(--text);margin-top:6px;background:var(--bg3);border-radius:6px;padding:8px;line-height:1.4">📦 ${desc}</div>
                        <div style="font-size:11px;color:var(--text2);margin-top:4px">${nIt} items</div>
                        ${p.estado === 'listo' ? (p.delivery_nombre
                            ? `<div style="font-size:12px;color:var(--accent);margin-top:6px;font-weight:700">🛵 ${p.delivery_nombre} avisado (esperando que acepte)</div><button onclick="openOnlineDel('${p.id}')" style="padding:6px 12px;margin-top:6px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text2);font-size:11px;cursor:pointer">🔄 Llamar otro delivery</button>`
                            : `<button onclick="openOnlineDel('${p.id}')" style="width:100%;padding:10px;margin-top:8px;border-radius:8px;border:1px solid var(--accent);background:transparent;color:var(--accent);font-size:13px;font-weight:700;cursor:pointer">🛵 Buscar delivery</button>`) : ''}
                    </div>`;
                };
                box.innerHTML =
                    `<div style="font-size:12px;font-weight:700;color:var(--text2);margin:4px 0 8px">⏳ En cocina (${pend.length})</div>` +
                    (pend.length ? pend.map(card).join('') : '<p style="font-size:12px;color:var(--text2)">Sin pendientes</p>') +
                    `<div style="font-size:12px;font-weight:700;color:var(--text2);margin:12px 0 8px">✅ Listos (${listos.length})</div>` +
                    (listos.length ? listos.map(card).join('') : '<p style="font-size:12px;color:var(--text2)">Sin listos</p>');
            } catch (e) { if (box) box.innerHTML = '<p style="font-size:12px;color:var(--red)">Error al cargar</p>'; }
        }
        function _havKm(lat1, lon1, lat2, lon2) {
            try {
                const R = 6371, dLa = (lat2 - lat1) * Math.PI / 180, dLo = (lon2 - lon1) * Math.PI / 180;
                const a = Math.sin(dLa / 2) * Math.sin(dLa / 2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLo / 2) * Math.sin(dLo / 2);
                return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            } catch (_) { return null; }
        }
        async function _geocodeAddr(addr) {
            try {
                if (!addr) return null;
                const url = 'https://nominatim.openstreetmap.org/search?q=' + encodeURIComponent(addr + ', Uruguay') + '&format=json&limit=1';
                const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
                const arr = await res.json();
                if (arr && arr.length) return { lat: parseFloat(arr[0].lat), lon: parseFloat(arr[0].lon) };
            } catch (_) {}
            return null;
        }
        async function openOnlineDel(pedidoId) {
            document.getElementById('onlineDelModal').classList.add('active');
            const box = document.getElementById('onlineDelList');
            box.innerHTML = '<p style="font-size:12px;color:var(--text2);text-align:center">Buscando deliverys...</p>';
            try {
                // Solo deliverys en modo contrato vinculados a este restaurante
                let contrato = [];
                try {
                    const r = await sbPOS.from('perfiles').select('id,full_name,is_online')
                        .eq('empresa_vinculada_id', empresaIdPOS).eq('modalidad', 'contrato').eq('tipo_vehiculo', 'delivery_moto').limit(15);
                    contrato = (r.data || []).map(c => ({ id: c.id, nombre: c.full_name || 'Delivery', is_online: c.is_online || false }));
                } catch (_) {}
                const esc = s => String(s || '').replace(/'/g, "\\'");
                if (contrato.length) {
                    const online = contrato.filter(d => d.is_online);
                    box.innerHTML = `<p style="font-size:12px;color:var(--text2);text-align:center;margin-bottom:8px">📋 Deliverys en modo contrato</p>` +
                    contrato.map(d => `
                    <div style="display:flex;align-items:center;gap:10px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:8px;opacity:${d.is_online ? '1' : '0.5'}">
                        <div style="font-weight:700;font-size:14px;flex:1">${d.nombre}<div style="font-size:11px;color:var(--text2);font-weight:400">${d.is_online ? '🟢 En turno' : '⚪ Desconectado - no disponible'} · 📋 Contrato</div></div>
                        ${d.is_online
                            ? `<button onclick="llamarOnlineDel('${pedidoId}', '${d.id}', '${esc(d.nombre)}')" style="padding:8px 14px;background:var(--green);color:#fff;border:none;border-radius:8px;font-weight:700;cursor:pointer">Llamar</button>`
                            : `<button disabled style="padding:8px 14px;background:var(--border);color:var(--text2);border:none;border-radius:8px;font-weight:700;cursor:not-allowed">Desconectado</button>`}
                    </div>`).join('') +
                    (online.length === 0 ? `<div style="text-align:center;margin-top:12px;padding:12px;background:var(--bg3);border:1px dashed var(--border);border-radius:10px"><p style="font-size:13px;margin-bottom:10px">No hay deliverys en modo contrato en turno.<br>¿Buscamos un delivery en modo libre?</p><button onclick="buscarLibresOnlineDel('${pedidoId}')" style="padding:8px 16px;background:#FF9800;color:#fff;border:none;border-radius:8px;font-weight:700;cursor:pointer">Sí, buscar libres</button></div>` : '');
                    return;
                }
                // Sin contrato: preguntar si buscar libres
                box.innerHTML = `<div style="text-align:center;padding:16px"><p style="font-size:14px;margin-bottom:6px">No hay deliverys en modo contrato.</p><p style="font-size:13px;color:var(--text2);margin-bottom:14px">¿Buscamos un delivery en modo libre?</p><div style="display:flex;gap:8px;justify-content:center"><button onclick="buscarLibresOnlineDel('${pedidoId}')" style="padding:10px 18px;background:#FF9800;color:#fff;border:none;border-radius:8px;font-weight:700;cursor:pointer">Sí, buscar</button><button onclick="document.getElementById('onlineDelModal').classList.remove('active')" style="padding:10px 18px;background:var(--border);color:var(--text2);border:none;border-radius:8px;cursor:pointer">No</button></div></div>`;
            } catch (e) { box.innerHTML = '<p style="font-size:12px;color:var(--red);text-align:center">Error</p>'; }
        }
        let filtroTopeLibre = 0, filtroKmLibre = 0;
        async function buscarLibresOnlineDel(pedidoId) {
            const box = document.getElementById('onlineDelList');
            box.innerHTML = '<p style="font-size:12px;color:var(--text2);text-align:center">Buscando los 5 libres más cercanos...</p>';
            try {
                const [empRes, pedRes, libRes] = await Promise.all([
                    sbPOS.from('empresas').select('lat,lon').eq('id', empresaIdPOS).maybeSingle(),
                    sbPOS.from('pedidos').select('direccion_entrega,lat_entrega,lon_entrega').eq('id', pedidoId).maybeSingle(),
                    sbPOS.from('perfiles').select('id,full_name,is_online,last_lat,last_lng').eq('modalidad', 'libre').eq('tipo_vehiculo', 'delivery_moto').eq('is_online', true).limit(20)
                ]);
                const empLat = empRes.data?.lat != null ? Number(empRes.data.lat) : null;
                const empLon = empRes.data?.lon != null ? Number(empRes.data.lon) : null;
                let cliLat = pedRes.data?.lat_entrega != null ? Number(pedRes.data.lat_entrega) : null;
                let cliLon = pedRes.data?.lon_entrega != null ? Number(pedRes.data.lon_entrega) : null;
                const dirCli = pedRes.data?.direccion_entrega || '';
                if ((cliLat == null || cliLon == null) && dirCli) {
                    const g = await _geocodeAddr(dirCli);
                    if (g) { cliLat = g.lat; cliLon = g.lon; }
                }
                const kmViaje = (empLat != null && empLon != null && cliLat != null && cliLon != null) ? _havKm(empLat, empLon, cliLat, cliLon) : null;
                let libres = (libRes.data || []).filter(d => d.last_lat != null && d.last_lng != null);
                // Reglas de cada libre (precio por km y mínimo) — igual que en la app del delivery
                let reglas = {};
                try {
                    const ids = libres.map(d => d.id);
                    if (ids.length) {
                        const rr = await sbPOS.from('reglas_chofer').select('user_id,price_per_km,min_fare').in('user_id', ids);
                        for (const r of (rr.data || [])) reglas[r.user_id] = r;
                    }
                } catch (_) {}
                libres = libres.map(d => {
                    const kmAlRest = (empLat != null && empLon != null) ? _havKm(Number(d.last_lat), Number(d.last_lng), empLat, empLon) : null;
                    const rg = reglas[d.id] || {};
                    const ppkm = parseFloat(rg.price_per_km) > 0 ? parseFloat(rg.price_per_km) : 40;
                    const minF = parseFloat(rg.min_fare) > 0 ? parseFloat(rg.min_fare) : 100;
                    const precio = kmViaje != null ? Math.max(kmViaje * ppkm, minF) : null;
                    return { id: d.id, nombre: d.full_name || 'Delivery', kmAlRest, precio };
                });
                libres.sort((a, b) => (a.kmAlRest ?? 9999) - (b.kmAlRest ?? 9999));
                if (filtroKmLibre > 0) libres = libres.filter(d => d.kmAlRest != null && d.kmAlRest <= filtroKmLibre);
                libres = libres.slice(0, 5);
                const esc = s => String(s || '').replace(/'/g, "\\'");
                const tope = filtroTopeLibre > 0 ? filtroTopeLibre : 0;
                const ofertaDe = (p) => p != null ? (tope > 0 ? Math.min(p, tope) : p) : (tope > 0 ? tope : null);
                if (!libres.length) { box.innerHTML = `<div style="text-align:center;padding:16px"><p style="font-size:13px;color:var(--text2);margin-bottom:12px">No hay deliverys libres en línea con ubicación.</p><button onclick="openOnlineDel('${pedidoId}')" style="padding:8px 16px;background:var(--border);color:var(--text2);border:none;border-radius:8px;cursor:pointer">← Volver</button></div>`; return; }
                box.innerHTML = `<p style="font-size:12px;color:#FF9800;text-align:center;margin-bottom:4px">🆓 Libres más cercanos — origen restaurante → ${esc(dirCli) || 'cliente'}</p>` +
                    (kmViaje != null ? `<p style="font-size:11px;color:var(--text2);text-align:center;margin-bottom:10px">Distancia envío: ${kmViaje.toFixed(1)} km</p>` : `<p style="font-size:11px;color:var(--text2);text-align:center;margin-bottom:10px">Sin ubicación del cliente: precio estimado</p>`) +
                    `<div style="display:flex;gap:6px;justify-content:center;align-items:center;margin-bottom:10px;flex-wrap:wrap"><input id="filtroTopeLibre" type="number" min="0" placeholder="Oferta máx $" value="${tope > 0 ? tope : ''}" style="width:110px;padding:6px 8px;border-radius:6px;border:1px solid var(--border);background:var(--bg3);color:var(--text);font-size:12px"><input id="filtroKmLibre" type="number" min="0" placeholder="Máx km" value="${filtroKmLibre > 0 ? filtroKmLibre : ''}" style="width:90px;padding:6px 8px;border-radius:6px;border:1px solid var(--border);background:var(--bg3);color:var(--text);font-size:12px"><button onclick="filtroTopeLibre=Number(document.getElementById('filtroTopeLibre').value)||0;filtroKmLibre=Number(document.getElementById('filtroKmLibre').value)||0;buscarLibresOnlineDel('${pedidoId}')" style="padding:6px 12px;background:#FF9800;color:#fff;border:none;border-radius:6px;font-weight:700;cursor:pointer;font-size:12px">Filtrar</button></div>` +
                    (tope > 0 ? `<p style="font-size:11px;color:#4CAF50;text-align:center;margin-bottom:10px">Ofertando máx $${tope} — el que acepta gana eso</p>` : '') +
                    `<button onclick="openOnlineDel('${pedidoId}')" style="display:block;margin:0 auto 10px;padding:6px 14px;background:var(--border);color:var(--text2);border:none;border-radius:6px;cursor:pointer;font-size:11px">← Volver a contrato</button>` +
                    libres.map(d => {
                    const oferta = ofertaDe(d.precio);
                    const pideMas = tope > 0 && d.precio != null && d.precio > tope;
                    return `
                    <div style="display:flex;align-items:center;gap:10px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:8px">
                        <div style="font-weight:700;font-size:14px;flex:1">${d.nombre} <span style="font-size:10px;background:#ff9800;color:#fff;border-radius:8px;padding:1px 6px;">LIBRE</span><div style="font-size:11px;color:var(--text2);font-weight:400">🟢 En turno${d.kmAlRest != null ? ' · ' + d.kmAlRest.toFixed(1) + ' km del rest.' : ''}${oferta != null ? ' · 💰 Oferta $' + Math.round(oferta) + (pideMas ? ' (pide $' + Math.round(d.precio) + ')' : '') : ''}</div></div>
                        <button onclick="llamarOnlineDel('${pedidoId}', '${d.id}', '${esc(d.nombre)}', 'libre', ${oferta != null ? Math.round(oferta) : 0})" style="padding:8px 14px;background:var(--green);color:#fff;border:none;border-radius:8px;font-weight:700;cursor:pointer">Llamar</button>
                    </div>`; }).join('');
            } catch (e) { box.innerHTML = '<p style="font-size:12px;color:var(--red);text-align:center">Error al buscar libres</p>'; }
        }
        async function llamarOnlineDel(pedidoId, empId, nombre, modalidad = 'contrato', precioEnvio = 0) {
            try {
                // Verificación exacta en tiempo real: no asignar a desconectados
                try {
                    const { data: chk } = await sbPOS.from('perfiles').select('is_online').eq('id', empId).maybeSingle();
                    if (chk && chk.is_online === false) { alert('Ese delivery se desconectó, elegí otro'); loadOnline(); return; }
                } catch(_) {}
                const { data: pedido } = await sbPOS.from('pedidos').select('*').eq('id', pedidoId).single();
                if (!pedido) { alert('Pedido no encontrado'); return; }
                const { data: empresa } = await sbPOS.from('empresas').select('nombre,logo_url,lat,lon').eq('id', empresaIdPOS).single();
                let items = pedido?.items || '[]';
                if (typeof items === 'string') { try { items = JSON.parse(items); } catch (_) {} }
                if (Array.isArray(items)) {
                    for (const item of items) {
                        if (!item.foto_url && item.producto_id) {
                            try { const { data: prod } = await sbPOS.from('productos').select('foto_url').eq('id', item.producto_id).single(); if (prod?.foto_url) item.foto_url = prod.foto_url; } catch (_) {}
                        }
                    }
                }
                const payload = { pedido_id: pedidoId, empresa_id: empresaIdPOS || '', modalidad: modalidad || 'contrato', delivery_price: Math.round(Number(precioEnvio) || 0), rest_lat: empresa?.lat ?? null, rest_lon: empresa?.lon ?? null, restaurant_name: empresa?.nombre || 'Restaurante', logo_url: empresa?.logo_url || '', customer_name: pedido?.cliente_nombre || 'Cliente', customer_photo: '', address: pedido?.direccion_entrega || '', items: typeof items === 'string' ? items : JSON.stringify(items), total: pedido?.total || 0, payment: pedido?.metodo_pago || 'efectivo', notes: pedido?.notas || '' };
                const { error } = await sbPOS.from('pedidos').update({ chofer_id: empId, delivery_nombre: nombre }).eq('id', pedidoId);
                if (error) throw error;
                try {
                    const PALABRAS = ['tigre','perro','verde','negro','playa','cerro','farol','mango','dulce','nubes','llave','torta','queso','salsa','fuego','mando','rueda','calle','barco','naran'];
                    const palabra = PALABRAS[Math.floor(Math.random() * PALABRAS.length)];
                    await sbPOS.from('pedidos').update({ palabra_secreta: palabra }).eq('id', pedidoId);
                } catch (_) {}
                try {
                    const ch = sbPOS.channel('viaje_' + empId);
                    ch.subscribe(async (status) => { if (status === 'SUBSCRIBED') await ch.send({ type: 'broadcast', event: 'solicitud_delivery', payload }); });
                } catch (_) {}
                try { await sbPOS.from('pedidos_delivery').upsert({ pedido_id: pedidoId, driver_id: empId, delivery_data: JSON.stringify(payload), status: 'pending' }); } catch (_) {}
                document.getElementById('onlineDelModal').classList.remove('active');
                alert('Llamando a ' + nombre + ' 🛵');
                loadOnline();
            } catch (e) { alert('Error: ' + e.message); }
        }

        // =============================================
        // EFECTIVO: paga con / vuelto
        // =============================================
        function cashTotalActual() {
            const r = n => Math.round(n * 100) / 100;
            const sub = r(currentOrder.reduce((a, item) => a + (item.precio * item.qty), 0));
            return r(sub + (mesaCuenta.total || 0));
        }
        function openCashModal() {
            if (currentOrder.length === 0 && (mesaCuenta.total || 0) <= 0) { alert('Agregá productos al pedido'); return; }
            const tot = cashTotalActual();
            document.getElementById('cashTotal').textContent = '$' + tot;
            document.getElementById('cashPaid').value = tot;
            updCashChange();
            document.getElementById('cashModal').classList.add('active');
            setTimeout(() => document.getElementById('cashPaid').select(), 100);
        }
        function setCashPaid(v) {
            const tot = cashTotalActual();
            document.getElementById('cashPaid').value = (v === 'exacto') ? tot : v;
            updCashChange();
        }
        function updCashChange() {
            const tot = cashTotalActual();
            const pag = parseFloat(document.getElementById('cashPaid').value) || 0;
            const dif = Math.round((pag - tot) * 100) / 100;
            const chEl = document.getElementById('cashChange');
            const cfBtn = document.getElementById('cashConfirm');
            if (dif < 0) {
                chEl.textContent = 'Faltan $' + Math.abs(dif);
                chEl.style.color = 'var(--red)';
                cfBtn.style.opacity = '0.4';
            } else {
                chEl.textContent = '$' + dif;
                chEl.style.color = 'var(--green)';
                cfBtn.style.opacity = '1';
            }
        }
        function confirmCash() {
            const tot = cashTotalActual();
            const pag = parseFloat(document.getElementById('cashPaid').value) || 0;
            if (pag < tot) return;
            document.getElementById('cashModal').classList.remove('active');
            payOrder('efectivo', pag);
        }

        // =============================================
        // PAYMENT
        // =============================================
        async function payOrder(method, recibido) {
            const cuentaExtra = mesaCuenta.total || 0;
            // Cobros del mozo por confirmar en esta mesa (no se vuelven a cobrar, solo se confirman)
            let porConfirmarIds = [];
            if (selectedMesa && empresaIdPOS) {
                try {
                    const { data: pc } = await sbPOS.from('pedidos').select('id')
                        .eq('empresa_id', empresaIdPOS).eq('mesa_numero', selectedMesa.numero)
                        .eq('metodo_pago_estado', 'por_confirmar');
                    porConfirmarIds = (pc || []).map(p => p.id);
                } catch (_) {}
            }
            if (currentOrder.length === 0 && cuentaExtra <= 0 && porConfirmarIds.length === 0) {
                alert('Agregá productos al pedido');
                return;
            }
            // Solo confirmar lo del mozo, sin ticket nuevo
            if (currentOrder.length === 0 && cuentaExtra <= 0 && porConfirmarIds.length > 0) {
                await confirmarCobro(selectedMesa.numero);
                document.getElementById('orderPanel').classList.remove('mobile-active');
                return;
            }

            // Caja mostrador: precios directos del sistema, sin recargos ni tipeo.
            // Si la mesa tiene cuenta abierta (mozo/QR), se cobra todo junto.
            const r2 = n => Math.round(n * 100) / 100;
            const subtotal = r2(currentOrder.reduce((a, item) => a + (item.precio * item.qty), 0));
            const totalCliente = r2(subtotal + cuentaExtra);
            const totalRecibido = (recibido && recibido >= totalCliente) ? r2(recibido) : totalCliente;
            const vuelto = r2(totalRecibido - totalCliente);

            const pedido = {
                id: 'ped_' + Date.now(),
                numero: Math.floor(Math.random() * 9000) + 1000,
                cliente_nombre: selectedMesa ? 'Mesa #' + selectedMesa.numero : 'Counter',
                tipo: selectedMesa ? 'local' : 'counter',
                // Si la mesa ya tiene cuenta abierta, esto es solo recibo (no va a cocina)
                estado: (selectedMesa && mesaCuenta.pedidos.length) ? 'entregado' : 'recibido',
                items: currentOrder.map(o => ({
                    nombre: o.nombre + ' - ' + o.variantName,
                    cantidad: o.qty,
                    precio_unitario: o.precio,
                    subtotal: o.precio * o.qty,
                    foto: o.foto_url || ''
                })).concat(mesaCuenta.items.map(i => ({
                    nombre: String(i.nombre || '').replace(/(\s*\(cuenta mesa\))+$/i, '') + ' (cuenta mesa)',
                    cantidad: i.cantidad,
                    precio_unitario: i.precio,
                    subtotal: i.precio * i.cantidad
                }))),
                subtotal: subtotal,
                uf_fee_ui: 0,
                uf_fee_monto: 0,
                mp_fee_porcentaje: 0,
                mp_fee_monto: 0,
                total_cliente: totalCliente,
                total_recibido: totalRecibido,
                metodo_pago: method,
                mesa_id: selectedMesa?.id || null,
                created_at: new Date().toISOString()
            };

            // Save to Supabase pedidos (para que gestion/app lo vean)
            if (empresaIdPOS) {
                try{
                    const { data: insData, error: insErr } = await sbPOS.from('pedidos').insert({
                        empresa_id: empresaIdPOS,
                        mesa_token: selectedMesa?.id || '',
                        mesa_numero: selectedMesa?.numero || 0,
                        cliente_nombre: pedido.cliente_nombre,
                        cliente_token: 'pos_' + Date.now(),
                        items: JSON.stringify(pedido.items.map(it=>({ nombre: it.nombre, cantidad: it.cantidad, precio: it.precio_unitario, foto: it.foto || '' }))),
                        total: pedido.total_cliente,
                        estado: pedido.estado,
                        tipo_entrega: selectedMesa ? 'Mesa' : 'mostrador',
                        metodo_pago: method,
                        metodo_pago_estado: 'pagado',
                        notas: `POS ${method} - Mesa ${selectedMesa ? selectedMesa.numero : 'Mostrador'}`
                    }).select();
                    if (insErr) throw insErr;
                    // Quién lo cobró (columnas nuevas: si no existen, se ignora sin romper)
                    try {
                        if (insData && insData[0]) {
                            await sbPOS.from('pedidos').update({
                                cajero_id: currentUser?.id || null,
                                cajero_nombre: currentUser?.nombre || null
                            }).eq('id', insData[0].id);
                        }
                    } catch (_) {}
                    // Marcar como cobrada la cuenta abierta de la mesa
                    if (mesaCuenta.pedidos.length) {
                        try {
                            await sbPOS.from('pedidos').update({ metodo_pago_estado: 'pagado' }).in('id', mesaCuenta.pedidos);
                        } catch (_) {}
                    }
                    // Confirmar lo que el mozo ya cobró (no se duplica)
                    if (porConfirmarIds.length) {
                        try {
                            await sbPOS.from('pedidos').update({ metodo_pago_estado: 'pagado' }).in('id', porConfirmarIds);
                        } catch (_) {}
                    }
                    // Cerrar mesa: se cobró todo, pasa a mantenimiento hasta habilitar
                    if (selectedMesa && selectedMesa.id) {
                        try {
                            await sbPOS.from('mesas').update({ estado: 'mantenimiento' }).eq('id', selectedMesa.id);
                        } catch (_) {}
                    }
                }catch(e){ console.log('POS insert error', e.message); }
            }
            // Save to localStorage (fallback)
            const orders = JSON.parse(localStorage.getItem('urbanflow_orders') || '[]');
            orders.push(pedido);
            localStorage.setItem('urbanflow_orders', JSON.stringify(orders));

            // Update table status: cobrada = mantenimiento
            if (selectedMesa) {
                const table = tables.find(t => t.id === selectedMesa.id);
                if (table) table.estado = 'mantenimiento';
                selectedMesa.estado = 'mantenimiento';
            }

            // Update stock
            currentOrder.forEach(item => {
                const product = products.find(p => p.id === item.productId);
                if (product) product.stock -= item.qty;
            });

            // Show confirmation
            alert(`Pedido #${pedido.numero} creado\nCaja: $${subtotal}${cuentaExtra > 0 ? `\nCuenta mesa: $${cuentaExtra}` : ''}\nTotal: $${pedido.total_cliente}\nMétodo: ${method === 'efectivo' ? 'Efectivo' : 'MercadoPago'}${method === 'efectivo' && recibido ? `\nPaga con: $${totalRecibido} · Vuelto: $${vuelto}` : ''}${selectedMesa ? '\nMesa #' + selectedMesa.numero + ' a mantenimiento 🧹' : ''}`);

            // Reset only the charged table's order (others keep theirs)
            ordersByMesa[mesaKey()] = [];
            currentOrder = ordersByMesa[mesaKey()];
            renderOrder();
            renderProducts();
            renderTables();
            loadCuentaMesa();
            loadMostradorPend();
            loadCobrosMozo();
            loadMapaAbiertos();
            document.getElementById('orderPanel').classList.remove('mobile-active');
        }

        // =============================================
        // ENVIAR A COCINA (sin cobrar)
        // =============================================
        async function sendToKitchen() {
            if (currentOrder.length === 0) { alert('Agregá productos al pedido'); return; }
            if (!empresaIdPOS) { alert('Sin empresa'); return; }
            const r2 = n => Math.round(n * 100) / 100;
            const items = currentOrder.map(o => ({
                nombre: o.nombre + ((o.variantName && o.variantName !== 'Único') ? ' - ' + o.variantName : ''),
                cantidad: o.qty,
                precio: o.precio,
                foto: o.foto_url || ''
            }));
            const total = r2(items.reduce((a, i) => a + (i.precio * i.cantidad), 0));
            try {
                const { data: ins, error } = await sbPOS.from('pedidos').insert({
                    empresa_id: empresaIdPOS,
                    mesa_token: selectedMesa?.id || '',
                    mesa_numero: selectedMesa?.numero || 0,
                    cliente_nombre: selectedMesa ? 'Mesa #' + selectedMesa.numero : 'Mostrador',
                    cliente_token: 'pos_cocina_' + Date.now(),
                    items: JSON.stringify(items),
                    total: total,
                    estado: 'recibido',
                    tipo_entrega: selectedMesa ? 'Mesa' : 'mostrador',
                    metodo_pago_estado: 'pendiente',
                    notas: 'POS sectores - ' + (selectedMesa ? 'Mesa ' + selectedMesa.numero : 'Mostrador') + (selectedMesa?.camarero_nombre ? ' · Mozo: ' + selectedMesa.camarero_nombre : '')
                }).select();
                if (error) throw error;
                try {
                    if (ins && ins[0]) {
                        await sbPOS.from('pedidos').update({ cajero_id: currentUser?.id || null, cajero_nombre: currentUser?.nombre || null }).eq('id', ins[0].id);
                    }
                } catch (_) {}
                // La mesa queda ocupada en la DB para que la vean todos
                if (selectedMesa && selectedMesa.id) {
                    try { await sbPOS.from('mesas').update({ estado: 'ocupada' }).eq('id', selectedMesa.id); } catch (_) {}
                }
                alert('Enviado a sectores 📤\n' + (selectedMesa ? 'Mesa #' + selectedMesa.numero : 'Mostrador') + ' · $' + total);
                ordersByMesa[mesaKey()] = [];
                currentOrder = ordersByMesa[mesaKey()];
                renderOrder();
                loadCuentaMesa();
                loadMostradorPend();
                loadCobrosMozo();
                loadMapaAbiertos();
                document.getElementById('orderPanel').classList.remove('mobile-active');
                if (selectedMesa) {
                    const t = tables.find(t => t.id === selectedMesa.id);
                    if (t) t.estado = 'ocupada';
                    renderTables();
                }
            } catch (e) { alert('Error al enviar: ' + e.message); }
        }

        async function loadMostradorPend() {
            const box = document.getElementById('mostradorPendBox');
            if (!box) return;
            if (selectedMesa || !empresaIdPOS) { box.innerHTML = ''; return; }
            try {
                const desde = new Date(); desde.setHours(0, 0, 0, 0);
                const { data, error } = await sbPOS.from('pedidos').select('id,numero,cliente_nombre,total,created_at')
                    .eq('empresa_id', empresaIdPOS).eq('tipo_entrega', 'mostrador')
                    .neq('estado', 'entregado').neq('estado', 'cancelado')
                    .neq('metodo_pago_estado', 'pagado')
                    .gte('created_at', desde.toISOString()).order('created_at', { ascending: true });
                if (error) throw error;
                const list = data || [];
                if (!list.length) { box.innerHTML = ''; return; }
                box.innerHTML = `
                    <div style="border:1px solid var(--orange);border-radius:8px;padding:10px 12px;margin:0 12px 10px;background:rgba(255,152,0,0.07)">
                        <div style="font-size:12px;font-weight:700;margin-bottom:8px;">⏳ Mostrador por cobrar (${list.length})</div>
                        ${list.map(p => `
                            <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;font-size:12px;">
                                <span style="flex:1;">#${p.numero || String(p.id).substring(0,4)} · $${Math.round(p.total || 0)}</span>
                                <button onclick="cobrarMostrador('${p.id}','efectivo')" style="padding:6px 10px;background:var(--green);color:#fff;border:none;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;">💵</button>
                                <button onclick="cobrarMostrador('${p.id}','mercado_pago')" style="padding:6px 10px;background:var(--blue);color:#fff;border:none;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;">💳</button>
                            </div>`).join('')}
                    </div>`;
            } catch (e) { box.innerHTML = ''; }
        }

        async function cobrarMostrador(id, method) {
            try {
                const { error } = await sbPOS.from('pedidos').update({ metodo_pago: method, metodo_pago_estado: 'pagado' }).eq('id', id);
                if (error) throw error;
                loadMostradorPend();
                loadCobrosMozo();
            } catch (e) { alert('Error al cobrar: ' + e.message); }
        }

        // =============================================
        // COBROS DEL MOZO POR CONFIRMAR
        // =============================================
        async function loadCobrosMozo() {
            const box = document.getElementById('cobrosMozoBox');
            if (!box) return;
            if (!empresaIdPOS) { box.innerHTML = ''; return; }
            try {
                const desde = new Date(); desde.setHours(0, 0, 0, 0);
                const { data, error } = await sbPOS.from('pedidos').select('id,mesa_numero,total,metodo_pago,notas,created_at')
                    .eq('empresa_id', empresaIdPOS).eq('metodo_pago_estado', 'por_confirmar')
                    .gte('created_at', desde.toISOString()).order('created_at', { ascending: true });
                if (error) throw error;
                const groups = {};
                (data || []).forEach(p => {
                    const k = p.mesa_numero || ('P' + p.id);
                    if (!groups[k]) groups[k] = { mesa: p.mesa_numero, total: 0, metodo: p.metodo_pago || '-', n: 0, paga: null, vuelto: null };
                    groups[k].total += (p.total || 0);
                    groups[k].n++;
                    if (p.metodo_pago) groups[k].metodo = p.metodo_pago;
                    const m = String(p.notas || '').match(/Paga con \$([\d.]+) · Vuelto \$([\d.]+)/);
                    if (m) { groups[k].paga = m[1]; groups[k].vuelto = m[2]; }
                });
                const keys = Object.keys(groups);
                if (!keys.length) { box.innerHTML = ''; return; }
                box.innerHTML = `
                    <div style="border:1px solid var(--accent);border-radius:8px;padding:10px 12px;margin:0 12px 10px;background:rgba(212,175,55,0.07)">
                        <div style="font-size:12px;font-weight:700;margin-bottom:8px;">📋 Cobros del mozo por confirmar (${keys.length})</div>
                        ${keys.map(k => {
                            const g = groups[k];
                            const titulo = g.mesa ? 'Mesa #' + g.mesa : 'Pedido';
                            return `
                            <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;font-size:12px;">
                                <span style="flex:1;">${titulo} · $${Math.round(g.total)} · ${g.metodo}${g.vuelto ? `<br><span style="color:var(--green);font-weight:700">Vuelto $${g.vuelto} → dar al mozo</span>` : ''}</span>
                                <button onclick="confirmarCobro('${g.mesa || ''}')" style="padding:6px 10px;background:var(--green);color:#fff;border:none;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;">✓ Cobrado</button>
                                <button onclick="rechazarCobro('${g.mesa || ''}')" style="padding:6px 10px;background:var(--red);color:#fff;border:none;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;">✕</button>
                            </div>`;
                        }).join('')}
                    </div>`;
            } catch (e) { box.innerHTML = ''; }
        }

        async function confirmarCobro(mesaNumero) {
            try {
                const q = sbPOS.from('pedidos').select('id').eq('empresa_id', empresaIdPOS).eq('metodo_pago_estado', 'por_confirmar');
                const { data, error } = mesaNumero ? await q.eq('mesa_numero', Number(mesaNumero)) : await q;
                if (error) throw error;
                const ids = (data || []).map(p => p.id);
                if (!ids.length) { loadCobrosMozo(); return; }
                const { error: uErr } = await sbPOS.from('pedidos').update({ metodo_pago_estado: 'pagado' }).in('id', ids);
                if (uErr) throw uErr;
                if (mesaNumero) {
                    const t = tables.find(t => String(t.numero) === String(mesaNumero));
                    if (t && t.id) { try { await sbPOS.from('mesas').update({ estado: 'mantenimiento' }).eq('id', t.id); } catch (_) {} t.estado = 'mantenimiento'; }
                    renderTables();
                }
                loadCobrosMozo();
            } catch (e) { alert('Error al confirmar: ' + e.message); }
        }

        async function rechazarCobro(mesaNumero) {
            if (!confirm('Descartar este cobro? Vuelve a pendiente.')) return;
            try {
                const q = sbPOS.from('pedidos').select('id').eq('empresa_id', empresaIdPOS).eq('metodo_pago_estado', 'por_confirmar');
                const { data, error } = mesaNumero ? await q.eq('mesa_numero', Number(mesaNumero)) : await q;
                if (error) throw error;
                const ids = (data || []).map(p => p.id);
                if (!ids.length) { loadCobrosMozo(); return; }
                const { error: uErr } = await sbPOS.from('pedidos').update({ metodo_pago_estado: 'pendiente' }).in('id', ids);
                if (uErr) throw uErr;
                loadCobrosMozo();
                loadCuentaMesa();
            } catch (e) { alert('Error: ' + e.message); }
        }

        // =============================================
        // INIT
        // =============================================
        renderCategories();
        renderProducts();
        renderTables();
        paintOrderMesa();
        loadPOSData();
        loadMostradorPend();
        loadCobrosMozo();
        loadMapaAbiertos();
        loadOnline();
        setInterval(() => { loadCobrosMozo(); loadMapaAbiertos(); loadOnline(); }, 20000);

    </script>
</body>
</html>
