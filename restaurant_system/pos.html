<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UrbanFlow POS - Cajero</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #0a0a0a;
            --bg2: #111111;
            --bg3: #1a1a1a;
            --bg4: #222222;
            --text: #ffffff;
            --text2: #a0a0a0;
            --accent: #d4af37;
            --accent2: #b8962e;
            --green: #4caf50;
            --red: #f44336;
            --blue: #2196f3;
            --orange: #ff9800;
            --purple: #9c27b0;
            --border: #333333;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }

        /* LOGIN */
        .login-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: var(--bg);
        }
        .login-box {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 40px;
            width: 350px;
            text-align: center;
        }
        .login-box h1 { color: var(--accent); margin-bottom: 10px; font-size: 24px; }
        .login-box p { color: var(--text2); margin-bottom: 30px; font-size: 14px; }
        .pin-display {
            font-size: 36px;
            font-weight: 700;
            letter-spacing: 15px;
            margin-bottom: 20px;
            min-height: 50px;
            color: var(--accent);
        }
        .pin-pad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .pin-btn {
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            font-size: 24px;
            font-weight: 700;
            color: var(--text);
            cursor: pointer;
            transition: all 0.2s;
        }
        .pin-btn:hover { background: var(--bg4); border-color: var(--accent); }
        .pin-btn:active { transform: scale(0.95); }
        .pin-btn.clear { background: var(--red); color: white; }
        .pin-btn.enter { background: var(--accent); color: var(--bg); grid-column: span 2; }
        .pin-error { color: var(--red); font-size: 12px; margin-top: 10px; }

        /* APP */
        .app { display: none; height: 100vh; }
        .app.active { display: grid; grid-template-columns: 1fr 380px; }

        /* LEFT - PRODUCTS */
        .products-panel {
            display: flex;
            flex-direction: column;
            background: var(--bg);
            border-right: 1px solid var(--border);
        }

        /* Top bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: var(--bg2);
            border-bottom: 1px solid var(--border);
        }
        .top-bar-left { display: flex; align-items: center; gap: 15px; }
        .top-bar h2 { font-size: 16px; color: var(--accent); }
        .mesa-btn {
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 16px;
            color: var(--text);
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .mesa-btn:hover { border-color: var(--accent); }
        .mesa-btn.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }
        .top-bar-right { display: flex; align-items: center; gap: 10px; }
        .user-badge {
            background: var(--bg3);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-logout {
            background: var(--red);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
        }

        /* Categories bar */
        .categories-bar {
            display: flex;
            gap: 8px;
            padding: 12px 20px;
            overflow-x: auto;
            background: var(--bg2);
            border-bottom: 1px solid var(--border);
        }
        .cat-btn {
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 8px 16px;
            color: var(--text);
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .cat-btn:hover { border-color: var(--accent); }
        .cat-btn.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }

        /* Products grid */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
            padding: 20px;
            overflow-y: auto;
            flex: 1;
        }
        .product-card {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .product-card:hover { border-color: var(--accent); transform: translateY(-2px); }
        .product-card:active { transform: scale(0.97); }
        .product-card.low-stock { border-color: var(--red); }
        .product-img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: var(--bg3);
            margin: 0 auto 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            overflow: hidden;
        }
        .product-img img { width: 100%; height: 100%; object-fit: cover; }
        .product-name { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
        .product-price { color: var(--accent); font-size: 14px; font-weight: 700; }

        /* RIGHT - ORDER */
        .order-panel {
            display: flex;
            flex-direction: column;
            background: var(--bg2);
        }

        .order-header {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .order-header h3 { font-size: 16px; }
        .order-mesa {
            background: var(--bg3);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            color: var(--accent);
        }

        .order-items {
            flex: 1;
            overflow-y: auto;
            padding: 10px 20px;
        }
        .order-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }
        .order-item-qty {
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 4px 8px;
            font-weight: 700;
            font-size: 14px;
            min-width: 35px;
            text-align: center;
        }
        .order-item-info { flex: 1; }
        .order-item-name { font-size: 13px; font-weight: 500; }
        .order-item-price { font-size: 12px; color: var(--text2); }
        .order-item-total { font-weight: 700; font-size: 14px; }
        .order-item-remove {
            background: none;
            border: none;
            color: var(--red);
            cursor: pointer;
            font-size: 16px;
            padding: 5px;
        }
        .order-empty {
            text-align: center;
            padding: 40px 20px;
            color: var(--text2);
        }
        .order-empty i { font-size: 40px; margin-bottom: 10px; display: block; }

        .order-footer {
            padding: 15px 20px;
            border-top: 1px solid var(--border);
            background: var(--bg3);
        }
        .order-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 13px;
        }
        .order-row.total {
            font-size: 18px;
            font-weight: 700;
            color: var(--accent);
            padding-top: 10px;
            border-top: 1px solid var(--border);
            margin-top: 10px;
        }
        .order-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }
        .btn-order {
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-order:hover { transform: translateY(-1px); }
        .btn-cash { background: var(--green); color: white; }
        .btn-mp { background: var(--blue); color: white; grid-column: span 2; }

        /* TABLES MAP */
        .tables-map {
            display: none;
            padding: 20px;
        }
        .tables-map.active { display: block; }
        .tables-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 12px;
        }
        .table-cell {
            aspect-ratio: 1;
            background: var(--bg3);
            border: 2px solid var(--border);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 12px;
        }
        .table-cell:hover { border-color: var(--accent); }
        .table-cell.disponible { border-color: var(--green); }
        .table-cell.ocupada { border-color: var(--red); background: rgba(244, 67, 54, 0.1); }
        .table-cell.reservada { border-color: var(--orange); background: rgba(255, 152, 0, 0.1); }
        .table-cell-number { font-size: 20px; font-weight: 700; }
        .table-cell-status { font-size: 10px; color: var(--text2); margin-top: 4px; }

        /* VARIANT MODAL */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.active { display: flex; }
        .variant-modal {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            width: 350px;
            max-height: 80vh;
            overflow-y: auto;
        }
        .variant-modal h3 { margin-bottom: 15px; font-size: 18px; }
        .variant-btn {
            width: 100%;
            padding: 14px;
            margin-bottom: 10px;
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 14px;
            cursor: pointer;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .variant-btn:hover { border-color: var(--accent); background: var(--bg4); }
        .variant-name { font-weight: 600; }
        .variant-price { color: var(--accent); font-weight: 700; }
        .variant-close {
            width: 100%;
            padding: 12px;
            background: var(--bg4);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text2);
            font-size: 13px;
            cursor: pointer;
            margin-top: 10px;
        }

        /* SEARCH */
        .search-box {
            padding: 10px 20px;
            background: var(--bg2);
            border-bottom: 1px solid var(--border);
        }
        .search-input {
            width: 100%;
            padding: 10px 14px 10px 36px;
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 14px;
        }
        .search-input:focus { outline: none; border-color: var(--accent); }
        .search-icon {
            position: absolute;
            left: 32px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text2);
        }
        .search-wrapper { position: relative; }

        @media (max-width: 900px) {
            .app.active { grid-template-columns: 1fr; }
            .order-panel { display: none; }
            .order-panel.mobile-active { display: flex; position: fixed; top: 0; right: 0; bottom: 0; width: 350px; z-index: 50; }
        }
    </style>
</head>
<body>
    <!-- LOGIN SCREEN -->
    <div class="login-screen" id="loginScreen">
        <div class="login-box">
            <h1><i class="fas fa-utensils"></i> UrbanFlow POS</h1>
            <p>Ingresá tu PIN para comenzar</p>
            <div class="pin-display" id="pinDisplay"></div>
            <div class="pin-pad">
                <button class="pin-btn" onclick="addPin('1')">1</button>
                <button class="pin-btn" onclick="addPin('2')">2</button>
                <button class="pin-btn" onclick="addPin('3')">3</button>
                <button class="pin-btn" onclick="addPin('4')">4</button>
                <button class="pin-btn" onclick="addPin('5')">5</button>
                <button class="pin-btn" onclick="addPin('6')">6</button>
                <button class="pin-btn" onclick="addPin('7')">7</button>
                <button class="pin-btn" onclick="addPin('8')">8</button>
                <button class="pin-btn" onclick="addPin('9')">9</button>
                <button class="pin-btn clear" onclick="clearPin()"><i class="fas fa-backspace"></i></button>
                <button class="pin-btn" onclick="addPin('0')">0</button>
                <button class="pin-btn enter" onclick="enterPin()">INGRESAR</button>
            </div>
            <div class="pin-error" id="pinError"></div>
        </div>
    </div>

    <!-- APP -->
    <div class="app" id="app">
        <!-- LEFT PANEL - PRODUCTS -->
        <div class="products-panel">
            <div class="top-bar">
                <div class="top-bar-left">
                    <h2><i class="fas fa-utensils"></i> <span id="posRestaurantName"></span></h2>
                    <button class="mesa-btn" id="mesaBtn" onclick="showTablesMap()">
                        <i class="fas fa-chair"></i> Mesa #
                    </button>
                </div>
                <div class="top-bar-right">
                    <div class="user-badge">
                        <i class="fas fa-user"></i>
                        <span id="cashierName">Cajero</span>
                    </div>
                    <button class="btn-logout" onclick="logoutPOS()">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
            </div>

            <div class="categories-bar" id="categoriesBar"></div>

            <div class="search-wrapper">
                <i class="fas fa-search search-icon"></i>
                <input type="text" class="search-input" id="searchInput" placeholder="Buscar producto..." oninput="filterProducts()">
            </div>

            <div class="products-grid" id="productsGrid"></div>

            <!-- TABLES MAP (hidden by default) -->
            <div class="tables-map" id="tablesMap">
                <h3 style="margin-bottom: 15px;"><i class="fas fa-map"></i> Mapa de Mesas</h3>
                <div class="tables-grid" id="tablesGrid"></div>
            </div>
        </div>

        <!-- RIGHT PANEL - ORDER -->
        <div class="order-panel" id="orderPanel">
            <div class="order-header">
                <h3><i class="fas fa-receipt"></i> Pedido</h3>
                <div class="order-mesa" id="orderMesa">Sin mesa</div>
            </div>

            <div class="order-items" id="orderItems">
                <div class="order-empty">
                    <i class="fas fa-shopping-cart"></i>
                    <p>Agregar productos</p>
                </div>
            </div>

            <div class="order-footer">
                <div class="order-row">
                    <span>Subtotal</span>
                    <span id="subtotal">$0</span>
                </div>
                <div class="order-row">
                    <span>Fee UF (2 UI)</span>
                    <span id="feeUF">$0</span>
                </div>
                <div class="order-row">
                    <span>Fee MP (7.88%)</span>
                    <span id="feeMP">$0</span>
                </div>
                <div class="order-row total">
                    <span>TOTAL</span>
                    <span id="totalOrder">$0</span>
                </div>
                <div class="order-actions">
                    <button class="btn-order btn-cash" onclick="payOrder('efectivo')">
                        <i class="fas fa-money-bill"></i> Efectivo
                    </button>
                    <button class="btn-order btn-mp" onclick="payOrder('mercado_pago')">
                        <i class="fas fa-credit-card"></i> MercadoPago
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- VARIANT MODAL -->
    <div class="modal-overlay" id="variantModal">
        <div class="variant-modal">
            <h3 id="variantTitle">Seleccionar opción</h3>
            <div id="variantOptions"></div>
            <button class="variant-close" onclick="closeVariantModal()">Cancelar</button>
        </div>
    </div>

    <script>
        // =============================================
        // CONFIG
        // =============================================
        const UF_FEE_UI = 2;
        const MP_FEE_PCT = 7.88;
        const VALOR_UI = 6.50;

        // =============================================
        // DATA
        // =============================================
        let currentUser = null;
        let selectedMesa = null;
        let currentCategory = 'all';
        let currentOrder = [];

        const employees = [
            { id: "emp_002", nombre: "María García", pin: "1234", roles: ["rol_cajero"], email: "maria@laparrilla.com.uy" },
            { id: "emp_003", nombre: "Pedro Martínez", pin: "5678", roles: ["rol_cocinero"], email: "pedro@laparrilla.com.uy" },
            { id: "emp_001", nombre: "Carlos López", pin: "0000", roles: ["rol_dueno"], email: "carlos@laparrilla.com.uy" }
        ];

        const categories = [
            { id: 'all', nombre: 'Todos', icono: '📋' },
            { id: 'cat_001', nombre: 'Entradas', icono: '🥗' },
            { id: 'cat_002', nombre: 'Parrilla', icono: '🥩' },
            { id: 'cat_003', nombre: 'Pizzas', icono: '🍕' },
            { id: 'cat_004', nombre: 'Pastas', icono: '🍝' },
            { id: 'cat_005', nombre: 'Bebidas', icono: '🍺' },
            { id: 'cat_006', nombre: 'Postres', icono: '🍰' }
        ];

        const products = [
            { id: 'prod_001', nombre: 'Hamburguesa', precio: 400, foto: '🍔', categorias: ['cat_001'], variantes: [{nombre:'Simple',precio:400},{nombre:'Doble',precio:550}], stock: 50 },
            { id: 'prod_002', nombre: 'Pilsen 1870', precio: 180, foto: '🍺', categorias: ['cat_005'], variantes: [{nombre:'Lata 473ml',precio:180},{nombre:'Botella 330ml',precio:150}], stock: 100 },
            { id: 'prod_003', nombre: 'Pizza', precio: 380, foto: '🍕', categorias: ['cat_003'], variantes: [{nombre:'Individual',precio:380},{nombre:'Mediana',precio:700},{nombre:'Grande',precio:950}], stock: 30 },
            { id: 'prod_004', nombre: 'Milanesa', precio: 420, foto: '🥩', categorias: ['cat_002'], variantes: [{nombre:'Simple',precio:420},{nombre:'Napolitana',precio:520}], stock: 40 },
            { id: 'prod_005', nombre: 'Coca-Cola', precio: 120, foto: '🥤', categorias: ['cat_005'], variantes: [{nombre:'Lata',precio:100},{nombre:'Botella 500ml',precio:120},{nombre:'1.5L',precio:200}], stock: 150 },
            { id: 'prod_006', nombre: 'Ensalada', precio: 320, foto: '🥗', categorias: ['cat_001'], variantes: [{nombre:'Sin pollo',precio:320},{nombre:'Con pollo',precio:420}], stock: 25 },
            { id: 'prod_007', nombre: 'Papas Fritas', precio: 180, foto: '🍟', categorias: ['cat_001'], variantes: [{nombre:'Chicas',precio:180},{nombre:'Grandes',precio:280}], stock: 60 },
            { id: 'prod_008', nombre: 'Lomito', precio: 450, foto: '🍖', categorias: ['cat_002'], variantes: [{nombre:'Simple',precio:450},{nombre:'Completo',precio:580}], stock: 35 },
            { id: 'prod_009', nombre: 'Agua', precio: 65, foto: '💧', categorias: ['cat_005'], variantes: [{nombre:'500ml',precio:40},{nombre:'1.5L',precio:65}], stock: 200 },
            { id: 'prod_010', nombre: 'Helado', precio: 150, foto: '🍦', categorias: ['cat_006'], variantes: [{nombre:'1 bola',precio:150},{nombre:'2 bolas',precio:250},{nombre:'3 bolas',precio:350}], stock: 40 },
            { id: 'prod_011', nombre: 'Torta', precio: 200, foto: '🍰', categorias: ['cat_006'], variantes: [{nombre:'Porción',precio:200}], stock: 15 },
            { id: 'prod_012', nombre: 'Empanadas', precio: 80, foto: '🥟', categorias: ['cat_001'], variantes: [{nombre:'Carne',precio:80},{nombre:'Pollo',precio:80},{nombre:'Queso',precio:85}], stock: 100 }
        ];

        const tables = [
            { id: 1, numero: 1, estado: 'disponible', capacidad: 4 },
            { id: 2, numero: 2, estado: 'disponible', capacidad: 4 },
            { id: 3, numero: 3, estado: 'ocupada', capacidad: 2 },
            { id: 4, numero: 4, estado: 'disponible', capacidad: 6 },
            { id: 5, numero: 5, estado: 'reservada', capacidad: 4 },
            { id: 6, numero: 6, estado: 'disponible', capacidad: 8 },
            { id: 7, numero: 7, estado: 'ocupada', capacidad: 4 },
            { id: 8, numero: 8, estado: 'disponible', capacidad: 2 }
        ];

        // =============================================
        // PIN LOGIN
        // =============================================
        let pinInput = '';

        function addPin(n) {
            if (pinInput.length < 4) {
                pinInput += n;
                document.getElementById('pinDisplay').textContent = pinInput;
            }
        }

        function clearPin() {
            pinInput = pinInput.slice(0, -1);
            document.getElementById('pinDisplay').textContent = pinInput;
        }

        function enterPin() {
            const emp = employees.find(e => e.pin === pinInput && e.activo !== false);
            if (emp) {
                currentUser = emp;
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('app').classList.add('active');
                document.getElementById('cashierName').textContent = emp.nombre;
                renderCategories();
                renderProducts();
                renderTables();
            } else {
                document.getElementById('pinError').textContent = 'PIN incorrecto';
                pinInput = '';
                document.getElementById('pinDisplay').textContent = '';
                setTimeout(() => document.getElementById('pinError').textContent = '', 2000);
            }
        }

        function logoutPOS() {
            currentUser = null;
            pinInput = '';
            document.getElementById('pinDisplay').textContent = '';
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('app').classList.remove('active');
        }

        // =============================================
        // CATEGORIES
        // =============================================
        function renderCategories() {
            document.getElementById('categoriesBar').innerHTML = categories.map(c => `
                <button class="cat-btn ${c.id === currentCategory ? 'active' : ''}" onclick="selectCategory('${c.id}')">
                    ${c.icono} ${c.nombre}
                </button>
            `).join('');
        }

        function selectCategory(id) {
            currentCategory = id;
            renderCategories();
            renderProducts();
        }

        // =============================================
        // PRODUCTS
        // =============================================
        function renderProducts() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            let filtered = products.filter(p => {
                const matchCategory = currentCategory === 'all' || p.categorias.includes(currentCategory);
                const matchSearch = p.nombre.toLowerCase().includes(search);
                return matchCategory && matchSearch;
            });

            document.getElementById('productsGrid').innerHTML = filtered.map(p => `
                <div class="product-card ${p.stock < 10 ? 'low-stock' : ''}" onclick="selectProduct('${p.id}')">
                    <div class="product-img">${p.foto}</div>
                    <div class="product-name">${p.nombre}</div>
                    <div class="product-price">$${p.precio}</div>
                </div>
            `).join('');

            document.getElementById('tablesMap').classList.remove('active');
            document.getElementById('productsGrid').style.display = 'grid';
        }

        function filterProducts() {
            renderProducts();
        }

        function selectProduct(id) {
            const product = products.find(p => p.id === id);
            if (!product) return;

            if (product.variantes.length > 1) {
                showVariantModal(product);
            } else {
                addToOrder(product, product.variantes[0]);
            }
        }

        function showVariantModal(product) {
            document.getElementById('variantTitle').textContent = product.nombre;
            document.getElementById('variantOptions').innerHTML = product.variantes.map((v, i) => `
                <button class="variant-btn" onclick="selectVariant('${product.id}', ${i})">
                    <span class="variant-name">${v.nombre}</span>
                    <span class="variant-price">$${v.precio}</span>
                </button>
            `).join('');
            document.getElementById('variantModal').classList.add('active');
        }

        function closeVariantModal() {
            document.getElementById('variantModal').classList.remove('active');
        }

        function selectVariant(productId, variantIndex) {
            const product = products.find(p => p.id === productId);
            addToOrder(product, product.variantes[variantIndex]);
            closeVariantModal();
        }

        // =============================================
        // ORDER
        // =============================================
        function addToOrder(product, variant) {
            const existing = currentOrder.find(o => o.productId === product.id && o.variantName === variant.nombre);
            if (existing) {
                existing.qty++;
            } else {
                currentOrder.push({
                    productId: product.id,
                    nombre: product.nombre,
                    variantName: variant.nombre,
                    precio: variant.precio,
                    qty: 1,
                    foto: product.foto
                });
            }
            renderOrder();
        }

        function removeFromOrder(index) {
            currentOrder.splice(index, 1);
            renderOrder();
        }

        function changeQty(index, delta) {
            currentOrder[index].qty += delta;
            if (currentOrder[index].qty <= 0) {
                currentOrder.splice(index, 1);
            }
            renderOrder();
        }

        function renderOrder() {
            const container = document.getElementById('orderItems');
            
            if (currentOrder.length === 0) {
                container.innerHTML = '<div class="order-empty"><i class="fas fa-shopping-cart"></i><p>Agregar productos</p></div>';
                document.getElementById('subtotal').textContent = '$0';
                document.getElementById('feeUF').textContent = '$0';
                document.getElementById('feeMP').textContent = '$0';
                document.getElementById('totalOrder').textContent = '$0';
                return;
            }

            container.innerHTML = currentOrder.map((item, i) => `
                <div class="order-item">
                    <span style="font-size: 24px;">${item.foto}</span>
                    <div class="order-item-info">
                        <div class="order-item-name">${item.nombre} - ${item.variantName}</div>
                        <div class="order-item-price">$${item.precio} c/u</div>
                    </div>
                    <button class="order-item-qty" onclick="changeQty(${i}, -1)">-</button>
                    <span class="order-item-qty">${item.qty}</span>
                    <button class="order-item-qty" onclick="changeQty(${i}, 1)">+</button>
                    <div class="order-item-total">$${item.precio * item.qty}</div>
                    <button class="order-item-remove" onclick="removeFromOrder(${i})">
                        <i class="fas fa-trash"></i>
                    </button>
                </div>
            `).join('');

            const subtotal = currentOrder.reduce((a, item) => a + (item.precio * item.qty), 0);
            const feeUF = UF_FEE_UI * VALOR_UI;
            const totalCliente = subtotal + feeUF;
            const feeMP = totalCliente * (MP_FEE_PCT / 100);

            document.getElementById('subtotal').textContent = '$' + subtotal.toLocaleString();
            document.getElementById('feeUF').textContent = '$' + feeUF.toLocaleString();
            document.getElementById('feeMP').textContent = '$' + Math.round(feeMP).toLocaleString();
            document.getElementById('totalOrder').textContent = '$' + Math.round(totalCliente).toLocaleString();
        }

        // =============================================
        // TABLES MAP
        // =============================================
        function showTablesMap() {
            document.getElementById('productsGrid').style.display = 'none';
            document.getElementById('tablesMap').classList.add('active');
            renderTables();
        }

        function renderTables() {
            document.getElementById('tablesGrid').innerHTML = tables.map(t => `
                <div class="table-cell ${t.estado}" onclick="selectTable(${t.id})">
                    <div class="table-cell-number">${t.numero}</div>
                    <div class="table-cell-status">${t.estado}</div>
                    <div style="font-size: 10px; color: var(--text2);">${t.capacidad} pers.</div>
                </div>
            `).join('');
        }

        function selectTable(id) {
            const table = tables.find(t => t.id === id);
            selectedMesa = table;
            document.getElementById('mesaBtn').textContent = 'Mesa #' + table.numero;
            document.getElementById('mesaBtn').classList.add('active');
            document.getElementById('orderMesa').textContent = 'Mesa #' + table.numero;
            showProductsView();
        }

        function showProductsView() {
            document.getElementById('tablesMap').classList.remove('active');
            document.getElementById('productsGrid').style.display = 'grid';
            renderProducts();
        }

        // =============================================
        // PAYMENT
        // =============================================
        function payOrder(method) {
            if (currentOrder.length === 0) {
                alert('Agregá productos al pedido');
                return;
            }

            const subtotal = currentOrder.reduce((a, item) => a + (item.precio * item.qty), 0);
            const feeUF = UF_FEE_UI * VALOR_UI;
            const totalCliente = subtotal + feeUF;
            const feeMP = totalCliente * (MP_FEE_PCT / 100);
            const totalRecibido = totalCliente - feeMP - feeUF;

            const pedido = {
                id: 'ped_' + Date.now(),
                numero: Math.floor(Math.random() * 9000) + 1000,
                cliente_nombre: selectedMesa ? 'Mesa #' + selectedMesa.numero : 'Counter',
                tipo: selectedMesa ? 'local' : 'counter',
                estado: 'recibido',
                items: currentOrder.map(o => ({
                    nombre: o.nombre + ' - ' + o.variantName,
                    cantidad: o.qty,
                    precio_unitario: o.precio,
                    subtotal: o.precio * o.qty
                })),
                subtotal: subtotal,
                uf_fee_ui: UF_FEE_UI,
                uf_fee_monto: feeUF,
                mp_fee_porcentaje: MP_FEE_PCT,
                mp_fee_monto: Math.round(feeMP),
                total_cliente: Math.round(totalCliente),
                total_recibido: Math.round(totalRecibido),
                metodo_pago: method,
                mesa_id: selectedMesa?.id || null,
                created_at: new Date().toISOString()
            };

            // Save to localStorage
            const orders = JSON.parse(localStorage.getItem('urbanflow_orders') || '[]');
            orders.push(pedido);
            localStorage.setItem('urbanflow_orders', JSON.stringify(orders));

            // Update table status
            if (selectedMesa) {
                const table = tables.find(t => t.id === selectedMesa.id);
                if (table) table.estado = 'ocupada';
            }

            // Update stock
            currentOrder.forEach(item => {
                const product = products.find(p => p.id === item.productId);
                if (product) product.stock -= item.qty;
            });

            // Show confirmation
            alert(`Pedido #${pedido.numero} creado\nTotal: $${pedido.total_cliente}\nMétodo: ${method === 'efectivo' ? 'Efectivo' : 'MercadoPago'}`);

            // Reset order
            currentOrder = [];
            selectedMesa = null;
            document.getElementById('mesaBtn').textContent = 'Mesa #';
            document.getElementById('mesaBtn').classList.remove('active');
            document.getElementById('orderMesa').textContent = 'Sin mesa';
            renderOrder();
            renderProducts();
            renderTables();
        }

        // =============================================
        // INIT
        // =============================================
        renderCategories();
        renderProducts();
    </script>
</body>
</html>
