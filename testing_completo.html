        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0d1117;color:#c9d1d9}
        .hdr{background:#161b22;padding:14px 20px;border-bottom:1px solid #30363d;position:sticky;top:0;z-index:100}
        .hdr h1{font-size:18px;color:#fff}
        .hdr p{font-size:11px;color:#8b949e;margin-top:3px}
        .pbar{height:6px;background:#21262d;border-radius:3px;overflow:hidden;margin-top:10px}
        .pfill{height:100%;background:#3fb950;border-radius:3px;transition:width .3s}
        .ptxt{font-size:11px;color:#8b949e;margin-top:3px}
        .apps{display:flex;gap:0;background:#161b22;border-bottom:1px solid #30363d}
        .app{flex:1;padding:16px;cursor:pointer;text-align:center;border-bottom:3px solid transparent;font-weight:700;font-size:15px;color:#8b949e;transition:all .2s}
        .app.on{color:#58a6ff;border-bottom-color:#58a6ff;background:#0d1117}
        .app:hover{color:#c9d1d9}
        .app small{display:block;font-size:11px;font-weight:400;color:#484f58;margin-top:2px}
        .cnt{max-width:900px;margin:0 auto;padding:20px}
        .pg{display:none}.pg.on{display:block}
        .fl{background:#161b22;border:1px solid #30363d;border-radius:10px;margin-bottom:12px;overflow:hidden}
        .fh{padding:12px 16px;background:#21262d;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
        .fh h3{font-size:13px;color:#fff;display:flex;align-items:center;gap:6px}
        .fh .cnt2{font-size:11px;color:#8b949e}
        .bd{padding:3px 8px;border-radius:10px;font-size:10px;font-weight:600}
        .b1{background:#0d2a55;color:#58a6ff}.b2{background:#1a3a2a;color:#3fb950}
        .b3{background:#3a1a1a;color:#f85149}.b4{background:#2a1a3a;color:#bc8cff}.b5{background:#2a2a1a;color:#d29922}
        .fb{padding:14px;display:none}.fb.on{display:block}
        .st{display:flex;gap:10px;margin-bottom:8px;padding:10px 12px;background:#0d1117;border-radius:7px;border-left:3px solid #30363d;cursor:pointer;user-select:none}
        .st:hover{background:#161b22}
        .st[data-s="p"]{border-left-color:#3fb950;background:#0d2a1a}
        .st[data-s="f"]{border-left-color:#f85149;background:#2a0d0d}
        .st[data-s="s"]{border-left-color:#d29922;background:#2a2a0d}
        .sn{width:24px;height:24px;border-radius:50%;background:#21262d;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0}
        .st[data-s="p"] .sn{background:#3fb950;color:#000}
        .st[data-s="f"] .sn{background:#f85149;color:#fff}
        .st[data-s="s"] .sn{background:#d29922;color:#000}
        .sc{flex:1;min-width:0}
        .sti{font-weight:600;font-size:12px;margin-bottom:2px}
        .std{font-size:11px;color:#8b949e}
        .sta{margin-top:3px;padding:4px 7px;background:#21262d;border-radius:4px;font-size:10px;font-family:monospace;color:#79c0ff}
        .str{margin-top:3px;padding:4px 7px;border-radius:4px;font-size:10px}
        .r1{background:#1a3a2a;color:#3fb950}.r2{background:#3a1a1a;color:#f85149}.r3{background:#2a2a1a;color:#d29922}
        .ss{font-size:10px;font-weight:600;padding:2px 6px;border-radius:4px;flex-shrink:0;align-self:center}
        .s1{background:#21262d;color:#484f58}.s2{background:#1a3a2a;color:#3fb950}
        .s3{background:#3a1a1a;color:#f85149}.s4{background:#2a2a1a;color:#d29922}
        .sb{font-size:8px;background:#0d2a55;color:#58a6ff;padding:1px 4px;border-radius:3px;margin-left:3px}
        .nd{font-size:8px;color:#d29922;margin-left:3px}
        .sn2{margin-top:5px;display:none}
        .st[data-s="f"] .sn2,.st[data-s="s"] .sn2,.st.wn .sn2{display:block}
        .sn2 textarea{width:100%;background:#161b22;border:1px solid #30363d;color:#c9d1d9;padding:5px 7px;border-radius:4px;font-size:10px;font-family:inherit;resize:vertical;min-height:26px;outline:none}

        .sn2 textarea::placeholder{color:#484f58}
        .snl{font-size:9px;color:#8b949e;margin-bottom:2px}
        .rbtn{background:#21262d;border:1px solid #30363d;color:#8b949e;padding:6px 12px;border-radius:5px;cursor:pointer;font-size:11px;margin-top:10px}

        .lg{display:flex;gap:12px;margin-bottom:12px;font-size:10px;flex-wrap:wrap;align-items:center}

        .ld{width:8px;height:8px;border-radius:50%}

</head>

var S={},N={};
function ld(){try{S=JSON.parse(localStorage.getItem('ts3')||'{}')}catch(e){S={}}try{N=JSON.parse(localStorage.getItem('tn3')||'{}')}catch(e){N={}}}
function sv(){localStorage.setItem('ts3',JSON.stringify(S));localStorage.setItem('tn3',JSON.stringify(N))}
function gs(k,si){return S[si]||S[k]||'n'}
function ns(c){var o=['n','p','f','s'];return o[(o.indexOf(c)+1)%4]}
function sl(c){return{p:'✓ OK',f:'✗ ERR',s:'→ SKIP',n:''}[c]||''}

function tot(){var n=0;['c','ch','e'].forEach(function(a){DATA[a].forEach(function(g){g.flows.forEach(function(f){n+=f.steps.length})})});return n}
function cntApp(a){var p=0,t=0;DATA[a].forEach(function(g){g.flows.forEach(function(f){f.steps.forEach(function(s,i){t++;if(gs(f.id+'_'+i,s.si)==='p')p++})})});return{p:p,t:t}}

function upd(){
  var all=0,done=0;
  ['c','ch','e'].forEach(function(a){DATA[a].forEach(function(g){g.flows.forEach(function(f){f.steps.forEach(function(s,i){all++;if(gs(f.id+'_'+i,s.si)==='p')done++})})})});
  var pct=all>0?Math.round(done/all*100):0;
  document.getElementById('gBar').style.width=pct+'%';
  document.getElementById('gText').textContent=done+' / '+all+' pasos completados ('+pct+'%)';
}

function renderApp(a){
  var h='';
  DATA[a].forEach(function(g){
    h+='<div style="margin-top:16px;margin-bottom:6px;font-size:14px;font-weight:700;color:#58a6ff;padding-bottom:4px;border-bottom:1px solid #21262d">'+g.g+'</div>';
    g.flows.forEach(function(f){
      h+='<div class="fl"><div class="fh" onclick="tog(this)"><h3>'+f.title+'</h3><span class="cnt2">'+f.steps.length+' pasos</span></div><div class="fb">';
      f.steps.forEach(function(s,i){
        var k=f.id+'_'+i;
        var st=gs(k,s.si);
        var shared=s.si&&S[s.si]&&S[s.si]==='p';
        var note=N[s.si]||N[k]||'';
        h+='<div class="st'+(note?' wn':'')+'" data-s="'+st+'" data-k="'+k+'" data-si="'+(s.si||'')+'">';
        h+='<div class="sn" onclick="mark(\''+k+'\',\''+(s.si||'')+'\',this.parentElement)">'+(i+1)+'</div>';
        h+='<div class="sc"><div class="sti" onclick="mark(\''+k+'\',\''+(s.si||'')+'\',this.parentElement.parentElement)">'+s.t;
        if(shared)h+=' <span class="sb">ya hecho</span>';
        if(note)h+=' <span class="nd">●</span>';
        h+='</div>';
        if(s.d)h+='<div class="std">'+s.d+'</div>';
        if(s.a)h+='<div class="sta">'+s.a+'</div>';
        if(s.r)h+='<div class="str r'+s.r+'">'+s.rt+'</div>';
        h+='<div class="sn2"><div class="snl">Observación:</div>';
        h+='<textarea placeholder="Qué falló..." onclick="event.stopPropagation()" oninput="savN(\''+k+'\',\''+(s.si||'')+'\',this)">'+note+'</textarea></div>';
        h+='</div>';
        h+='<div class="ss s'+({n:'1',p:'2',f:'3',s:'4'}[st])+'" onclick="mark(\''+k+'\',\''+(s.si||'')+'\',this.parentElement)">'+sl(st)+'</div>';
        h+='</div>';
      });
      h+='</div></div>';
    });
  });
  document.getElementById('p-'+a).innerHTML=h;
}

function render(){renderApp('c');renderApp('ch');renderApp('e');upd()}

function go(a){
  document.querySelectorAll('.pg').forEach(function(p){p.className='pg'});
  document.querySelectorAll('.app').forEach(function(p){p.className='app'});
  document.getElementById('p-'+a).className='pg on';
  document.getElementById('app-'+a).className='app on';
}

function tog(el){el.nextElementSibling.classList.toggle('on')}

function mark(k,si,el){
  var cur=gs(k,si);
  var nxt=ns(cur);
  if(si)S[si]=nxt;
  S[k]=nxt;
  sv();
  // update all steps with same si
  document.querySelectorAll('.st').forEach(function(s){
    var sk=s.getAttribute('data-k');
    var ssi=s.getAttribute('data-si');
    var st=gs(sk,ssi);
    s.setAttribute('data-s',st);
    s.querySelector('.sn').style.background='';
    var ss=s.querySelector('.ss');
    ss.className='ss s'+({n:'1',p:'2',f:'3',s:'4'}[st]);
    ss.textContent=sl(st);
    var shared=ssi&&S[ssi]&&S[ssi]==='p';
    var ti=s.querySelector('.sti');
    var badge=ti.querySelector('.sb');
    if(shared&&!badge)ti.insertAdjacentHTML('beforeend',' <span class="sb">ya hecho</span>');
    else if(!shared&&badge)badge.remove();
  });
  upd();
}

function savN(k,si,ta){
  var tgt=si||k;N[tgt]=ta.value;sv();
  var s=ta.closest('.st');
  if(ta.value)s.classList.add('wn');else s.classList.remove('wn');
  var ti=s.querySelector('.sti');var dot=ti.querySelector('.nd');
  if(ta.value&&!dot)ti.insertAdjacentHTML('beforeend',' <span class="nd">●</span>');
  else if(!ta.value&&dot)dot.remove();
}

function copyAll(){
  var L=['URBANFLOW - TEST','Fecha: '+new Date().toLocaleString(),''];
  var SI={p:'✓ OK',f:'✗ ERROR',s:'→ SKIP',n:'○'};
  ['c','ch','e'].forEach(function(a){
    var nombre={c:'CONSUMIDOR',ch:'CHOFER',e:'EMPRESA'}[a];
    L.push('=== '+nombre+' ===');
    DATA[a].forEach(function(g){
      L.push('--- '+g.g+' ---');
      g.flows.forEach(function(f){
        L.push('  '+f.title);
        f.steps.forEach(function(s,i){
          var k=f.id+'_'+i;var st=gs(k,s.si);
          L.push('    '+(i+1)+'. '+s.t+' ['+SI[st]+']');
          var n=N[s.si]||N[k];if(n)L.push('      Obs: '+n);
        });
      });
    });
    L.push('');
  });
  var t=L.join('\n');navigator.clipboard.writeText(t).then(function(){alert('Copiado al portapapeles')}).catch(function(){var x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();document.execCommand('copy');document.body.removeChild(x);alert('Copiado')});
}

function resetAll(){if(!confirm('Resetear todo?'))return;S={};N={};sv();render()}

ld();render();
</script>
</body>
