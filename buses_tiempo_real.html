<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buses Montevideo - Tiempo Real</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0f1a; color: #e0e0e0; }
        
        .header { background: #111827; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #1f2937; }
        .header h1 { font-size: 20px; color: #fff; display: flex; align-items: center; gap: 10px; }
        .header h1 span { color: #3b82f6; }
        .status-badge { padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .status-badge.active { background: #064e3b; color: #34d399; }
        .status-badge.inactive { background: #7f1d1d; color: #fca5a5; }
        
        .container { display: flex; height: calc(100vh - 60px); }
        
        .sidebar { width: 340px; background: #111827; border-right: 1px solid #1f2937; padding: 20px; overflow-y: auto; }
        .sidebar h2 { font-size: 14px; color: #9ca3af; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }
        
        .stat-row { display: flex; gap: 8px; margin-bottom: 12px; }
        .stat-card { background: #1f2937; border-radius: 10px; padding: 14px; flex: 1; }
        .stat-card .label { font-size: 11px; color: #6b7280; margin-bottom: 2px; }
        .stat-card .value { font-size: 22px; font-weight: 700; color: #fff; }
        .stat-card .value.green { color: #34d399; }
        .stat-card .value.blue { color: #60a5fa; }
        .stat-card .value.orange { color: #fb923c; }
        
        .company-legend { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
        .company-tag { padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; cursor: pointer; border: 2px solid transparent; transition: all 0.2s; }
        .company-tag.active { border-color: #fff; }
        .company-tag.all { background: #374151; color: #e5e7eb; }
        .company-tag.CUTCSA { background: #1e3a5f; color: #60a5fa; }
        .company-tag.COETC { background: #3b1f4e; color: #c084fc; }
        .company-tag.COME { background: #1a3c2a; color: #34d399; }
        .company-tag.UCOT { background: #4a2c1a; color: #fb923c; }
        
        .controls { margin-bottom: 16px; }
        .controls input { width: 100%; padding: 10px 14px; background: #374151; border: 1px solid #4b5563; border-radius: 8px; color: #fff; font-size: 14px; margin-bottom: 8px; }
        .controls input::placeholder { color: #6b7280; }
        .btn-row { display: flex; gap: 8px; }
        .controls button { flex: 1; padding: 10px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
        .btn-start { background: #059669; color: #fff; }
        .btn-start:hover { background: #047857; }
        .btn-stop { background: #dc2626; color: #fff; }
        .btn-stop:hover { background: #b91c1c; }
        .btn-stop:disabled, .btn-start:disabled { background: #4b5563; color: #6b7280; cursor: not-allowed; }
        
        .bus-list { margin-top: 12px; }
        .bus-item { background: #1f2937; border-radius: 8px; padding: 10px 12px; margin-bottom: 6px; cursor: pointer; transition: background 0.2s; display: flex; align-items: center; gap: 10px; }
        .bus-item:hover { background: #374151; }
        .bus-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
        .bus-dot.CUTCSA { background: #60a5fa; }
        .bus-dot.COETC { background: #c084fc; }
        .bus-dot.COME { background: #34d399; }
        .bus-dot.UCOT { background: #fb923c; }
        .bus-info { flex: 1; min-width: 0; }
        .bus-line { font-weight: 600; font-size: 13px; color: #fff; }
        .bus-detail { font-size: 11px; color: #6b7280; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        #map { flex: 1; }
        
        @media (max-width: 768px) {
            .container { flex-direction: column; }
            .sidebar { width: 100%; height: auto; max-height: 45vh; }
            #map { height: 55vh; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🚌 Buses Montevideo <span>Tiempo Real</span></h1>
        <div class="status-badge inactive" id="statusBadge">DETENIDO</div>
    </div>
    
    <div class="container">
        <div class="sidebar">
            <div class="controls">
                <input type="text" id="lineInput" placeholder="Filtrar línea (ej: 102, G, L1)" value="">
                <div class="btn-row">
                    <button class="btn-start" id="startBtn" onclick="startTracking()">▶ INICIAR</button>
                    <button class="btn-stop" id="stopBtn" onclick="stopTracking()" disabled>⏹ DETENER</button>
                </div>
                <button id="cameraBtn" onclick="toggleCameraFilter()" style="width:100%;padding:10px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;margin-top:8px;background:#374151;color:#e5e7eb;"> TODOS</button>
            </div>
            
            <h2>Empresas</h2>
            <div class="company-legend" id="companyLegend">
                <div class="company-tag all active" onclick="filterCompany('all')">Todas</div>
                <div class="company-tag CUTCSA" onclick="filterCompany('CUTCSA')">CUTCSA</div>
                <div class="company-tag COETC" onclick="filterCompany('COETC')">COETC</div>
                <div class="company-tag COME" onclick="filterCompany('COME')">COME</div>
                <div class="company-tag UCOT" onclick="filterCompany('UCOT')">UCOT</div>
            </div>
            
            <div class="stat-row">
                <div class="stat-card">
                    <div class="label">Buses en mapa</div>
                    <div class="value green" id="busCount">0</div>
                </div>
                <div class="stat-card">
                    <div class="label">Con cámara</div>
                    <div class="value blue" id="cameraCount">0</div>
                </div>
            </div>
            <div class="stat-row">
                <div class="stat-card">
                    <div class="label">Última actualización</div>
                    <div class="value orange" id="lastUpdate">--:--:--</div>
                </div>
            </div>
            
            <div class="bus-list" id="busList">
                <h2>Buses</h2>
            </div>
        </div>
        
        <div id="map"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map, markers = new Map(), isRunning = false, refreshInterval = null;
        let allBuses = [], activeCompany = 'all', showCameraOnly = false;

        const COMPANY_COLORS = { CUTCSA: '#3b82f6', COETC: '#a855f7', COME: '#22c55e', UCOT: '#f97316' };

        const CAMERA_BUSES = new Set([
            "COETC:8","COETC:53","COETC:64","COETC:70","COETC:186","COETC:190","COETC:197","COETC:199","COETC:282","COETC:293",
            "COME:3","COME:34","COME:100","COME:101","COME:103",
            "CUTCSA:1","CUTCSA:4","CUTCSA:16","CUTCSA:18","CUTCSA:30","CUTCSA:33","CUTCSA:34","CUTCSA:35","CUTCSA:37",
            "CUTCSA:50","CUTCSA:55","CUTCSA:57","CUTCSA:62","CUTCSA:79","CUTCSA:83","CUTCSA:87","CUTCSA:88",
            "CUTCSA:160","CUTCSA:161","CUTCSA:168","CUTCSA:185","CUTCSA:196","CUTCSA:199","CUTCSA:202",
            "CUTCSA:211","CUTCSA:214","CUTCSA:350","CUTCSA:359","CUTCSA:361","CUTCSA:483","CUTCSA:533",
            "CUTCSA:583","CUTCSA:623","CUTCSA:637","CUTCSA:800","CUTCSA:1095","CUTCSA:599",
            "UCOT:7","UCOT:38","UCOT:106","UCOT:107","UCOT:155","UCOT:163"
        ]);

        function hasCamera(bus) { return CAMERA_BUSES.has(`${bus.company}:${bus.busId}`); }

        function initMap() {
            map = L.map('map', { zoomControl: true }).setView([-34.903, -56.188], 13);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OpenStreetMap &copy; CARTO',
                maxZoom: 19
            }).addTo(map);
        }

        function busMarkerIcon(color, camera) {
            const size = camera ? 16 : 10;
            const border = camera ? `2px solid ${color}` : `1px solid ${color}88`;
            const shadow = camera ? `0 0 10px ${color}aa` : `0 0 4px ${color}44`;
            return L.divIcon({
                html: `<div style="
                    width:${size}px;height:${size}px;border-radius:50%;
                    background:${color};
                    border:${border};
                    box-shadow:${shadow};
                "></div>`,
                iconSize: [size, size],
                iconAnchor: [size/2, size/2],
                className: ''
            });
        }

        async function fetchBuses() {
            try {
                const line = document.getElementById('lineInput').value.trim();
                const res = await fetch(`/api/buses?lines=${encodeURIComponent(line)}`);
                const json = await res.json();
                if (json.success && Array.isArray(json.data)) {
                    allBuses = json.data;
                    updateMap();
                    updateStats();
                    updateBusList();
                }
            } catch(e) {
                console.error('Error fetching buses:', e);
            }
        }

        function getFilteredBuses() {
            let list = allBuses;
            if (activeCompany !== 'all') list = list.filter(b => b.company === activeCompany);
            if (showCameraOnly) list = list.filter(b => hasCamera(b));
            return list;
        }

        function updateMap() {
            const filtered = getFilteredBuses();
            const filteredIds = new Set(filtered.map(b => `${b.company}:${b.busId}`));
            
            markers.forEach((m, id) => {
                if (!filteredIds.has(id)) { map.removeLayer(m); markers.delete(id); }
            });
            
            filtered.forEach(bus => {
                const key = `${bus.company}:${bus.busId}`;
                const cam = hasCamera(bus);
                const color = COMPANY_COLORS[bus.company] || '#6b7280';
                if (markers.has(key)) {
                    markers.get(key).setLatLng([bus.lat, bus.lng]);
                } else {
                    const marker = L.marker([bus.lat, bus.lng], { icon: busMarkerIcon(color, cam) })
                        .bindPopup(`<b>Bus ${bus.busId}</b><br>Empresa: ${bus.company}<br>Línea: ${bus.line}<br>${bus.origin} → ${bus.destination}<br>Velocidad: ${bus.speed} km/h<br>Cámara: ${cam ? 'Sí' : 'No'}`)
                        .addTo(map);
                    markers.set(key, marker);
                }
            });
        }

        function updateStats() {
            const filtered = getFilteredBuses();
            const cameras = filtered.filter(b => hasCamera(b)).length;
            document.getElementById('busCount').textContent = filtered.length;
            document.getElementById('cameraCount').textContent = cameras;
            document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString('es-UY');
        }

        function updateBusList() {
            const filtered = getFilteredBuses();
            const list = document.getElementById('busList');
            list.innerHTML = '<h2>Buses</h2>';
            
            filtered.slice(0, 100).forEach(bus => {
                const cam = hasCamera(bus);
                const item = document.createElement('div');
                item.className = 'bus-item';
                item.onclick = () => { map.setView([bus.lat, bus.lng], 16); };
                item.innerHTML = `
                    <div class="bus-dot ${bus.company}" style="${cam ? 'width:14px;height:14px;border:2px solid #fff;' : ''}"></div>
                    <div class="bus-info">
                        <div class="bus-line">Bus ${bus.busId} — ${bus.company} ${cam ? '📹' : ''}</div>
                        <div class="bus-detail">Línea ${bus.line} | ${bus.origin} → ${bus.destination} | ${bus.speed} km/h</div>
                    </div>
                `;
                list.appendChild(item);
            });
            
            if (filtered.length > 100) {
                const more = document.createElement('div');
                more.style.cssText = 'text-align:center;padding:10px;color:#6b7280;font-size:12px;';
                more.textContent = `+${filtered.length - 100} buses más...`;
                list.appendChild(more);
            }
        }

        function filterCompany(company) {
            activeCompany = company;
            document.querySelectorAll('.company-tag').forEach(el => {
                el.classList.toggle('active', 
                    (company === 'all' && el.classList.contains('all')) || 
                    el.classList.contains(company)
                );
            });
            markers.forEach(m => map.removeLayer(m));
            markers.clear();
            updateMap();
            updateStats();
            updateBusList();
        }

        function toggleCameraFilter() {
            showCameraOnly = !showCameraOnly;
            document.getElementById('cameraBtn').textContent = showCameraOnly ? '📹 CON CÁMARA' : ' TODOS';
            document.getElementById('cameraBtn').style.background = showCameraOnly ? '#3b82f6' : '#374151';
            markers.forEach(m => map.removeLayer(m));
            markers.clear();
            updateMap();
            updateStats();
            updateBusList();
        }

        function startTracking() {
            isRunning = true;
            document.getElementById('startBtn').disabled = true;
            document.getElementById('stopBtn').disabled = false;
            document.getElementById('statusBadge').textContent = 'EN VIVO';
            document.getElementById('statusBadge').className = 'status-badge active';
            fetchBuses();
            refreshInterval = setInterval(fetchBuses, 7000);
        }

        function stopTracking() {
            isRunning = false;
            document.getElementById('startBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
            document.getElementById('statusBadge').textContent = 'DETENIDO';
            document.getElementById('statusBadge').className = 'status-badge inactive';
            if (refreshInterval) { clearInterval(refreshInterval); refreshInterval = null; }
        }

        initMap();
    </script>
</body>
</html>
